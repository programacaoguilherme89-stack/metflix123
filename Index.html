Devias agradecer-me,

00:45:03.634 --> 00:45:05.886
sem o Bifrost,
de quanta energia negra

00:45:05.887 --> 00:45:08.847
precisou o Pai dos deuses
para te pôr cá,

00:45:08.848 --> 00:45:10.887
na tua adorada Terra?

00:45:14.312 --> 00:45:16.267
Julguei-te morto.

00:45:17.231 --> 00:45:19.107
E choraste-me?

00:45:19.108 --> 00:45:21.192
Chorámos-te todos.
O nosso pai...

00:45:21.193 --> 00:45:24.818
<i>Teu</i> pai.

00:45:26.032 --> 00:45:29.572
Contou-te de quem sou
realmente filho?

00:45:31.412 --> 00:45:33.872
Fomos criados juntos.

00:45:33.873 --> 00:45:37.042
Brincámos juntos,
brigámos juntos!

00:45:37.043 --> 00:45:41.084
- Esqueceste tudo isso?
- Recordo uma sombra.

00:45:41.881 --> 00:45:45.630
De viver à sombra
da tua grandeza.

00:45:45.801 --> 00:45:51.097
Recordo jogares-me num abismo,
a mim que era, e devia ser, o rei!

00:45:51.098 --> 00:45:55.769
Portanto vingas despeitos imaginários
no planeta que amo?

00:45:55.770 --> 00:45:58.810
Não, a Terra está
sob minha protecção, Loki.

00:45:59.357 --> 00:46:03.360
E que bem-sucedido
estás a ser a defendê-la.

00:46:03.361 --> 00:46:07.447
Humanos chacinam-se uns aos outros
e tu cruzas os braços.

00:46:07.448 --> 00:46:09.866
Quero dominá-los,
e porque não?

00:46:09.867 --> 00:46:12.073
Achas-te superior a eles?

00:46:12.495 --> 00:46:13.745
Acho.

00:46:13.746 --> 00:46:16.911
Porque desconheces
a principal regra para governar.

00:46:16.999 --> 00:46:19.080
Não merecerias um trono.

00:46:23.548 --> 00:46:26.633
Vi mundos cuja existência
nem conheces!

00:46:26.634 --> 00:46:31.096
Tornei-me, Odinson,
mais forte com o exílio.

00:46:31.097 --> 00:46:34.641
Vi o real poder do Tesseract,
e quando ele for meu...

00:46:34.642 --> 00:46:37.098
Quem to revelou?

00:46:37.478 --> 00:46:39.062
Quem controla
quem quer ser rei?

00:46:39.063 --> 00:46:41.064
- Eu <i>sou</i> rei!
- Cá, não!

00:46:41.065 --> 00:46:45.732
Entrega o Tesseract, desiste
desse sonho envenenado!

00:46:47.697 --> 00:46:49.652
Volta para casa.

00:46:53.911 --> 00:46:55.742
Não tenho casa.

00:46:57.248 --> 00:47:02.082
Precisas do Cubo para me pôr em casa,
mas joguei-o fora, não sei para onde.

00:47:02.628 --> 00:47:05.126
Ouve-me bem, irmão.

00:47:06.424 --> 00:47:08.254
Estou a ouvir...

00:47:16.767 --> 00:47:18.560
Não voltes a tocar-me.

00:47:18.561 --> 00:47:20.353
Pois não leves o que é meu.

00:47:20.354 --> 00:47:23.269
Não fazes ideia
do que há aqui.

00:47:24.442 --> 00:47:26.147
Shakespeare ao ar livre?

00:47:26.903 --> 00:47:30.196
Sabe vossa mãe que vestis
roupagens dela?

00:47:30.197 --> 00:47:33.158
Isto transcende-te,
Homem de Ferro.

00:47:33.159 --> 00:47:35.493
O Loki será levado
à Justiça asgardiana.

00:47:35.494 --> 00:47:39.247
Devolve o Cubo e é todo teu,
até lá...

00:47:39.248 --> 00:47:41.204
Não te metas.

00:47:42.084 --> 00:47:43.790
Turista.

00:47:49.091 --> 00:47:50.797
Muito bem...

00:48:19.914 --> 00:48:23.041
<i>Energia com capacidade
a 400%.

00:48:23.042 --> 00:48:25.248
Caramba...

00:49:28.608 --> 00:49:30.522
Chega!

00:49:33.738 --> 00:49:35.697
Não sei o que planeias
fazer aqui...

00:49:35.698 --> 00:49:38.199
Vim pôr ponto final
aos esquemas do Loki.

00:49:38.200 --> 00:49:40.911
Pois prova-o,
largando esse martelo.

00:49:40.912 --> 00:49:41.953
Não...

00:49:41.954 --> 00:49:44.035
Má ideia, ele adora
o seu martelo.

00:49:45.166 --> 00:49:48.039
Queres que largue o martelo?

00:50:14.695 --> 00:50:17.068
Para já, acabámos?

00:51:04.328 --> 00:51:07.956
Para o caso de estar
pouco claro...

00:51:07.957 --> 00:51:10.455
Tenta escapar,

00:51:10.877 --> 00:51:13.833
arranha meramente esse vidro...

00:51:22.763 --> 00:51:27.309
E cai 10 mil metros,
em linha recta!

00:51:27.310 --> 00:51:30.100
Percebeu como funciona?

00:51:31.439 --> 00:51:34.771
Formiga, bota...

00:51:37.445 --> 00:51:39.776
A jaula é de respeito.

00:51:40.072 --> 00:51:43.033
Não construída, calculo,
para mim.

00:51:43.034 --> 00:51:45.660
Para alguém bem mais poderoso.

00:51:45.661 --> 00:51:48.284
É, eu soube...

00:51:48.539 --> 00:51:50.412
<i>Uma criatura sem senso.</i>

00:51:50.750 --> 00:51:53.081
<i>Que finge ainda ser homem.</i>

00:51:53.461 --> 00:51:55.879
<i>Deve estar desesperado,</i>

00:51:55.880 --> 00:51:59.174
<i>para depender de tais criaturas</i>
<i>para os defender?</i>

00:51:59.175 --> 00:52:01.718
<i>Se estou desesperado?</i>

00:52:01.719 --> 00:52:03.762
Ameaça o meu mundo
com a guerra,

00:52:03.763 --> 00:52:06.097
rouba uma força
que nunca controlará,

00:52:06.098 --> 00:52:10.185
fala de paz mas mata,
por isso o divertir...

00:52:10.186 --> 00:52:13.313
Pôs-me desesperado, sim.

00:52:13.314 --> 00:52:15.937
E talvez disso se arrependa.

00:52:18.486 --> 00:52:22.485
Não suporta
ter chegado tão perto.

00:52:23.199 --> 00:52:26.614
Ter o Tesseract, ter poder,

00:52:26.702 --> 00:52:29.162
poder ilimitado.

00:52:29.163 --> 00:52:31.828
E para quê?

00:52:32.750 --> 00:52:33.500
Uma luz cálida que
toda a humanidade partilhasse.

00:52:33.501 --> 00:52:36.836
Uma luz cálida que
toda a humanidade partilhasse.

00:52:36.837 --> 00:52:40.712
E a seguir ser lembrado
do que é verdadeiro poder.

00:52:44.178 --> 00:52:49.137
Se o "verdadeiro poder" quiser
uma revista que ler, avise.

00:52:56.857 --> 00:53:00.610
- Aprende-se a gostar dele?
- O Loki vai prolongar a situação.

00:53:00.611 --> 00:53:04.281
Thor, qual é o plano dele?

00:53:04.282 --> 00:53:07.075
Tem um exército,
os Chitauri.

00:53:07.076 --> 00:53:10.412
Não são de Asgard
nem de outro mundo conhecido.

00:53:10.413 --> 00:53:12.706
Tenciona comandá-los
contra o vosso povo.

00:53:12.707 --> 00:53:16.459
Dar-lhe-ão a terra em troca,
presumo, do Tesseract.

00:53:16.460 --> 00:53:18.378
Um exército...

00:53:18.379 --> 00:53:20.297
Vindo do espaço.

00:53:20.298 --> 00:53:22.841
Ou seja, vai construir
outro portal.

00:53:22.842 --> 00:53:24.384
É para que precisa
do Erik Selvig.

00:53:24.385 --> 00:53:25.343
Selvig?

00:53:25.344 --> 00:53:28.054
- Um astrofísico.
- Um amigo.

00:53:28.055 --> 00:53:32.017
O Loki tem-no sob algum feitiço,
como um dos nossos.

00:53:32.018 --> 00:53:35.270
Porque se deixou ele aprisionar?
Daqui não comandará exércitos.

00:53:35.271 --> 00:53:37.147
E esquecermos o Loki?

00:53:37.148 --> 00:53:40.650
O tipo não tem os parafusos todos,
cheira a louco à distância.

00:53:40.651 --> 00:53:42.903
Atenção a como falas.

00:53:42.904 --> 00:53:45.530
Ele pode estar perdido
mas é de Asgard.

00:53:45.531 --> 00:53:46.656
E meu irmão.

00:53:46.657 --> 00:53:49.280
Matou oitenta pessoas
em dois dias...

00:53:49.619 --> 00:53:50.744
Foi adoptado.

00:53:50.745 --> 00:53:53.246
Interessa-me mais
a parte técnica.

00:53:53.247 --> 00:53:55.415
Para que precisarão eles
do irídio?

00:53:55.416 --> 00:53:56.541
É agente estabilizador.

00:53:56.542 --> 00:53:59.753
Escolhe só um fim de semana
e ponho-te em Portland.

00:53:59.754 --> 00:54:01.504
Mantém a chama do amor.

00:54:01.505 --> 00:54:05.634
Portanto, o portal não se desmoronará
como aconteceu na S.H.I.E.L.D.

00:54:05.635 --> 00:54:09.054
Podes ficar consolado,
és um lutador e tanto.

00:54:09.055 --> 00:54:11.556
E que o portal
não se pode abrir tanto

00:54:11.557 --> 00:54:14.639
ou durante o tempo
que o Loki precisa.

00:54:14.644 --> 00:54:17.517
Icem as velas
e subam à gávea...

00:54:18.606 --> 00:54:20.437
Aquele está a jogar Galaga.

00:54:20.816 --> 00:54:24.899
Julgou que não reparávamos,
mas enganou-se.

00:54:26.197 --> 00:54:28.740
- Como vê o Fury tudo isto?
- Virando-se.

00:54:28.741 --> 00:54:31.072
Deve ser cansativo...

00:54:31.702 --> 00:54:33.119
O Agente Barton
arranja facilmente

00:54:33.120 --> 00:54:36.081
o resto das matérias-primas.

00:54:36.082 --> 00:54:37.666
O único elemento vital
ainda faltando

00:54:37.667 --> 00:54:41.378
é uma fonte de energia
de alta densidade.

00:54:41.379 --> 00:54:44.839
Algo que faça
pôr a trabalhar o Cubo.

00:54:44.840 --> 00:54:47.884
Desde quando é perito
em astrofísica termonuclear?

00:54:47.885 --> 00:54:49.553
Desde ontem.

00:54:49.554 --> 00:54:52.973
Os papéis do Selvig
com as teorias de extracção...

00:54:52.974 --> 00:54:54.182
Fui o único a lê-los?

00:54:54.183 --> 00:54:57.143
O Loki precisa duma fonte
de energia especial?

00:54:57.144 --> 00:55:00.063
Terá de aquecer o Cubo
a 120 milhões de graus Kelvin

00:55:00.064 --> 00:55:01.731
só para penetrar
a barreira de Coulomb.

00:55:01.732 --> 00:55:04.234
A não ser que o Selvig
tenha descoberto como estabilizar

00:55:04.235 --> 00:55:06.945
- o efeito-túnel.
- Bom, se descobriu,

00:55:06.946 --> 00:55:09.406
obtém a fusão do ferro
em qualquer reactor do planeta.

00:55:09.407 --> 00:55:11.950
Finalmente, alguém
que fala inglês...

00:55:11.951 --> 00:55:14.160
Foi o que ele falou?

00:55:14.161 --> 00:55:16.329
Prazer em conhecê-lo,
Dr. Banner.

00:55:16.330 --> 00:55:19.583
O seu estudo às colisões
dos anti-electrões é notável.

00:55:19.584 --> 00:55:21.585
E admiro a maneira
como perde o controlo

00:55:21.586 --> 00:55:24.250
e se torna num monstro verde
enfurecido.

00:55:25.256 --> 00:55:26.423
Obrigado...

00:55:26.424 --> 00:55:29.134
O Dr. Banner só cá está
para procurar o Cubo,

00:55:29.135 --> 00:55:31.887
- esperei que o ajudasse.
- Comecemos pelo pauzinho dele.

00:55:31.888 --> 00:55:34.556
Será mágico, mas funciona muito
como uma arma da HYDRA.

00:55:34.557 --> 00:55:37.851
Isso não sei.
Mas deriva a energia do Cubo.

00:55:37.852 --> 00:55:39.769
E gostava de saber
como o usou o Loki

00:55:39.770 --> 00:55:43.732
para tornar dois homens cheios
de recursos em macacos voadores.

00:55:43.733 --> 00:55:47.023
- Macacos? Não percebo...
- Percebo eu.

00:55:49.363 --> 00:55:51.820
Percebi a referência...

00:55:52.158 --> 00:55:56.032
- Vamos brincar, doutor?
- É por aqui.

00:56:09.425 --> 00:56:11.176
A leitura aos raios gama

00:56:11.177 --> 00:56:13.637
apoia o relatório do Selvig
sobre o Tesseract.

00:56:13.638 --> 00:56:15.430
Serão semanas para o processar...

00:56:15.431 --> 00:56:18.225
Contornando o <i>mainframe</i>
e usando um grupo de computadores

00:56:18.226 --> 00:56:22.016
podemos medir isto
a cerca de 600 <i>teraflops.</i>

00:56:22.438 --> 00:56:25.103
Só trouxe a minha
escova de dentes...

00:56:25.483 --> 00:56:27.275
Devia visitar a Torre Stark,

00:56:27.276 --> 00:56:29.527
todos os últimos dez andares
são laboratórios...

00:56:29.528 --> 00:56:31.321
Ia adorar.

00:56:31.322 --> 00:56:34.074
Obrigado, mas a última vez
que fui a Nova Iorque

00:56:34.075 --> 00:56:36.785
quase destruí Harlem...

00:56:36.786 --> 00:56:41.369
O ambiente é livre de stress,
não há lá tensões, surpresas...

00:56:42.124 --> 00:56:43.833
Nada?

00:56:43.834 --> 00:56:46.211
- Serás doido?
- Aí vem a autoridade.

00:56:46.212 --> 00:56:47.504
Consegue controlar-se, não?
Qual é o segredo?

00:56:47.505 --> 00:56:50.090
Jazz, tambores,
uns tantos charros?

00:56:50.091 --> 00:56:52.676
- Fazes graça com tudo, é?
- Só com o que tem.

00:56:52.677 --> 00:56:55.303
Pôr em risco toda a gente aqui
não tem graça.

00:56:55.304 --> 00:56:58.682
- Sem ofensa...
- Tudo bem, não tinha vindo

00:56:58.683 --> 00:57:01.643
se não soubesse como lidar
com alfinetadas.

00:57:01.644 --> 00:57:04.312
Seja menos cauteloso, matulão,
pavoneie-se mais.

00:57:04.313 --> 00:57:06.106
Concentre-se é
no problema, Sr. Stark.

00:57:06.107 --> 00:57:07.816
Não é o que faço?

00:57:07.817 --> 00:57:10.652
Porque nos chamou o Fury?
Porquê agora e não antes?

00:57:10.653 --> 00:57:12.529
Que não nos conta?

00:57:12.530 --> 00:57:15.073
Só resolvo a equação
tendo todas as variáveis.

00:57:15.074 --> 00:57:16.324
Acha que ele esconde
alguma coisa?

00:57:16.325 --> 00:57:19.578
É espião.
Capitão, ele é <i>o</i> espião.

00:57:19.579 --> 00:57:21.496
Os segredos dele têm segredos.

00:57:21.497 --> 00:57:23.745
Também o irrita a ele?

00:57:25.543 --> 00:57:27.377
Quero só terminar
o meu trabalho aqui e...

00:57:27.378 --> 00:57:29.084
Doutor?

00:57:33.885 --> 00:57:38.555
"Cálida luz para a humanidade", o
que disse o Loki ao Fury sobre o Cubo.

00:57:38.556 --> 00:57:42.680
- Eu ouvi.
- Acho que a dirigia a si.

00:57:43.185 --> 00:57:46.187
Mesmo que o Barton
tenha escondido a torre ao Loki

00:57:46.188 --> 00:57:50.188
- ela foi notícia em todo o lado.
- A Torre Stark? Aquele medonho...

00:57:51.110 --> 00:57:52.402
Edifício em Nova Iorque?

00:57:52.403 --> 00:57:56.114
Tem um reactor próprio que
lhe proporciona energia própria.

00:57:56.115 --> 00:57:58.658
O prédio é auto-suficiente
por quanto, um ano?

00:57:58.659 --> 00:58:00.035
É só o protótipo...

00:58:00.036 --> 00:58:03.243
Neste momento só eu
produzo energia limpa.

00:58:03.247 --> 00:58:04.539
É o que ele quer.

00:58:04.540 --> 00:58:07.250
Porque não o incluiu então
a S.H.I.E.L.D. no Projecto Tesseract,

00:58:07.251 --> 00:58:10.670
que interesse tem ela
em negócios energéticos?

00:58:10.671 --> 00:58:12.464
É o que tentarei saber

00:58:12.465 --> 00:58:14.174
mal o meu programa de descodificação

00:58:14.175 --> 00:58:15.884
leia todas as pastas seguras
da S.H.I.E.L.D.

00:58:15.885 --> 00:58:17.052
Quer dizer...

00:58:17.053 --> 00:58:19.221
O Jarvis trata disso
desde que cheguei à ponte,

00:58:19.222 --> 00:58:21.097
daqui a horas sei
todos os segredos sujos

00:58:21.098 --> 00:58:22.224
que a S.H.I.E.L.D. tenta esconder.

00:58:22.225 --> 00:58:23.308
Arandos?

00:58:23.309 --> 00:58:25.352
Não foi por isso
que não o quiseram cá.

00:58:25.353 --> 00:58:28.438
Uma organização secreta
que teme inteligência?

00:58:28.439 --> 00:58:30.023
Historicamente, é fraco.

00:58:30.024 --> 00:58:32.484
Acho que o Loki
nos tenta irritar.

00:58:32.485 --> 00:58:34.277
Ele tenta iniciar uma guerra

00:58:34.278 --> 00:58:37.030
e ou nos concentramos nisso,
ou consegue.

00:58:37.031 --> 00:58:39.950
Deram-nos ordens,
devemos segui-las.

00:58:39.951 --> 00:58:42.198
Segui-las nunca foi
o meu estilo.

00:58:43.162 --> 00:58:45.664
E para si, o estilo é tudo?

00:58:45.665 --> 00:58:46.873
De nós três aqui

00:58:46.874 --> 00:58:50.001
quem usa a) um fato ridículo
e, b) não serve para nada?

00:58:50.002 --> 00:58:54.961
Steve, diz que não achas nada
nisto um pouco esquisito?

00:58:57.301 --> 00:58:59.758
Encontrem é o Cubo.

00:59:11.023 --> 00:59:13.483
É dele que o meu pai
não para de falar?

00:59:13.484 --> 00:59:16.274
Deviam tê-lo conservado
no gelo...

00:59:17.029 --> 00:59:20.782
Está certo quanto ao Loki,
ele leva-nos vantagem.

00:59:20.783 --> 00:59:25.537
O que tem é umas barras de dinamite
que lhe vão rebentar na cara.

00:59:25.538 --> 00:59:28.123
E vou estar lá para ver.

00:59:28.124 --> 00:59:30.997
Eu prefiro depois ler...

00:59:32.295 --> 00:59:34.334
Ou mascara-se tal como nós.

00:59:35.298 --> 00:59:39.092
Bom, eu cá não tenho
nenhuma armadura...

00:59:39.093 --> 00:59:42.596
Estou exposto...
Como um nervo.

00:59:42.597 --> 00:59:44.472
É de pesadelo.

00:59:44.473 --> 00:59:47.267
Eu tenho uma data de estilhaços

00:59:47.268 --> 00:59:49.394
tentando meter-se-me
no coração.

00:59:49.395 --> 00:59:51.563
Isto detém-nos.

00:59:51.564 --> 00:59:54.562
Este circulozinho de luz
é agora parte de mim,

00:59:55.109 --> 00:59:57.440
não só armadura.

00:59:57.445 --> 01:00:00.238
É um terrível privilégio.

01:00:00.239 --> 01:00:02.657
- Mas sabe controlá-lo?
- Porque aprendi como.

01:00:02.658 --> 01:00:04.034
É diferente.

01:00:04.035 --> 01:00:07.537
Li tudo sobre o seu acidente.

01:00:07.538 --> 01:00:10.957
Tanta exposição a raios gama
devia tê-lo matado.

01:00:10.958 --> 01:00:14.124
Está a dizer que o Hulk...

01:00:14.879 --> 01:00:17.756
Que o "outro",
me salvou a vida?

01:00:17.757 --> 01:00:19.587
Que bom...

01:00:19.759 --> 01:00:24.217
É boa, a sensação...
Mas salvou-a para quê?

01:00:24.847 --> 01:00:27.470
É o que descobriremos.

01:00:28.517 --> 01:00:32.934
- Pode não vir a gostar...
- E você, sim.

01:00:35.107 --> 01:00:37.647
DEPÓSITO SEGURO 10º C

01:01:31.497 --> 01:01:34.875
Quando o Loki levou o doutor,
contactámos a Jane Foster.

01:01:34.876 --> 01:01:37.335
Há um observatório excelente
em Tromso.

01:01:37.336 --> 01:01:41.006
E ela foi convidada
a ir lá de repente, ontem.

01:01:41.007 --> 01:01:45.507
Recebendo bom dinheiro,
em jacto particular, sítio remoto...

01:01:45.761 --> 01:01:48.968
- Estará em segurança.
- Obrigado.

01:01:50.016 --> 01:01:52.722
Não foi por nada
que o Loki quis o Erik Selvig.

01:01:53.060 --> 01:01:55.812
Receio o que lhe reserva,
uma vez desnecessário.

01:01:55.813 --> 01:01:58.728
- O Erik é boa pessoa.
- Fala muito em si.

01:01:59.942 --> 01:02:02.649
Mudou a vida dele.

01:02:03.696 --> 01:02:05.697
Mudou tudo por cá, aliás...

01:02:05.698 --> 01:02:08.366
Vocês estavam melhor, antes.

01:02:08.367 --> 01:02:10.619
Em Asgard fingimos
estar mais avançados

01:02:10.620 --> 01:02:14.414
mas viemos cá armados
em bilge snipes.

01:02:14.415 --> 01:02:16.374
- Em quê?
- Bilge snipes.

01:02:16.375 --> 01:02:20.083
São grandes, têm escamas,
chifres...

01:02:20.213 --> 01:02:22.130
- Não os têm cá?
- Não que saiba.

01:02:22.131 --> 01:02:24.712
São repugnantes.

01:02:25.343 --> 01:02:28.299
E pisam tudo
o que tiverem à frente.

01:02:35.269 --> 01:02:37.312
Quando primeiro cá vim

01:02:37.313 --> 01:02:41.187
fui seguido pela ira do Loki,
e pagaram vocês.

01:02:41.192 --> 01:02:43.690
E a história repete-se.

01:02:45.530 --> 01:02:48.695
Em novo, cortejava a guerra.

01:02:49.742 --> 01:02:52.449
A guerra ainda não começou.

01:02:53.037 --> 01:02:56.206
Consegue fazer o Loki dizer
onde está o Tesseract?

01:02:56.207 --> 01:02:59.584
Não sei, a mente dele
funciona estranhamente,

01:02:59.585 --> 01:03:04.422
ele não ambiciona só o poder
mas vingar-se, de mim.

01:03:04.423 --> 01:03:07.172
Dor alguma lhe arrancava
essa vontade.

01:03:07.635 --> 01:03:09.970
Há muito quem pense isso,

01:03:09.971 --> 01:03:12.135
até a dor começar.

01:03:13.766 --> 01:03:15.392
Que me pede que faça?

01:03:15.393 --> 01:03:19.104
Peço que faça aquilo
para que estiver preparado.

01:03:19.105 --> 01:03:20.313
O Loki é prisioneiro.

01:03:20.314 --> 01:03:22.899
Então porque sinto ser ele
o único nesta embarcação

01:03:22.900 --> 01:03:24.939
a querer <i>estar</i> nela?

01:03:36.914 --> 01:03:40.125
Muito poucos conseguem
aparecer-me de surpresa...

01:03:40.126 --> 01:03:42.457
Mas esperou que eu viesse.

01:03:42.461 --> 01:03:44.667
Depois.

01:03:44.922 --> 01:03:48.466
Depois das torturas que
o Fury conseguisse magicar

01:03:48.467 --> 01:03:52.842
aparecer-me-ia como
uma amiga, um bálsamo...

01:03:53.139 --> 01:03:54.890
E eu colaborava.

01:03:54.891 --> 01:03:57.183
Quero saber o que fez
ao Agente Barton.

01:03:57.184 --> 01:03:59.557
Expandi a mente dele.

01:04:01.606 --> 01:04:04.229
E uma vez tendo ganho,

01:04:04.400 --> 01:04:07.565
uma vez sendo já
o rei da montanha...

01:04:07.820 --> 01:04:11.027
Que acontece à mente dele?

01:04:11.741 --> 01:04:13.658
Fala o amor, Agente Romanoff?

01:04:13.659 --> 01:04:16.991
Amor é para miúdos,
eu tenho uma dívida a pagar.

01:04:20.208 --> 01:04:22.247
Conte.

01:04:26.422 --> 01:04:30.380
Antes de trabalhar na S.H.I.E.L.D...

01:04:32.136 --> 01:04:36.139
Bom, tinha uma certa fama.

01:04:36.140 --> 01:04:39.267
Possuo qualidades muito específicas.

01:04:39.268 --> 01:04:43.560
E não me interessava para quem
as usava, ou em quê.

01:04:43.940 --> 01:04:48.064
A S.H.I.E.L.D. reparou em mim
pelas piores razões.

01:04:48.611 --> 01:04:52.235
E mandou o Agente Barton
matar-me.

01:04:52.573 --> 01:04:54.779
Mas decidiu outra coisa.

01:04:56.077 --> 01:04:59.496
E que faz se eu jurar poupá-lo?

01:04:59.497 --> 01:05:03.538
- Não o solto...
- Estou a adorar isto.

01:05:03.793 --> 01:05:07.337
O seu mundo prestes a sumir
e regateia uma vida.

01:05:07.338 --> 01:05:09.548
Regimes caem todos os dias...

01:05:09.549 --> 01:05:13.798
Nunca os choro, sou russa.
Ou era...

01:05:14.470 --> 01:05:16.596
E que é agora?

01:05:16.597 --> 01:05:19.724
Não é assim tão complicado,

01:05:19.725 --> 01:05:24.476
tenho uma dívida para com ele
e quero livrar-me dela.

01:05:24.814 --> 01:05:26.936
E pode?

01:05:27.650 --> 01:05:32.150
Consegue livrar-se
duma dívida desse tamanho?

01:05:32.613 --> 01:05:34.986
Da filha do Dreykov.

01:05:35.825 --> 01:05:38.406
Em São Paulo,

01:05:38.744 --> 01:05:41.659
no incêndio no hospital?

01:05:42.081 --> 01:05:44.541
O Barton contou-me tudo.

01:05:44.542 --> 01:05:47.794
A sua dívida é das
que escorrem em golfadas

01:05:47.795 --> 01:05:50.422
e acha que salvar um homem
igualmente pouco virtuoso

01:05:50.423 --> 01:05:51.882
alterará tudo?

01:05:51.883 --> 01:05:54.676
Isso é do mais baixo
sentimentalismo,

01:05:54.677 --> 01:05:57.053
é duma ingenuidade confrangedora,

01:05:57.054 --> 01:05:58.968
é patético!

01:05:59.181 --> 01:06:01.850
<i>Mentes e matas</i>

01:06:01.851 --> 01:06:05.020
<i>às ordens de aldrabões</i>
<i>e assassinos.</i>

01:06:05.021 --> 01:06:07.981
VÍRUS DETETADO
ACESSO NEGADO

01:06:07.982 --> 01:06:11.484
<i>Finges ser melhor,</i>
<i>reger-te por um código próprio,</i>

01:06:11.485 --> 01:06:14.901
<i>um que compense</i>
<i>os horrores praticados.</i>

01:06:15.198 --> 01:06:17.699
<i>Mas eles são parte de ti.</i>

01:06:17.700 --> 01:06:21.699
<i>E nunca te largarão.</i>

01:06:22.246 --> 01:06:25.707
Não toco no Barton enquanto
não o obrigar a matar-te,

01:06:25.708 --> 01:06:28.084
devagar, intimamente,

01:06:28.085 --> 01:06:30.629
de todas as formas
que sabe receares.

01:06:30.630 --> 01:06:33.924
E depois desperto-o
só para ver a sua linda obra

01:06:33.925 --> 01:06:37.385
e quando gritar,
racho-lhe o crânio!

01:06:37.386 --> 01:06:41.136
É esta a minha oferta,
verme choramingas.

01:06:42.099 --> 01:06:44.389
É um monstro.

01:06:45.895 --> 01:06:48.101
Não, não sou...

01:06:48.314 --> 01:06:50.520
Criaram vocês o monstro.

01:06:52.860 --> 01:06:55.108
O Banner...

01:06:55.530 --> 01:06:58.528
- É a sua jogada.
- Como?

01:06:58.824 --> 01:07:00.575
O Loki planeia soltar o Hulk,

01:07:00.576 --> 01:07:02.160
E manter o Banner no laboratório.
Estou a caminho.

01:07:02.161 --> 01:07:03.908
E chame o Thor.

01:07:04.747 --> 01:07:06.414
Obrigada,

01:07:06.415 --> 01:07:09.289
pela grande ajuda.

01:07:16.092 --> 01:07:17.634
Que faz, Sr. Stark?

01:07:17.635 --> 01:07:20.262
Tenho pensado o mesmo
a seu respeito...

01:07:20.263 --> 01:07:22.264
Devia procurar o Tesseract.

01:07:22.265 --> 01:07:25.392
E procuramos, pela assinatura
dos raios gama,

01:07:25.393 --> 01:07:28.687
mal dermos com ela terá um raio
de 800m onde o procurar.

01:07:28.688 --> 01:07:31.106
E terá o seu Cubo de volta,
sem mais complicações.

01:07:31.107 --> 01:07:32.941
E terá o seu Cubo de volta,
sem mais complicações.

01:07:32.942 --> 01:07:34.731
O que é a Fase 2?

01:07:36.362 --> 01:07:39.281
A Fase 2 é o uso do Cubo pela
S.H.I.E.L.D. para fazer armas.

01:07:39.282 --> 01:07:41.116
Desculpem, o computador
estava lento de mais para mim.

01:07:41.117 --> 01:07:44.035
Reunimos todos os dados
referentes ao Tesseract.

01:07:44.036 --> 01:07:49.082
- Isto não significa que...
- Desculpa, Nick. Que mentias tu?

01:07:49.083 --> 01:07:51.710
Estava enganado, Director,
o mundo não mudou nada.

01:07:51.711 --> 01:07:52.961
Sabiam disto?

01:07:52.962 --> 01:07:55.755
Contempla retirar-se
deste projecto, doutor?

01:07:55.756 --> 01:07:58.091
Estava em CaIcutá,
mais retirado que isso...

01:07:58.092 --> 01:08:01.094
- O Loki manipula-o.
- E que tem você feito?

01:08:01.095 --> 01:08:02.888
Não veio por eu
lhe ter feito olhinhos.

01:08:02.889 --> 01:08:05.557
Não vou desistir por
subitamente estar nervosa.

01:08:05.558 --> 01:08:08.643
Quero saber porque usa
a S.H.I.E.L.D. o Tesseract

01:08:08.644 --> 01:08:11.601
para construir armas
de destruição massiva.

01:08:11.606 --> 01:08:13.436
Por causa dele.

01:08:13.858 --> 01:08:15.563
De mim?

01:08:15.985 --> 01:08:18.486
O ano passado a Terra
teve um visitante de outro planeta

01:08:18.487 --> 01:08:21.781
que arrasou uma aldeia
devido a uma briga.

01:08:21.782 --> 01:08:24.159
Soubemos que nem apenas
não estamos sós

01:08:24.160 --> 01:08:27.829
como desesperadamente,
risivelmente, indefesos.

01:08:27.830 --> 01:08:30.207
O meu povo só quer a paz
com o vosso planeta.

01:08:30.208 --> 01:08:32.292
Mas há outros povos
espaço fora?

01:08:32.293 --> 01:08:34.419
E não são a única ameaça.

01:08:34.420 --> 01:08:38.169
O mundo está a encher-se
de gente incontrolável,

01:08:38.216 --> 01:08:40.800
- que não é controlável.
- Como não controlou o Cubo?

01:08:40.801 --> 01:08:44.888
Foi o vosso uso do Tesseract
que atraiu o Loki e seus aliados.

01:08:44.889 --> 01:08:46.473
É um sinal a todos os reinos

01:08:46.474 --> 01:08:49.184
que a Terra pode travar guerras
a um nível superior.

01:08:49.185 --> 01:08:51.686
- "Superior"?
- Forçaram-nos a mão.

01:08:51.687 --> 01:08:53.772
- Tínhamos de arranjar...
- Um dissuasor nuclear.

01:08:53.773 --> 01:08:55.941
Porque esse acalma
sempre tudo.

01:08:55.942 --> 01:08:58.485
Lembre-me como fez
a sua fortuna, Stark?

01:08:58.486 --> 01:09:00.946
Se ainda fabricasse armas
o Stark estaria até ao pescoço...

01:09:00.947 --> 01:09:03.907
- O mau da fita agora sou eu?
- Não é sempre?

01:09:03.908 --> 01:09:05.951
Pensei os humanos
mais evoluídos que isto.

01:09:05.952 --> 01:09:08.954
Perdão, fomos ao teu planeta
rebentar com coisas?

01:09:08.955 --> 01:09:10.914
Desconfiam dos vossos paladinos...

01:09:10.915 --> 01:09:14.543
São assim ingénuos? A S.H.I.E.L.D.
monitoriza ameaças potenciais.

01:09:14.544 --> 01:09:16.002
O Capitão América
vigia ameaças?

01:09:16.003 --> 01:09:17.462
Todos o fazemos.

01:09:17.463 --> 01:09:20.423
Está na lista? Acima ou abaixo
de abelhas enfurecidas?

01:09:20.424 --> 01:09:22.217
Stark, diz mais uma piada...

01:09:22.218 --> 01:09:23.885
Ameaça verbal!
Sinto-me ameaçado.

01:09:23.886 --> 01:09:26.509
- Mostre algum respeito.
- Respeitar o quê?

01:09:33.729 --> 01:09:36.898
<i>Transporte 6-6-B,</i>
<i>comunique códigos de confirmação.</i>

01:09:36.899 --> 01:09:39.109
<i>Vejo-o no computador</i>
<i>mas não no registo para hoje.</i>

01:09:39.110 --> 01:09:41.361
<i>Qual é a sua carga?</i>

01:09:41.362 --> 01:09:44.569
Armas e munições.

01:09:52.290 --> 01:09:54.583
Falam de controlo
mas procuram o caos.

01:09:54.584 --> 01:09:57.836
É o <i>modus operandi</i> dele?
Somos o quê, uma equipa?

01:09:57.837 --> 01:10:00.881
Não, uma mistura química
fazedora de caos.

01:10:00.882 --> 01:10:02.966
Uma bomba-relógio.

01:10:02.967 --> 01:10:04.926
Precisa de se afastar.

01:10:04.927 --> 01:10:06.887
Ele não deve poder despejar?

01:10:06.888 --> 01:10:09.180
Sabe muito bem porquê.
Chegue-se para lá!

01:10:09.181 --> 01:10:11.516
Começo a querer
que tente obrigar-me...

01:10:11.517 --> 01:10:15.228
Pois, olha o matulão
da armadura...

01:10:15.229 --> 01:10:16.771
Despindo-a, o que fica?

01:10:16.772 --> 01:10:19.729
Um génio, bilionário,
<i>playboy,</i> filantropo...

01:10:20.026 --> 01:10:23.236
Há quem nada disso seja
e valendo dez de si.

01:10:23.237 --> 01:10:24.487
Já vi esse filme,

01:10:24.488 --> 01:10:27.320
a única coisa por que luta
mesmo é por si.

01:10:28.201 --> 01:10:30.243
Não é homem
para se sacrificar,

01:10:30.244 --> 01:10:32.871
para se deitar no arame farpado
para outros se salvarem.

01:10:32.872 --> 01:10:35.578
Eu corto antes o arame.

01:10:37.627 --> 01:10:39.920
Tem sempre saída...

01:10:39.921 --> 01:10:43.506
Pode não ser ameaça
mas pare de se fingir herói.

01:10:43.507 --> 01:10:45.926
Herói, como você?

01:10:45.927 --> 01:10:48.136
É uma experiência de laboratório,
Rogers,

01:10:48.137 --> 01:10:51.803
tudo o que há de especial em si
saiu de um tubo.

01:11:16.999 --> 01:11:19.789
Vista o fato,
mostremos o que valemos.

01:11:20.836 --> 01:11:24.798
Vocês são tão mesquinhos...
Tão ridículos.

01:11:24.799 --> 01:11:26.258
Pois, que equipa...

01:11:26.259 --> 01:11:28.134
Agente Romanoff, acompanha
o Dr. Banner ao seu...

01:11:28.135 --> 01:11:30.095
Quê? Alugou a outro
o meu quarto.

01:11:30.096 --> 01:11:31.930
A cela era para o caso...

01:11:31.931 --> 01:11:36.681
De ter de me matar.
Mas não pode, eu sei, já tentei.

01:11:38.854 --> 01:11:41.898
Estava deprimido,
não via escapatória.

01:11:41.899 --> 01:11:46.945
E meti uma bala na boca
e o outro tipo cuspiu-a.

01:11:46.946 --> 01:11:48.280
Por isso, continuei,

01:11:48.281 --> 01:11:51.241
concentrei-me em ajudar outros
e era bom nisso.

01:11:51.242 --> 01:11:54.995
Até me meter à força neste circo,
pondo todos em risco.

01:11:54.996 --> 01:11:59.704
Quer saber o meu segredo,
saber como mantenho a calma?

01:12:02.169 --> 01:12:04.793
Dr. Banner...

01:12:04.881 --> 01:12:06.878
Pouse o ceptro.

01:12:11.178 --> 01:12:13.134
ASSINATURA A 95%

01:12:14.932 --> 01:12:16.763
Encontrámo-lo.

01:12:17.226 --> 01:12:19.978
Lamento, putos, afinal não verão
o meu truque de magia.

01:12:19.979 --> 01:12:22.230
- Localizaste o Tesseract?
- Ponho-me lá num ápice.

01:12:22.231 --> 01:12:24.482
O lugar dele é em Asgard,
nenhum humano o controla.

01:12:24.483 --> 01:12:25.984
- Sozinho não vai.
- Impedes-me tu?

01:12:25.985 --> 01:12:28.403
- Vista o fato e já se vê.
- Sei bater em velhos...

01:12:28.404 --> 01:12:30.110
Vista-o.

01:12:30.740 --> 01:12:32.324
LOCAL DA ASSINATURA GAMA

01:12:32.325 --> 01:12:34.572
Ai meu Deus...

01:12:49.383 --> 01:12:52.382
- Vista o fato.
- Está bem.

01:12:54.639 --> 01:12:57.053
<i>Todos às suas estações.</i>

01:13:00.519 --> 01:13:02.437
- Hill!
- <i>Detonação no exterior.</i>

01:13:02.438 --> 01:13:04.898
Motor Três não operacional.

01:13:04.899 --> 01:13:07.359
Podem pô-lo a funcionar?

01:13:07.360 --> 01:13:09.236
A turbina parece intacta

01:13:09.237 --> 01:13:12.656
mas estando no ar não posso
sair para a reparar.

01:13:12.657 --> 01:13:15.325
Perdemos outro motor
e deixamos de estar.

01:13:15.326 --> 01:13:17.452
Alguém vá lá fora
reparar aquele motor.

01:13:17.453 --> 01:13:19.412
- Stark, ouviu?
- <i>Deixe comigo.</i>

01:13:19.413 --> 01:13:22.749
<i>Coulson, impeça qualquer saída</i>
<i>da zona de detenção</i>

01:13:22.750 --> 01:13:24.000
<i>e vá para o arsenal.</i>

01:13:24.001 --> 01:13:25.707
Romanoff!

01:13:28.548 --> 01:13:30.670
Nós estamos bem.

01:13:32.593 --> 01:13:34.549
Estamos, certo?

01:13:46.482 --> 01:13:47.816
Esse motor desligado.

01:13:47.817 --> 01:13:49.818
Brigada, espere
o desligar das câmaras.

01:13:49.819 --> 01:13:51.733
Mantenham-se juntos.

01:13:55.658 --> 01:13:58.490
Encontramo-nos
junto ao motor Três.

01:14:06.586 --> 01:14:08.583
Doutor?

01:14:10.047 --> 01:14:11.423
Bruce?

01:14:11.424 --> 01:14:15.840
Tens de resistir, é exactamente
isso que quer o Loki.

01:14:16.470 --> 01:14:19.052
Não há de ser nada,
ouves?

01:14:22.143 --> 01:14:24.436
Não há de ser nada,
prometo.

01:14:24.437 --> 01:14:27.188
Juro pela minha vida
que te safo desta,

01:14:27.189 --> 01:14:28.481
sobrevives a isto
e nunca, mas nunca...

01:14:28.482 --> 01:14:30.188
Tua vida?!

01:14:47.251 --> 01:14:48.957
Bruce...

01:15:25.957 --> 01:15:28.500
Dirige a embarcação
para 1-8-0 Sul!

01:15:28.501 --> 01:15:30.502
- Amara-nos já!
- Não tenho comandos,

01:15:30.503 --> 01:15:32.587
estão a recalibrar-se
após perda do motor.

01:15:32.588 --> 01:15:34.961
O Sol não está a nascer?

01:15:35.132 --> 01:15:37.551
- Está...
- Pois coloca-o à tua esquerda.

01:15:37.552 --> 01:15:39.219
Coloca-nos sobre água,

01:15:39.220 --> 01:15:41.926
perdemos outra turbina
e despenhamo-nos.

01:15:48.145 --> 01:15:49.976
Stark!

01:15:52.024 --> 01:15:53.775
Stark, estou aqui!

01:15:53.776 --> 01:15:55.982
<i>Óptimo.</i>

01:15:56.487 --> 01:15:58.613
<i>Vamos ver o que temos.</i>

01:15:58.614 --> 01:16:01.533
Tenho de ligar o sistema
de arrefecimento

01:16:01.534 --> 01:16:05.617
para poder aceder aos rotores
e remover os estilhaços.

01:16:07.498 --> 01:16:09.249
<i>Preciso que abras</i>
<i>o painel de controlo do motor</i>

01:16:09.250 --> 01:16:12.540
<i>e digas que relés</i>
<i>sofreram sobrecarga.</i>

01:16:25.182 --> 01:16:27.472
<i>Que vês tu aí?</i>

01:16:27.476 --> 01:16:30.145
Parece funcionar com
uma espécie de electricidade.

01:16:30.146 --> 01:16:32.519
Não te enganas...

01:17:35.670 --> 01:17:38.713
Não somos vossos inimigos,
Banner.

01:17:38.714 --> 01:17:40.920
Tenta pensar!

01:17:49.767 --> 01:17:51.977
<i>Bom, os relés estão intactos.</i>

01:17:51.978 --> 01:17:53.353
Que faço a seguir?

01:17:53.354 --> 01:17:56.940
Mesmo com os rotores limpos
isso precisa dum arranque,

01:17:56.941 --> 01:17:58.316
vou ter de ir lá e ligá-lo.

01:17:58.317 --> 01:18:00.277
Nesse caso será esfrangalhado.

01:18:00.278 --> 01:18:02.028
O estator pode reverter
a polaridade

01:18:02.029 --> 01:18:03.989
o suficiente para desligar
o <i>maglev,</i> o que...

01:18:03.990 --> 01:18:05.945
Não percebi nada!

01:18:06.576 --> 01:18:08.364
Vês uma alavanca vermelha?

01:18:08.953 --> 01:18:11.288
<i>Abranda os rotores o tempo</i>
<i>suficiente para eu sair.</i>

01:18:11.289 --> 01:18:13.745
Acerca-te dela
e espera ordem minha.

01:19:05.676 --> 01:19:08.133
Precisamos de evacuar
o hangar inferior.

01:19:10.723 --> 01:19:12.429
Granada!

01:19:26.781 --> 01:19:30.408
<i>Inimigos penetraram o perímetro</i>
<i>usando fardas da S.H.I.E.L.D.</i>

01:19:30.409 --> 01:19:33.032
<i>Sigam para os vossos postos.</i>

01:19:39.794 --> 01:19:42.128
<i>O Hulk e o Thor estão</i>
<i>no laboratório do Piso 4.</i>

01:19:42.129 --> 01:19:43.964
<i>Pisos 2 e 3 às escuras.</i>

01:19:43.965 --> 01:19:46.629
O Hulk vai destruir tudo!

01:19:47.176 --> 01:19:48.385
Distraiam-no.

01:19:48.386 --> 01:19:52.681
Escolta 6-0, dirija-se
a Wishbone e enfrente inimigo.

01:19:52.682 --> 01:19:56.097
- <i>Não se chegue de mais.</i>
- Entendido.

01:20:07.280 --> 01:20:09.402
Alvo em mira...

01:20:13.119 --> 01:20:15.116
Alvo debaixo de fogo.

01:20:25.673 --> 01:20:27.837
Alvo zangado, muito!

01:21:35.576 --> 01:21:38.408
Eles não se dirigem para cá,
portanto que raio...?

01:21:51.509 --> 01:21:54.174
AVARIA MOTOR 1
PERDA DE ENERGIA

01:21:56.180 --> 01:21:59.137
<i>O motor 1 deixou</i>
<i>de estar operacional.</i>

01:22:06.983 --> 01:22:09.234
Estamos em queda livre.

01:22:09.235 --> 01:22:11.611
Nós perdemos o motor 1.

01:22:11.612 --> 01:22:13.530
<i>Foi o Barton,</i>
<i>destruiu os sistemas.</i>

01:22:13.531 --> 01:22:15.862
<i>Dirige-se ao piso de detenções.</i>

01:22:16.117 --> 01:22:18.782
<i>Alguém me escuta?</i>

01:22:19.245 --> 01:22:21.538
Aqui Agente Romanoff.

01:22:21.539 --> 01:22:23.703
Escuto.

01:22:27.587 --> 01:22:30.794
- <i>Stark, perdemos altitude.</i>
- Pois, reparei...

01:22:59.327 --> 01:23:00.949
Não!

01:23:07.877 --> 01:23:11.251
Será que cais sempre
no mesmo truque?

01:23:53.589 --> 01:23:56.504
Os humanos julgam-nos imortais.

01:23:56.926 --> 01:23:59.090
Testamos se é verdade?

01:24:01.222 --> 01:24:03.136
Afaste-se disso.

01:24:06.894 --> 01:24:09.100
Gosta disto?

01:24:09.313 --> 01:24:13.313
Preparamos o protótipo
desde que enviou o Destruidor.

01:24:13.860 --> 01:24:16.775
Nem eu sei o que faz.

01:24:16.904 --> 01:24:18.818
Quer descobrir?

01:24:20.199 --> 01:24:22.280
Não!

01:25:31.145 --> 01:25:33.268
Natasha?

01:26:04.136 --> 01:26:06.593
Vai perder.

01:26:07.932 --> 01:26:09.846
Vou?

01:26:10.434 --> 01:26:13.016
Está-lhe na natureza.

01:26:15.106 --> 01:26:17.566
Os vossos heróis
estão espalhados.

01:26:17.567 --> 01:26:21.403
A vossa fortaleza voadora
está a cair do céu...

01:26:21.404 --> 01:26:23.697
E estou <i>eu</i> em desvantagem?

01:26:23.698 --> 01:26:26.199
Falta-lhe convicção.

01:26:26.200 --> 01:26:27.906
Não sou e...

01:26:34.458 --> 01:26:36.915
Então é o que ela faz...

01:26:38.004 --> 01:26:39.337
AVISO
ALTÍMETRO

01:26:39.338 --> 01:26:42.087
<i>Todos em posição de queda.</i>

01:27:08.951 --> 01:27:10.657
Puxa a alavanca.

01:27:10.661 --> 01:27:13.121
Dê-me um minuto!

01:27:13.122 --> 01:27:14.289
Alavanca...

01:27:14.290 --> 01:27:16.121
Agora!

01:27:27.345 --> 01:27:29.050
Socorro!

01:28:04.173 --> 01:28:07.592
Desculpe, chefe,
o deus escapou-se-me.

01:28:07.593 --> 01:28:10.804
Mantém-te desperto,
a olhar para mim.

01:28:10.805 --> 01:28:14.596
- Não, vou-me embora.
- Isso não é opção.

01:28:14.976 --> 01:28:17.640
Deixe lá, chefe...

01:28:18.855 --> 01:28:21.022
Isto nunca iria resultar,

01:28:21.023 --> 01:28:23.021
se eles não tivessem
qualquer coisa que...

01:28:23.651 --> 01:28:25.899
Para...

01:28:54.307 --> 01:28:56.721
<i>Agente Coulson abatido.</i>

01:28:57.518 --> 01:28:59.352
<i>Dirige-se para aí</i>
<i>uma equipa médica.</i>

01:28:59.353 --> 01:29:01.393
<i>Já aqui está.</i>

01:29:04.025 --> 01:29:06.356
<i>Declarou-o morto.</i>

01:29:22.126 --> 01:29:24.457
Encontrei-os no casaco
do Phil Coulson.

01:29:27.089 --> 01:29:29.838
Não os chegou a autografar...

01:29:32.720 --> 01:29:34.512
Estamos parados no ar.

01:29:34.513 --> 01:29:37.724
Os meios de comunicação,
a localização do Cubo...

01:29:37.725 --> 01:29:40.849
O Banner, o Thor...

01:29:41.812 --> 01:29:43.480
Não tenho nada para vocês.

01:29:43.481 --> 01:29:47.105
Perdi o meu único olho bom.

01:29:49.445 --> 01:29:52.235
Se calhar, mereci...

01:29:56.661 --> 01:29:58.658
Sim,

01:29:59.121 --> 01:30:03.959
íamos construir um arsenal
com o Tesseract.

01:30:03.960 --> 01:30:06.002
Mas nunca pus nele
todas as minhas fichas

01:30:06.003 --> 01:30:09.794
porque planeava uma coisa
ainda mais arriscada.

01:30:12.969 --> 01:30:17.802
- Havia uma ideia
- o Stark sabe dela -

01:30:18.975 --> 01:30:23.016
chamada Iniciativa Vingadores.

01:30:23.521 --> 01:30:29.022
A ideia era juntar um grupo
de gente notável

01:30:29.110 --> 01:30:32.358
e ver se se tornava
em algo mais.

01:30:33.364 --> 01:30:37.701
Se podiam trabalhar juntos
quando fosse preciso,

01:30:37.702 --> 01:30:41.618
para combater as batalhas
que nós não podíamos.

01:30:43.708 --> 01:30:49.250
O Phil Coulson morreu
ainda acreditando nessa ideia.

01:30:50.882 --> 01:30:53.254
Em heróis.

01:31:00.641 --> 01:31:02.889
Bom,

01:31:03.060 --> 01:31:06.434
é uma noção antiquada.

01:31:26.042 --> 01:31:29.207
<i>Você caiu do céu.</i>

01:31:42.600 --> 01:31:44.184
Feri alguém?

01:31:44.185 --> 01:31:47.395
Não há aqui ninguém
quem ferir.

01:31:47.396 --> 01:31:51.104
É certo que assustou de morte
uns tantos pombos...

01:31:51.526 --> 01:31:54.444
- Foi sorte.
- Ou só boa pontaria.

01:31:54.445 --> 01:31:56.568
Estava acordado, ao cair.

01:31:58.074 --> 01:32:00.200
- Assistiu?
- A tudo.

01:32:00.201 --> 01:32:01.993
Atravessou o telhado,

01:32:01.994 --> 01:32:06.081
grande, verde
e nuzinho em pelota.

01:32:06.082 --> 01:32:07.912
Tome.

01:32:08.584 --> 01:32:14.002
Não achei que lhe servissem,
até tomar um tamanho normal.

01:32:15.716 --> 01:32:17.464
Obrigado.

01:32:18.094 --> 01:32:19.799
É extraterrestre?

01:32:19.804 --> 01:32:21.304
Como?

01:32:21.305 --> 01:32:24.641
- Se veio do espaço.
- Não.

01:32:24.642 --> 01:32:28.433
Pois então de alguma doença
sofre, filho.

01:32:38.698 --> 01:32:41.613
Clint, isso não há de ser nada.

01:32:44.370 --> 01:32:46.659
Sabes isso?

01:32:47.290 --> 01:32:49.871
É o que achas?

01:32:51.627 --> 01:32:55.210
Não me resta tempo.

01:32:55.298 --> 01:32:57.212
Tenho de o tirar
de dentro de mim.

01:32:57.592 --> 01:32:59.551
Vais ter de normalizar,
e isso leva tempo.

01:32:59.552 --> 01:33:01.800
Não percebes...

01:33:03.055 --> 01:33:06.846
Já alguém entrou na tua mente
e brincou com ela?

01:33:07.101 --> 01:33:11.976
Arrancou-te dela,
e meteu lá outra coisa?

01:33:14.442 --> 01:33:17.357
Sabes o que é ser-se destruído?

01:33:18.279 --> 01:33:21.319
Bem sabes que sim.

01:33:28.206 --> 01:33:29.911
Porque voltei?

01:33:30.583 --> 01:33:34.916
- Como mo tiraste?
- Por recalibração cognitiva.

01:33:34.921 --> 01:33:37.714
Dei-te forte e feio na cabeça.

01:33:37.715 --> 01:33:39.421
Obrigado.

01:33:42.720 --> 01:33:44.426
Natasha...

01:33:45.556 --> 01:33:48.266
- Quantos agentes...
- Não perguntes.

01:33:48.267 --> 01:33:51.061
Não faças isto a ti próprio.

01:33:51.062 --> 01:33:53.396
Matou-os o Loki,

01:33:53.397 --> 01:33:57.609
monstros e magia, nada para
o qual fomos treinados.

01:33:57.610 --> 01:34:00.487
- O Loki conseguiu fugir?
- Conseguiu.

01:34:00.488 --> 01:34:02.822
Não saberás para onde?

01:34:02.823 --> 01:34:04.699
Não tinha de saber.

01:34:04.700 --> 01:34:07.157
Não perguntei.

01:34:09.705 --> 01:34:12.707
Mas ele vai começar
a agitar-se em breve.

01:34:12.708 --> 01:34:15.623
- Hoje.
- Temos de o deter.

01:34:15.670 --> 01:34:19.586
- "Temos", quem?
- Não sei, quem restar.

01:34:20.174 --> 01:34:21.880
Bom...

01:34:23.261 --> 01:34:28.970
Se furasse um olho ao Loki
calculo que dormiria melhor.

01:34:31.102 --> 01:34:33.308
Já pareces tu a falar.

01:34:33.396 --> 01:34:35.518
Tu, não.

01:34:36.774 --> 01:34:39.734
És espia, não soldado.

01:34:39.735 --> 01:34:45.195
E agora queres participar
numa guerra? Porquê?

01:34:46.242 --> 01:34:48.907
Que te fez o Loki?

01:34:48.953 --> 01:34:52.077
Nada, só quero...

01:34:58.754 --> 01:35:01.461
Fui comprometida.

01:35:03.843 --> 01:35:06.633
Sinto-me em dívida.

01:35:08.180 --> 01:35:10.970
E gostava de a anular.

01:35:26.199 --> 01:35:29.367
- Ele era casado?
- Não.

01:35:29.368 --> 01:35:34.285
Havia uma violoncelista
qualquer, acho...

01:35:35.166 --> 01:35:37.288
Lamento.

01:35:37.293 --> 01:35:39.624
Parecia boa pessoa.

01:35:40.338 --> 01:35:43.882
- Era um idiota.
- Porquê, por acreditar?

01:35:43.883 --> 01:35:47.260
- Por enfrentar o Loki sozinho.
- Fazia o trabalho dele.

01:35:47.261 --> 01:35:51.181
Não podia fazê-lo,
devia ter esperado, devia...

01:35:51.182 --> 01:35:55.018
- Às vezes não há outras opções.
- É, já ouvi essa.

01:35:55.019 --> 01:35:56.645
Foi o primeiro soldado
que perdeste?

01:35:56.646 --> 01:35:59.060
Não <i>somos</i> soldados.

01:36:02.902 --> 01:36:06.071
- Não marcho às ordens do Fury.
- Também eu não,

01:36:06.072 --> 01:36:08.490
tem tanto sangue nas mãos
como o Loki.

01:36:08.491 --> 01:36:12.410
Mas para já temos de o esquecer
e resolver isto.

01:36:12.411 --> 01:36:14.454
O Loki precisa de energia,
fazemos uma lista...

01:36:14.455 --> 01:36:16.873
- Ele fê-la uma coisa pessoal.
- Isso não interessa.

01:36:16.874 --> 01:36:19.334
Erro, é o que interessa ao Loki.

01:36:19.335 --> 01:36:21.419
Atacou-nos onde vivemos,
porquê?

01:36:21.420 --> 01:36:24.506
- Para nos separar.
- Isso, dividir e conquistar.

01:36:24.507 --> 01:36:27.175
Mas sabe que para vencer
nos tem de derrotar?

01:36:27.176 --> 01:36:28.760
É isso que quer.

01:36:28.761 --> 01:36:31.388
Quer vencer-nos
e ser visto a vencer.

01:36:31.389 --> 01:36:33.219
Quer público.

01:36:33.224 --> 01:36:35.016
É, vi isso em Estugarda.

01:36:35.017 --> 01:36:38.061
Aquilo foi o ensaio geral
e a estreia é hoje,

01:36:38.062 --> 01:36:41.231
e o Loki acha-se uma diva?

01:36:41.232 --> 01:36:42.649
Quer flores, desfiles,

01:36:42.650 --> 01:36:46.941
quer um monumento nos céus
com o nome bem...

01:36:48.030 --> 01:36:50.278
Diabos me levem.

01:37:00.501 --> 01:37:02.043
Horas de irmos.

01:37:02.044 --> 01:37:03.712
- Onde?
- Digo-te no caminho.

01:37:03.713 --> 01:37:05.335
Sabes pilotar um jacto?

01:37:06.257 --> 01:37:08.213
Sei eu.

01:37:11.512 --> 01:37:13.638
Tens fato protector?

01:37:13.639 --> 01:37:15.678
Pois protege-te.

01:37:42.668 --> 01:37:44.252
Não têm licença
para entrar aqui...

01:37:44.253 --> 01:37:47.210
Filho, nem tentes.

01:37:49.717 --> 01:37:51.426
Agente Hill...

01:37:51.427 --> 01:37:53.716
Esses cromos...

01:37:55.139 --> 01:38:00.265
O Coulson tinha-os no cacifo,
não no bolso.

01:38:04.023 --> 01:38:06.271
Eles precisavam do incentivo...

01:38:08.694 --> 01:38:11.693
<i>Partida não-autorizada</i>
<i>do cais 6.</i>

01:38:11.864 --> 01:38:13.862
Encontraram-no.

01:38:14.033 --> 01:38:17.953
Ponha a funcionar o <i>back up</i>
do sistema de comunicações,

01:38:17.954 --> 01:38:20.869
quero olhos por todo o lado.

01:38:33.761 --> 01:38:39.474
<i>Fechei o reactor mas o cubo</i>
<i>já está autossuficiente.</i>

01:38:39.475 --> 01:38:42.352
Feche-o, Dr. Selvig.

01:38:42.353 --> 01:38:44.309
É demasiado tarde!

01:38:45.690 --> 01:38:47.854
Ele agora já não para.

01:38:48.192 --> 01:38:50.944
Quer mostrar-nos alguma coisa!

01:38:50.945 --> 01:38:52.988
Um novo universo.

01:38:52.989 --> 01:38:55.111
<i>Está bem...</i>

01:39:01.497 --> 01:39:05.542
<i>A barreira é de energia pura.</i>
<i>É impenetrável.</i>

01:39:05.543 --> 01:39:08.041
<i>Já dei por isso.</i>

01:39:08.504 --> 01:39:10.251
<i>Plano B...</i>

01:39:10.673 --> 01:39:12.924
<i>O Mark 7 ainda não está</i>
<i>pronto para uso.</i>

01:39:12.925 --> 01:39:15.882
Pois esqueça os enfeites,
não há tempo.

01:39:34.906 --> 01:39:38.655
Por favor, diz que vais
apelar à minha consciência.

01:39:39.076 --> 01:39:41.620
Não, planeio ameaçar-te.

01:39:41.621 --> 01:39:43.163
Devias estar
com a armadura vestida...

01:39:43.164 --> 01:39:49.165
É, já viu melhores dias
e tens tu a varinha do destino...

01:39:49.337 --> 01:39:51.292
Bebes um copo?

01:39:51.714 --> 01:39:55.258
- Tentar demorar-me não...
- Não, ameaço.

01:39:55.259 --> 01:39:56.801
Não bebes, mesmo?

01:39:56.802 --> 01:39:58.508
Eu cá bebo.

01:39:59.347 --> 01:40:03.972
O meu exército vem aí,
isso nada alterará.

01:40:04.143 --> 01:40:05.727
Que tenho a temer?

01:40:05.728 --> 01:40:08.017
Os Vingadores.

01:40:09.482 --> 01:40:11.900
É como nos chamamos...
Somos assim uma equipa.

01:40:11.901 --> 01:40:13.693
Tipo "Heróis mais
poderosos da Terra"...

01:40:13.694 --> 01:40:16.234
Pois, já os vi.

01:40:16.864 --> 01:40:19.282
É verdade, demoramos
a pôr-nos de acordo.

01:40:19.283 --> 01:40:21.576
Mas contemos espingardas...

01:40:21.577 --> 01:40:24.826
O teu irmão, o semideus,

01:40:25.831 --> 01:40:29.709
brilhante soldado e lenda viva
que merece a fama que tem,

01:40:29.710 --> 01:40:32.837
um homem com incrível
controlo sobre si mesmo,

01:40:32.838 --> 01:40:36.629
dois assassinos experimentados,
e tu...

01:40:36.676 --> 01:40:39.636
Conseguiste irritá-los a todos eles.

01:40:39.637 --> 01:40:42.931
- Era esse o plano.
- Não é famoso.

01:40:42.932 --> 01:40:45.058
Quando aí aparecerem

01:40:45.059 --> 01:40:46.601
- e vão aparecer -

01:40:46.602 --> 01:40:49.187
- será por ti.
- Tenho tropas.

01:40:49.188 --> 01:40:50.772
Nós temos um Hulk.

01:40:50.773 --> 01:40:52.274
Pensei a criatura perdida...

01:40:52.275 --> 01:40:54.359
Não percebes:
não há trono nenhum,

01:40:54.360 --> 01:40:58.572
em versão nenhuma disto
onde quem vence és tu.

01:40:58.573 --> 01:41:00.907
Talvez as tuas tropas
sejam as mais fortes

01:41:00.908 --> 01:41:03.656
mas és tu o responsável.

01:41:03.744 --> 01:41:08.036
E se não pudermos proteger a Terra
tem a certeza que a vingamos.

01:41:10.167 --> 01:41:13.295
Como terão os teus amigos
tempo para mim

01:41:13.296 --> 01:41:15.794
estando tão ocupados
a combater-te a ti?

01:41:22.597 --> 01:41:23.722
Costuma resultar...

01:41:23.723 --> 01:41:26.766
Disfunções dessas
são muito habituais.

01:41:26.767 --> 01:41:28.473
Um em cada cinco...

01:41:30.062 --> 01:41:30.645
Jarvis, quando quiseres.

01:41:30.646 --> 01:41:33.686
Jarvis, quando quiseres.

01:41:34.734 --> 01:41:37.611
Prostrar-se-ão todos
perante mim.

01:41:37.612 --> 01:41:39.692
Avancem!

01:42:07.725 --> 01:42:10.348
E há outra pessoa a quem irritaste.

01:42:11.812 --> 01:42:13.768
Ele chama-se Phil.

01:42:36.837 --> 01:42:38.463
Pronto...

01:42:38.464 --> 01:42:40.420
Tropas.

01:43:52.121 --> 01:43:55.665
Loki, desliga o Tesseract
ou destruo-o!

01:43:55.666 --> 01:43:58.793
Não podes,
já nada o detém.

01:43:58.794 --> 01:44:00.754
Agora só resta...

01:44:00.755 --> 01:44:01.880
A guerra.

01:44:01.881 --> 01:44:03.837
Pois que seja.

01:44:25.571 --> 01:44:27.197
<i>Stark, estamos à tua direita</i>
<i>indo para noroeste.</i>

01:44:27.198 --> 01:44:29.324
Pararam num <i>drive-in?</i>

01:44:29.325 --> 01:44:31.656
Subam a Park,
ponho-os lá à vossa espera.

01:44:49.387 --> 01:44:53.011
- <i>Vêm aí mais.</i>
- Óptimo, mantenhamo-los ocupados.

01:44:59.313 --> 01:45:01.728
- Nat?
- Estou a vê-lo.

01:45:45.443 --> 01:45:47.774
Temos de nos pôr ali em cima.

01:46:38.955 --> 01:46:41.327
Stark, estás a ver?

01:46:41.374 --> 01:46:44.000
<i>Ver vejo, não sei é</i>
<i>se acredito.</i>

01:46:44.001 --> 01:46:45.418
O Banner, ainda não apareceu?

01:46:45.419 --> 01:46:48.376
- <i>O Banner?</i>
- Mantém-me informado.

01:46:48.381 --> 01:46:50.795
<i>Jarvis, descobre-me</i>
<i>um ponto fraco.</i>

01:46:52.927 --> 01:46:56.384
Olha bem!
Olha à tua volta!

01:46:56.931 --> 01:47:00.851
Achas que o teu primado
põe fim a esta loucura?

01:47:00.852 --> 01:47:03.058
É tarde de mais.

01:47:03.813 --> 01:47:05.188
Para deter tudo.

01:47:05.189 --> 01:47:09.731
Não, juntos podemos.

01:47:15.741 --> 01:47:17.781
Sentimento...

01:47:45.980 --> 01:47:48.686
Há civis ainda presos
ali em cima.

01:47:49.150 --> 01:47:50.855
Loki.

01:48:01.746 --> 01:48:04.077
Dali não terão fuga possível.

01:48:09.003 --> 01:48:11.421
Tratamos nós deles.
Vai.

01:48:11.422 --> 01:48:14.254
- Conseguem retê-los?
- Capitão...

01:48:15.551 --> 01:48:18.216
Terei nisso o maior prazer.

01:48:45.289 --> 01:48:47.624
É uma repetição de Budapeste.

01:48:47.625 --> 01:48:50.790
Tu e eu recordamos Budapeste
diferentemente.

01:49:06.561 --> 01:49:09.350
Só daqui a uma hora
reúnem a Guarda Nacional.

01:49:11.607 --> 01:49:13.775
O Exército sabe
o que se passa aqui?

01:49:13.776 --> 01:49:15.523
E nós?

01:49:15.570 --> 01:49:18.113
São precisos homens nestes prédios,
há gente dentro

01:49:18.114 --> 01:49:19.865
e vai estar mesmo
na linha de fogo.

01:49:19.866 --> 01:49:22.117
Evacuem-na pelas caves
ou pelo metro,

01:49:22.118 --> 01:49:23.618
não a deixem sair à rua.

01:49:23.619 --> 01:49:26.413
Preciso duma zona protegida
até à 39ª Rua.

01:49:26.414 --> 01:49:28.536
Porque obedeceria
a ordens suas?

01:49:42.054 --> 01:49:43.346
Quero homens nestes prédios,

01:49:43.347 --> 01:49:45.599
não deixes quem estiver lá
sair à rua.

01:49:45.600 --> 01:49:48.848
Vamos montar uma zona protegida
até à 39ª Rua.

01:49:58.571 --> 01:50:00.488
Bom, temos a atenção dele...

01:50:00.489 --> 01:50:02.695
Qual era o passo seguinte?

01:50:31.687 --> 01:50:32.812
E lá em cima?

01:50:32.813 --> 01:50:34.856
O campo cercando o Cubo
é impenetrável.

01:50:34.857 --> 01:50:37.567
<i>O Thor tem razão,</i>
<i>temos de enfrentar aqueles.</i>

01:50:37.568 --> 01:50:39.361
- Pois, mas como?
- Juntos.

01:50:39.362 --> 01:50:41.154
Tenho assuntos por tratar
com o Loki.

01:50:41.155 --> 01:50:43.573
- Pois põe-te na bicha.
- Esqueçam-no.

01:50:43.574 --> 01:50:46.076
Ele vai concentrar-se em nós,
que é o que queremos,

01:50:46.077 --> 01:50:47.953
sem ele o inimigo
não sabe o que fazer.

01:50:47.954 --> 01:50:51.536
O Stark está lá em cima,
mas precisará que nós...

01:50:58.214 --> 01:51:02.467
Bom, parece tudo um horror...

01:51:02.468 --> 01:51:04.177
Já vi pior.

01:51:04.178 --> 01:51:05.303
Lamento.

01:51:05.304 --> 01:51:08.223
Não, fazia-nos jeito
uma coisa um pouco pior...

01:51:08.224 --> 01:51:10.767
- Stark, ele está aqui.
- <i>O Banner?</i>

01:51:10.768 --> 01:51:11.977
Tal como disseste.

01:51:11.978 --> 01:51:15.393
Diz-lhe que se prepare,
vou levar-lhes aí a festa.

01:51:21.279 --> 01:51:23.818
Não vejo aquilo ser festa...

01:51:30.955 --> 01:51:32.660
Dr. Banner.

01:51:33.833 --> 01:51:36.289
Talvez seja boa altura
para se enfurecer...

01:51:36.627 --> 01:51:39.250
É esse o meu segredo.

01:51:40.798 --> 01:51:42.712
Furioso estou eu sempre.

01:51:53.561 --> 01:51:55.892
<i>Aguenta-o.</i>

01:52:25.092 --> 01:52:27.257
Enviem os outros.

01:52:33.392 --> 01:52:34.851
Malta...

01:52:34.852 --> 01:52:37.479
- <i>Esperamos ordens.</i>
- Bom, ouçam.

01:52:37.480 --> 01:52:40.273
Até fecharmos aquele portal
a prioridade é contê-los.

01:52:40.274 --> 01:52:41.775
Barton, quero-te naquele telhado,

01:52:41.776 --> 01:52:43.777
olhos bem abertos
em grupos ou solitários.

01:52:43.778 --> 01:52:45.278
Stark, tu defendes o perímetro,

01:52:45.279 --> 01:52:46.613
o que se aproximar
três quarteirões

01:52:46.614 --> 01:52:48.240
mandas embora
ou fá-lo em cinzas.

01:52:48.241 --> 01:52:51.239
- Dás-me boleia?
- Desde que te segures.

01:52:54.330 --> 01:52:56.790
Thor, tenta obstruir
aquele portal.

01:52:56.791 --> 01:52:58.166
Para os atrasar.

01:52:58.167 --> 01:53:00.790
Não usas relâmpagos?
Pois frita-os.

01:53:02.588 --> 01:53:05.632
Tu e eu ficamos aqui,
a lutar no chão.

01:53:05.633 --> 01:53:07.464
E Hulk...

01:53:09.095 --> 01:53:10.800
Parte tudo.

01:54:05.860 --> 01:54:07.565
O Conselho reuniu-se.

01:54:11.949 --> 01:54:15.824
Stark, tens uma data
de malta à perna...

01:54:16.871 --> 01:54:19.080
<i>Tento afastá-los das ruas.</i>

01:54:19.081 --> 01:54:21.458
Fintar, eles não sabem.

01:54:21.459 --> 01:54:24.749
- Por isso mete-te num canto.
- De acordo.

01:54:47.235 --> 01:54:48.898
Bolas...

01:54:55.451 --> 01:54:57.118
Bem pensado...

01:54:57.119 --> 01:54:58.328
Que mais se passa?

01:54:58.329 --> 01:55:01.289
<i>O Thor combate</i>
<i>um grupo na 6ª.</i>

01:55:01.290 --> 01:55:04.205
E não me convidou...

01:55:43.165 --> 01:55:46.126
Nada disto servirá de nada
se não fecharmos o portal.

01:55:46.127 --> 01:55:47.919
Nem a artilharia pesada
o consegue.

01:55:47.920 --> 01:55:50.502
Armas podem não ser
a solução...

01:55:52.049 --> 01:55:54.672
Para te pores ali em cima
precisarás de boleia.

01:55:55.136 --> 01:55:56.925
Tenho uma.

01:55:57.305 --> 01:55:59.010
Mas um empurrão, ajudava.

01:56:00.975 --> 01:56:05.558
- Tens a certeza?
- Tenho, até pode ser giro.

01:56:32.006 --> 01:56:34.090
Vira, vira...

01:56:34.091 --> 01:56:36.506
Menos, menos!

01:57:58.467 --> 01:58:01.511
<i>Capitão, o banco</i>
<i>na esquina da 42 com a Madison,</i>

01:58:01.512 --> 01:58:05.678
- <i>estão lá civis encurralados.</i>
- Eu trato disso.

01:58:25.453 --> 01:58:27.951
Fujam, todos!

01:58:57.151 --> 01:59:00.820
<i>Director Fury, o Conselho</i>
<i>tomou uma decisão.</i>

01:59:00.821 --> 01:59:03.698
Bem sei que o Conselho
tomou uma decisão.

01:59:03.699 --> 01:59:06.993
Mas visto a decisão ser estúpida,
resolvi ignorá-la.

01:59:06.994 --> 01:59:10.372
<i>Director, está mais perto</i>
<i>que os submarinos,</i>

01:59:10.373 --> 01:59:11.581
<i>envia o jacto...</i>

01:59:11.582 --> 01:59:14.584
Trata-se da Ilha de Manhattan.

01:59:14.585 --> 01:59:16.628
Até saber que
o meu grupo não os detém

01:59:16.629 --> 01:59:20.340
não ordeno um ataque nuclear
contra uma população civil.

01:59:20.341 --> 01:59:22.843
<i>Ou os detemos lá</i>
<i>ou perdemos tudo.</i>

01:59:22.844 --> 01:59:25.800
Envio o jacto
e perdemos mesmo.

01:59:29.350 --> 01:59:31.723
Olha que tu...

01:59:33.312 --> 01:59:35.185
Gavião Arqueiro!

01:59:35.857 --> 01:59:37.562
Nat, que fazes?

01:59:37.775 --> 01:59:39.481
Uma ajudinha?

01:59:44.073 --> 01:59:45.779
És meu.

02:00:11.684 --> 02:00:13.059
Basta!

02:00:13.060 --> 02:00:15.729
São-me todos inferiores!

02:00:15.730 --> 02:00:18.523
Sou um deus,
estúpida criatura.

02:00:18.524 --> 02:00:20.730
E não serei pisado
por uma f...

02:00:29.869 --> 02:00:32.409
Deus anão...

02:00:39.837 --> 02:00:41.668
O ceptro...

02:00:42.465 --> 02:00:44.421
Doutor?

02:00:45.593 --> 02:00:48.553
O ceptro do Loki, a energia,

02:00:48.554 --> 02:00:52.516
O Tesseract não resiste,
não te podes proteger de ti própria.

02:00:52.517 --> 02:00:55.432
A culpa não é sua,
não sabia o que fazia.

02:00:57.939 --> 02:01:00.232
Até acho que sabia...

02:01:00.233 --> 02:01:03.398
Montei uma segurança extra
para cortar a energia.

02:01:04.362 --> 02:01:05.946
O ceptro do Loki...

02:01:05.947 --> 02:01:09.237
Talvez feche o portal.

02:01:10.618 --> 02:01:13.450
E estou a olhá-lo.

02:01:25.258 --> 02:01:29.424
<i>Vamos perder força antes</i>
<i>de penetrarmos a carapaça.</i>

02:01:35.309 --> 02:01:38.687
Conheces a história do Jonas,
Jarvis?

02:01:38.688 --> 02:01:41.728
<i>Não o consideraria</i>
<i>um exemplo a seguir...</i>

02:02:50.635 --> 02:02:52.594
<i>O Director Fury</i>
<i>já não comanda.</i>

02:02:52.595 --> 02:02:54.763
<i>Ordem 7-Alfa-1-1 autorizada.</i>

02:02:54.764 --> 02:02:58.012
7-Alfa-1-1 confirmada,
vamos descolar.

02:02:58.226 --> 02:03:00.852
Um jacto vai descolar!

02:03:00.853 --> 02:03:03.021
Atenção, deque,
descolagem não autorizada,

02:03:03.022 --> 02:03:07.188
precisamos de a impedir!
Repito, descolagem não autorizada!

02:03:37.098 --> 02:03:39.391
Stark, ouve-me?

02:03:39.392 --> 02:03:42.060
Um míssil dirige-se
para a cidade.

02:03:42.061 --> 02:03:43.892
Quanto tempo temos?

02:03:43.980 --> 02:03:45.730
<i>3 minutos, máximo.</i>

02:03:45.731 --> 02:03:47.566
<i>A bomba arrasará o centro.</i>

02:03:47.567 --> 02:03:49.734
Jarvis, propulsores
em potência máxima.

02:03:49.735 --> 02:03:52.108
<i>Já os pus.</i>

02:04:04.208 --> 02:04:06.001
Míssil disparado,

02:04:06.002 --> 02:04:09.501
<i>detonação dentro de</i>
<i>2 minutos e 30 segundos.</i>

02:04:31.652 --> 02:04:34.317
Pronto para continuar a luta?

02:04:34.614 --> 02:04:36.319
Porquê, tens sono?

02:04:41.245 --> 02:04:43.284
Aponta à base!

02:04:49.045 --> 02:04:50.962
Posso fechá-lo.

02:04:50.963 --> 02:04:53.089
Alguém me ouve?

02:04:53.090 --> 02:04:54.633
Posso fechar o portal.

02:04:54.634 --> 02:04:56.551
- Fecha-o!
- <i>Não, espera.</i>

02:04:56.552 --> 02:04:57.886
Aquelas coisas continuam
a surgir.

02:04:57.887 --> 02:05:01.678
Uma arma nuclear rebentará
em menos de um minuto.

02:05:10.775 --> 02:05:13.106
E sei exactamente onde a pôr.

02:05:19.617 --> 02:05:22.118
<i>Stark, desta viagem</i>
<i>depois não voltas...</i>

02:05:22.119 --> 02:05:23.620
Poupa o resto
para a meia-volta.

02:05:23.621 --> 02:05:27.874
<i>Tento ligar à Sra. Potts?</i>

02:05:27.875 --> 02:05:29.956
Já agora...

02:05:31.838 --> 02:05:34.339
<i>As ruas de Nova Iorque</i>
<i>são um campo de batalha.</i>

02:05:34.340 --> 02:05:37.175
<i>O exército tenta conter</i>
<i>a violência</i>

02:05:37.176 --> 02:05:38.718
<i>mas não tem forças para isso.</i>

02:05:38.719 --> 02:05:41.137
<i>Devo dizer que em todos</i>
<i>os meus anos de jornalismo</i>

02:05:41.138 --> 02:05:44.679
<i>nunca vi nada como isto.</i>

02:05:45.810 --> 02:05:50.185
<i>... mas sabe-se que o Homem</i>
<i>de Ferro do milionário Tony Stark...</i>

02:06:26.350 --> 02:06:28.264
LIGAÇÃO FALHADA

02:07:03.137 --> 02:07:05.427
Anda, Stark...

02:07:11.354 --> 02:07:13.184
Fecha-o.

02:07:32.500 --> 02:07:34.205
O filho da mãe...

02:07:38.297 --> 02:07:40.462
Não está a abrandar...

02:07:58.025 --> 02:08:00.148
Ele respira?

02:08:27.346 --> 02:08:29.386
Mas que raio...?

02:08:31.475 --> 02:08:33.685
Que aconteceu?

02:08:33.686 --> 02:08:36.184
Diz que ninguém me beijou.

02:08:40.276 --> 02:08:42.690
Vencemos...

02:08:44.280 --> 02:08:47.824
Caramba, porreiro!
Bom trabalho, malta.

02:08:47.825 --> 02:08:51.658
E não irmos trabalhar amanhã,
tirarmos uma folga?

02:08:51.913 --> 02:08:53.914
Já provaste <i>shawarma?</i>

02:08:53.915 --> 02:08:56.291
Há um restaurante perto
que a tem óptima.

02:08:56.292 --> 02:08:58.376
Não sei o que é
mas quero experimentar.

02:08:58.377 --> 02:09:00.500
Ainda não terminámos...

02:09:04.800 --> 02:09:07.590
Mas depois, <i>shawarma.</i>

02:09:28.658 --> 02:09:31.364
Se não se importam...

02:09:34.205 --> 02:09:36.536
Bebo agora o tal copo.

02:09:43.798 --> 02:09:45.966
<i>Apesar da devastação
do - já confirmado -

02:09:45.967 --> 02:09:47.801
<i>ataque extraterrestre,</i>

02:09:47.802 --> 02:09:51.555
<i>a extraordinária heroicidade</i>
<i>do grupo dos Vingadores</i>

02:09:51.556 --> 02:09:54.307
<i>tornou-se motivo</i>
<i>para consolo e festejo.</i>

02:09:54.308 --> 02:09:56.893
<i>É fantástico saber</i>
<i>podermos contar com eles,</i>

02:09:56.894 --> 02:09:58.895
<i>que alguém nos protege.</i>

02:09:58.896 --> 02:10:00.146
<i>Adoro-te, Thor!</i>

02:10:00.147 --> 02:10:03.441
<i>E então eles...</i>
<i>E o ar foi como se...</i>

02:10:03.442 --> 02:10:04.943
<i>E o tipo verde caminha e faz...</i>

02:10:04.944 --> 02:10:06.111
<i>Não sei,</i>

02:10:06.112 --> 02:10:08.655
<i>não me sinto muito seguro</i>
<i>sabendo aquilo ali.</i>

02:10:08.656 --> 02:10:11.908
<i>Sinto que há muita coisa</i>
<i>que não nos contam.</i>

02:10:11.909 --> 02:10:15.537
<i>Super-heróis em Nova Iorque?</i>
<i>Vão aldrabar outro...</i>

02:10:15.538 --> 02:10:17.455
<i>Estes ditos "heróis"</i>

02:10:17.456 --> 02:10:21.334
<i>têm de ser responsabilizados</i>
<i>pela destruição feita à cidade.</i>

02:10:21.335 --> 02:10:23.879
<i>O combate foi deles,</i>
<i>onde estão agora?</i>

02:10:23.880 --> 02:10:26.423
<i>Os próprios Vingadores</i>
<i>vêem-se postos em questão.</i>

02:10:26.424 --> 02:10:28.800
<i>O aparecerem subitamente,</i>
<i>tal como desapareceram...</i>

02:10:28.801 --> 02:10:32.300
<i>O quê, tudo isto foi culpa deles?</i>

02:10:33.890 --> 02:10:37.722
<i>O Capitão América</i>
<i>salvou-me a vida.</i>

02:10:39.187 --> 02:10:42.689
<i>Esteja ele onde estiver,</i>
<i>onde quaisquer deles estiverem,</i>

02:10:42.690 --> 02:10:44.687
<i>só quero...</i>

02:10:45.067 --> 02:10:48.108
<i>Quero só dizer "obrigada".</i>

02:10:49.864 --> 02:10:51.823
<i>Onde estão os Vingadores?</i>

02:10:51.824 --> 02:10:53.992
Não conheço o actual
paradeiro deles,

02:10:53.993 --> 02:10:56.286
parece-me que
bem merecem umas férias.

02:10:56.287 --> 02:10:57.996
<i>E o Tesseract?</i>

02:10:57.997 --> 02:11:00.787
<i>Está no seu lugar próprio.</i>

02:11:01.083 --> 02:11:03.126
<i>Fora do nosso alcance.</i>

02:11:03.127 --> 02:11:04.753
<i>Não lhe cabe a decisão.</i>

02:11:04.754 --> 02:11:08.465
Não a tomei, apenas não discuti
com o deus que a tomou.

02:11:08.466 --> 02:11:10.217
<i>E deixou que o levasse,</i>

02:11:10.218 --> 02:11:13.803
<i>tal como ao criminoso Loki que devia</i>
<i>ser julgado pelo seu crime.</i>

02:11:13.804 --> 02:11:16.970
<i>E acho que o será...</i>

02:11:29.862 --> 02:11:32.948
<i>Não creio que perceba</i>
<i>o que começou,</i>

02:11:32.949 --> 02:11:35.575
<i>ao deixar os Vingadores</i>
<i>à solta por aí.</i>

02:11:35.576 --> 02:11:36.952
<i>São perigosos.</i>

02:11:36.953 --> 02:11:41.039
<i>São e de que maneira...</i>
<i>E agora todo o mundo sabe.</i>

02:11:41.040 --> 02:11:44.042
<i>Todos</i> os mundos o sabem.

02:11:44.043 --> 02:11:46.461
<i>Foi para isso que aqui veio?</i>

02:11:46.462 --> 02:11:48.585
<i>Declarar isso?</i>

02:11:50.716 --> 02:11:52.881
<i>Prometê-lo.</i>

02:12:00.935 --> 02:12:03.058
Bom, e agora como é?

02:12:03.563 --> 02:12:05.689
Cada um seguiu o seu caminho,

02:12:05.690 --> 02:12:09.314
alguns indo para bem longe...

02:12:09.360 --> 02:12:12.988
Que acontece, se voltarmos
a enfrentar uma situação destas?

02:12:12.989 --> 02:12:14.694
Eles voltam.

02:12:15.575 --> 02:12:17.242
Tem essa certeza?

02:12:17.243 --> 02:12:18.948
Tenho.

02:12:20.037 --> 02:12:21.951
Como?

02:12:22.290 --> 02:12:25.121
Porque precisaremos
que voltem.

02:15:16.088 --> 02:15:19.295
Os humanos...

02:15:19.884 --> 02:15:24.926
Não são os pobres diabos
cobardes que nos prometeram.

02:15:25.181 --> 02:15:28.012
Eles resistem.

02:15:28.184 --> 02:15:35.145
São desobedientes, e por isso
não podem ser dominados.

02:15:41.614 --> 02:15:44.616
Desafiá-los,

02:15:44.617 --> 02:15:48.867
é um convite à morte.

n0Te

function createSubtitleBlob(movieId){
  const vtt = SUBTITLE_DATA[movieId];
  if(!vtt) return null;
  const blob = new Blob([vtt], {type:'text/vtt'});
  return URL.createObjectURL(blob);
}

function parseVTT(vtt){
  const cues = [];
  const blocks = vtt.split(/\n\n+/);
  for(const block of blocks){
    const lines = block.trim().split('\n');
    const timeLine = lines.find(l=>l.includes('-->'));
    if(!timeLine) continue;
    const [start, end] = timeLine.split('-->').map(t=>{
      const p = t.trim().split(/:|\./);
      return +p[0]*3600 + +p[1]*60 + +p[2] + +p[3]/1000;
    });
    const text = lines.slice(lines.indexOf(timeLine)+1).join(' ').replace(/<[^>]+>/g,'').trim();
    if(text) cues.push({start, end, text});
  }
  return cues;
}

function setupSubtitleBtn(isVideo){
  const top = document.querySelector('.player-top');
  if(top.querySelector('.btn-sub')) return;
  const btn = document.createElement('button');
  btn.className = 'btn-sub';
  btn.textContent = 'CC PT';
  btn.title = 'Legendas Português';
  btn.onclick = () => toggleSubtitles(isVideo, btn);
  top.appendChild(btn);
  subEnabled = false;
}

function setupDubBtn(m){
  const top = document.querySelector('.player-top');
  if(top.querySelector('.btn-dub')) return;

  // LEG button
  const btnLeg = document.createElement('button');
  btnLeg.className = 'btn-dub leg active';
  btnLeg.textContent = '🇵🇹 LEG';
  btnLeg.title = 'Legendado';
  btnLeg.onclick = () => switchVersion('leg', m, btnLeg, btnDub);
  top.appendChild(btnLeg);

  // DUB button
  const btnDub = document.createElement('button');
  btnDub.className = 'btn-dub';
  btnDub.textContent = '🎙️ DUB';
  btnDub.title = 'Dublado';
  btnDub.onclick = () => switchVersion('dub', m, btnLeg, btnDub);
  top.appendChild(btnDub);
}

function switchVersion(version, m, btnLeg, btnDub){
  const iframe = document.getElementById('movieIframe');
  if(!iframe) return;
  if(version === 'dub'){
    iframe.src = m.streamDub;
    btnDub.classList.add('active');
    btnLeg.classList.remove('active');
    // hide subtitles if active
    clearInterval(subInterval); subEnabled = false;
    const overlay = document.getElementById('subOverlay');
    if(overlay) overlay.style.display = 'none';
    const subBtn = document.querySelector('.btn-sub');
    if(subBtn){ subBtn.classList.remove('active'); }
    showToast('A ver versão dublada 🎙️');
  } else {
    iframe.src = m.stream;
    btnLeg.classList.add('active');
    btnDub.classList.remove('active');
    showToast('A ver versão legendada 🇵🇹');
  }
}

function toggleSubtitles(isVideo, btn){
  subEnabled = !subEnabled;
  btn.classList.toggle('active', subEnabled);
  if(isVideo){
    const video = document.getElementById('movieVideo');
    if(!video) return;
    const tracks = video.textTracks;
    for(let i=0;i<tracks.length;i++) tracks[i].mode = subEnabled ? 'showing' : 'hidden';
    showToast(subEnabled ? 'Legendas PT ativadas' : 'Legendas desativadas');
  } else {
    const overlay = document.getElementById('subOverlay');

function updateSubOverlay(){
  if(!parsedCues.length) return;
  const elapsed = performance.now()/1000 - subStartTime;
  const cue = parsedCues.find(c => elapsed >= c.start && elapsed <= c.end);
  const el = document.getElementById('subText');
  if(el) el.textContent = cue ? cue.text : '';
}

const TRAILER_ID = 'QwievZ1Tx-8';
let ytPlayer = null;
let isMuted = true;
let videoActive = false;

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('heroYT',{
    videoId: TRAILER_ID,
    playerVars:{
      autoplay:1, mute:1, controls:0, loop:1, playlist:TRAILER_ID,
      modestbranding:1, rel:0, showinfo:0, iv_load_policy:3,
      disablekb:1, fs:0, cc_load_policy:0
    },
    events:{
      onReady: e => { e.target.playVideo(); },
      onStateChange: e => {
        if(e.data === YT.PlayerState.PLAYING && !videoActive){
          videoActive = true;
          document.getElementById('heroVideoWrap').classList.add('active');
          document.getElementById('heroBg').style.opacity = '0';
        }
        if(e.data === YT.PlayerState.ENDED){
          document.getElementById('heroVideoWrap').classList.remove('active');
          document.getElementById('heroBg').style.opacity = '1';
          videoActive = false;
          isMuted = true;
          document.getElementById('muteBtn').textContent = '🔇';
        }
      }
    }
  });
}

function toggleMute(){
  if(!ytPlayer) return;
  isMuted = !isMuted;
  isMuted ? ytPlayer.mute() : ytPlayer.unMute();
  document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
}
