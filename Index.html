<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metflix</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--red:#e50914;--dark:#141414;--darker:#0a0a0a;--surface:#1a1a1a;--surface2:#222;--text:#fff;--muted:#aaa;--radius:6px}
  body{background:var(--dark);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh}
  .hidden{display:none!important}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 4%;display:flex;align-items:center;gap:24px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);transition:background .3s}
  nav.scrolled{background:rgba(0,0,0,.97)}
  .logo{font-size:2rem;font-weight:900;color:var(--red);letter-spacing:-1px;cursor:pointer;flex-shrink:0}
  .nav-links{display:flex;gap:18px;list-style:none;font-size:.875rem;color:var(--muted)}
  .nav-links li{cursor:pointer;transition:color .2s}.nav-links li:hover{color:#fff}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
  .search-wrap{position:relative;display:flex;align-items:center}
  #searchInput{background:rgba(0,0,0,.7);border:1px solid #fff;color:#fff;padding:6px 36px 6px 12px;border-radius:4px;font-size:.875rem;width:0;opacity:0;transition:width .3s,opacity .3s;outline:none}
  #searchInput.open{width:220px;opacity:1}
  .search-icon{position:absolute;right:8px;cursor:pointer;font-size:1.1rem}
  .btn-login{background:var(--red);color:#fff;border:none;padding:7px 18px;border-radius:4px;font-size:.875rem;font-weight:600;cursor:pointer;transition:background .2s}
  .btn-login:hover{background:#c40812}
  .avatar{width:36px;height:36px;border-radius:4px;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;font-size:1rem}

  /* HERO */
  .hero{height:100vh;min-height:520px;position:relative;display:flex;align-items:flex-end;padding:0 4% 10%}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center center;background-repeat:no-repeat;transition:opacity .6s;image-rendering:auto}
  .hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,var(--dark) 10%,transparent 50%),linear-gradient(to right,rgba(0,0,0,.7) 40%,transparent 70%)}
  .hero-content{position:relative;max-width:520px}
  .hero-badge{background:var(--red);color:#fff;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:3px;display:inline-block;margin-bottom:14px;letter-spacing:.5px}
  .hero-title{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;line-height:1.05;margin-bottom:14px;text-shadow:2px 2px 8px rgba(0,0,0,.6)}
  .hero-desc{font-size:1rem;color:#ddd;line-height:1.5;margin-bottom:24px;max-width:400px}
  .hero-btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn-play{background:#fff;color:#000;border:none;padding:10px 26px;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s}
  .btn-play:hover{background:#ddd}
  .btn-more{background:rgba(109,109,110,.7);color:#fff;border:none;padding:10px 26px;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s}
  .btn-more:hover{background:rgba(109,109,110,.9)}

  /* ROWS */
  .section{padding:0 4% 40px}
  .section-title{font-size:1.3rem;font-weight:700;margin-bottom:14px;color:#e5e5e5}
  .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-behavior:smooth;-ms-overflow-style:none;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .card{flex:0 0 clamp(130px,18vw,210px);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;transition:transform .25s,box-shadow .25s;background:#111}
  .card:hover{transform:scale(1.08);z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.8)}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
  .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 50%);opacity:0;transition:opacity .25s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .card:hover .card-overlay{opacity:1}
  .card-title{font-size:.8rem;font-weight:700;margin-bottom:6px}
  .card-actions{display:flex;gap:6px}
  .c-btn{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.5);color:#fff;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .c-btn:hover{background:rgba(255,255,255,.2)}
  .c-btn.play{background:#fff;color:#000;border-color:#fff}
  .c-btn.play:hover{background:#ddd}

  /* AUTH PAGES */
  .auth-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-box{background:rgba(0,0,0,.88);border:1px solid #333;border-radius:8px;padding:40px 48px;width:100%;max-width:420px}
  .auth-box h2{font-size:1.75rem;font-weight:700;margin-bottom:24px}
  .auth-box p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;background:#333;border:1px solid #555;border-radius:4px;color:#fff;padding:12px 14px;font-size:.95rem;outline:none;transition:border-color .2s}
  .field input:focus{border-color:#fff}
  .btn-submit{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s}
  .btn-submit:hover{background:#c40812}
  .auth-switch{text-align:center;margin-top:20px;font-size:.9rem;color:var(--muted)}
  .auth-switch a{color:#fff;cursor:pointer;text-decoration:underline}
  .auth-close{float:right;background:none;border:none;color:#aaa;font-size:1.5rem;cursor:pointer;margin-top:-8px}
  .msg{padding:10px 14px;border-radius:4px;margin-bottom:14px;font-size:.875rem;display:none}
  .msg.success{background:#1a3a1a;border:1px solid #2a6a2a;color:#4caf50;display:block}
  .msg.error{background:#3a1a1a;border:1px solid #6a2a2a;color:#f44336;display:block}

  /* VIDEO PLAYER */
  .player-wrap{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column}
  .player-top{padding:12px 4%;display:flex;align-items:center;gap:16px;position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
  .player-back{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:4px}
  .player-title{font-size:1.1rem;font-weight:700}
  .player-subtitle{font-size:.8rem;color:var(--muted)}
  .player-content{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:60px 4% 40px}
  .no-stream{text-align:center;max-width:560px}
  .no-stream h2{font-size:1.5rem;margin-bottom:12px}
  .no-stream p{color:var(--muted);line-height:1.6;margin-bottom:8px;font-size:.95rem}
  .no-stream .how{background:var(--surface);border-radius:8px;padding:20px;text-align:left;margin-top:20px}
  .no-stream .how h3{font-size:1rem;margin-bottom:10px;color:var(--red)}
  .no-stream .how li{color:#ccc;font-size:.875rem;line-height:1.7;margin-left:16px}
  .video-container{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
  .video-container iframe,.video-container video{width:100%;height:100%;border:none}

  /* MOVIE MODAL */
  .modal-bg{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#181818;border-radius:12px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;position:relative}
  .modal-hero{width:100%;aspect-ratio:16/9;position:relative;border-radius:12px 12px 0 0;overflow:hidden}
  .modal-hero img{width:100%;height:100%;object-fit:cover}
  .modal-hero-grad{position:absolute;inset:0;background:linear-gradient(to top,#181818 0%,transparent 60%)}
  .modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.8);border:none;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
  .modal-body{padding:24px 28px 32px}
  .modal-title{font-size:1.5rem;font-weight:700;margin-bottom:6px}
  .modal-meta{display:flex;gap:12px;font-size:.85rem;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .badge-hd{background:transparent;border:1px solid #aaa;color:#aaa;padding:1px 6px;border-radius:3px;font-size:.7rem;font-weight:600}
  .modal-desc{color:#ccc;line-height:1.6;font-size:.95rem;margin-bottom:20px}
  .modal-genre{font-size:.85rem;color:var(--muted)}
  .modal-genre span{color:#fff}
  .btn-watch{background:var(--red);color:#fff;border:none;padding:12px 30px;border-radius:4px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px;transition:background .2s;width:100%}
  .btn-watch:hover{background:#c40812}

  /* TOAST */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:40px;font-size:.875rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}

  /* FOOTER */
  footer{padding:40px 4%;border-top:1px solid #333;margin-top:40px}
  footer p{color:var(--muted);font-size:.8rem;line-height:2}

  /* HERO VIDEO */
  .hero-video-wrap{position:absolute;inset:0;overflow:hidden;z-index:1;opacity:0;transition:opacity 1s}
  .hero-video-wrap.active{opacity:1}
  .hero-video-wrap iframe{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;transform:translate(-50%,-50%);pointer-events:none}
  .btn-mute{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.5);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
  .btn-mute:hover{border-color:#fff;background:rgba(0,0,0,.7)}


  /* SUBTITLE TOGGLE */
  .btn-dub{padding:6px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.5);color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;flex-shrink:0}
  .btn-dub:hover{border-color:#fff;background:rgba(0,0,0,.7)}
  .btn-dub.active{background:#f5a623;border-color:#f5a623}
  .btn-dub.leg{background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.7)}
  .btn-dub.leg.active{background:#46d369;border-color:#46d369}
  .btn-sub{padding:6px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.5);color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;flex-shrink:0}
  .btn-sub:hover{border-color:#fff;background:rgba(0,0,0,.7)}
  .btn-sub.active{background:var(--red);border-color:var(--red)}
  video::cue{font-family:'Helvetica Neue',Arial,sans-serif;font-size:1.1rem;color:#fff;text-shadow:1px 1px 3px #000,-1px -1px 3px #000;background:transparent;line-height:1.4}
  /* RESPONSIVE */
  @media(max-width:600px){
    .auth-box{padding:28px 22px}
    .hero-title{font-size:2rem}
    .nav-links{display:none}
    #searchInput.open{width:150px}
    .logo{font-size:1.5rem}
  }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- NAV -->
<nav id="navbar">
  <div class="logo" onclick="showHome()">METFLIX</div>
  <ul class="nav-links">
    <li onclick="showHome()">Início</li>
    <li onclick="filterGenre('action')">Ação</li>
    <li onclick="filterGenre('sci-fi')">Ficção Científica</li>
  </ul>
  <div class="nav-right">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Pesquisar..." oninput="searchMovies(this.value)">
      <span class="search-icon" onclick="toggleSearch()">🔍</span>
    </div>
    <div id="navAuth">
      <button class="btn-login" onclick="showAuth('login')">Entrar</button>
    </div>
    <div id="navUser" class="hidden">
      <div class="avatar" id="userAvatar" onclick="logout()">U</div>
    </div>
  </div>
</nav>

<!-- AUTH OVERLAY -->
<div class="auth-bg hidden" id="authOverlay">
  <!-- LOGIN -->
  <div class="auth-box" id="loginBox">
    <button class="auth-close" onclick="closeAuth()">✕</button>
    <h2>Entrar</h2>
    <div class="msg" id="loginMsg"></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="email@exemplo.com"></div>
    <div class="field"><label>Palavra-passe</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <button class="btn-submit" onclick="doLogin()">Entrar</button>
    <div class="auth-switch">Novo por aqui? <a onclick="showAuth('register')">Criar conta</a></div>
  </div>
  <!-- REGISTER -->
  <div class="auth-box hidden" id="registerBox">
    <button class="auth-close" onclick="closeAuth()">✕</button>
    <h2>Criar Conta</h2>
    <div class="msg" id="registerMsg"></div>
    <div class="field"><label>Nome</label><input type="text" id="regName" placeholder="O seu nome"></div>
    <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="email@exemplo.com"></div>
    <div class="field"><label>Palavra-passe</label><input type="password" id="regPass" placeholder="Mínimo 6 caracteres"></div>
    <div class="field"><label>Confirmar Palavra-passe</label><input type="password" id="regPass2" placeholder="Repetir palavra-passe"></div>
    <button class="btn-submit" onclick="doRegister()">Criar Conta</button>
    <div class="auth-switch">Já tem conta? <a onclick="showAuth('login')">Entrar</a></div>
  </div>
</div>

<!-- MOVIE MODAL -->
<div class="modal-bg hidden" id="movieModal">
  <div class="modal" id="modalContent">
    <div class="modal-hero">
      <img id="modalHeroImg" src="" alt="">
      <div class="modal-hero-grad"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-genre" id="modalGenre"></div>
      <button class="btn-watch" onclick="watchMovie()">▶ Assistir Agora</button>
    </div>
  </div>
</div>

<!-- VIDEO PLAYER -->
<div class="player-wrap hidden" id="playerWrap">
  <div class="player-top">
    <button class="player-back" onclick="closePlayer()">← Voltar</button>
    <div>
      <div class="player-title" id="playerTitle"></div>
      <div class="player-subtitle">Metflix Originals</div>
    </div>
  </div>
  <div class="player-content" id="playerContent"></div>
</div>

<!-- MAIN CONTENT -->
<main id="mainContent">
  <!-- HERO -->
  <div class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-video-wrap" id="heroVideoWrap">
      <div id="heroYT"></div>
    </div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <div class="hero-badge">MAIS VISTO ESTA SEMANA</div>
      <div class="hero-title" id="heroTitle"></div>
      <div class="hero-desc" id="heroDesc"></div>
      <div class="hero-btns">
        <button class="btn-play" id="heroPlay" onclick="heroWatch()">▶ Assistir</button>
        <button class="btn-more" id="heroMore" onclick="heroInfo()">ℹ Mais Info</button>
        <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🔇</button>
      </div>
    </div>
  </div>

  <!-- ROWS -->
  <div id="movieRows"></div>
</main>

<!-- FOOTER -->
<footer>
  <p>© 2025 Metflix. Todos os direitos reservados.</p>
  <p>Questões? Contacte-nos: <a href="mailto:suporte@metflix.pt" style="color:#aaa">suporte@metflix.pt</a></p>
</footer>

async function sbFetch(path, method="GET", body=null){
  const opts = {
    method,
    headers:{
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      "Prefer": method==="POST" ? "return=representation" : ""
    }
  };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(SB_URL+"/rest/v1/"+path, opts);
  if(!r.ok){ const e=await r.text(); throw new Error(e); }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : [];
}

function renderRows(movies){
  const wrap = document.getElementById("movieRows");
  wrap.innerHTML = "";
  ROWS.forEach(row=>{
    const filtered = movies.filter(row.filter);
    if(!filtered.length) return;
    const sec = document.createElement("div");
    sec.className = "section";
    sec.innerHTML = `<div class="section-title">${row.label}</div><div class="row">${filtered.map(movieCard).join("")}</div>`;
    wrap.appendChild(sec);
  });
}

function movieCard(m){
  return `<div class="card" onclick="openModal(MOVIES.find(x=>x.id===${m.id}))">
    <img src="${m.poster}" alt="${m.title}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/210x315/1a1a1a/e50914?text='+encodeURIComponent(m.title.substring(0,16))">
    <div class="card-overlay">
      <div class="card-title">${m.title}</div>
      <div class="card-actions">
        <button class="c-btn play" onclick="event.stopPropagation();openPlayer(MOVIES.find(x=>x.id===${m.id}))">▶</button>
        <button class="c-btn" onclick="event.stopPropagation();openModal(MOVIES.find(x=>x.id===${m.id}))">ⓘ</button>
      </div>
    </div>
  </div>`;
}

function openPlayer(m){
  if(!currentUser){ showAuth("login"); showToast("Inicia sessão para assistir!"); return; }
  currentMovie = m;
  document.getElementById("playerTitle").textContent = m.title;
  const content = document.getElementById("playerContent");

  if(m.stream){
    const isDirectVideo = m.stream.match(/\.mp4|\.webm|blob:/i);
    if(isDirectVideo){
      const blobUrl = m.hasSubtitle && SUBTITLE_DATA[m.id] ? createSubtitleBlob(m.id) : null;
      const tracks = blobUrl ? `<track id="subTrack" kind="subtitles" src="${blobUrl}" srclang="pt" label="Português">` : '';
      content.innerHTML = `
        <div class="video-container">
          <video id="movieVideo" controls autoplay style="width:100%;height:100%;max-height:90vh;background:#000">
            <source src="${m.stream}" type="video/mp4">
            ${tracks}
            O teu browser não suporta vídeo HTML5.
          </video>
        </div>`;
      if(blobUrl) setupSubtitleBtn(true);
    } else {
      // iframe embed (Streamtape, YouTube, etc.)
      const hasSubtitleOverlay = m.hasSubtitle && SUBTITLE_DATA[m.id];
      content.innerHTML = `
        <div id="iframeWrap" style="position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden">
          <iframe id="movieIframe"
            src="${m.stream}" 
            style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"
            allowfullscreen 
            allow="autoplay; fullscreen; picture-in-picture"
            scrolling="no"
          ></iframe>
          <div id="subOverlay" style="display:none;position:absolute;bottom:8%;left:0;right:0;text-align:center;pointer-events:none;z-index:10">
            <span id="subText" style="background:rgba(0,0,0,0.7);color:#fff;padding:4px 12px;border-radius:4px;font-size:1.1rem;font-family:Helvetica Neue,Arial,sans-serif;text-shadow:1px 1px 3px #000;line-height:1.5;max-width:80%;display:inline-block"></span>
          </div>
        </div>`;
      if(hasSubtitleOverlay) setupSubtitleBtn(false);
      if(m.streamDub) setupDubBtn(m);
    }
  } else {
    content.innerHTML = `
      <div class="no-stream">
        <div style="font-size:4rem;margin-bottom:16px">🎬</div>
        <h2>${m.title} (${m.year})</h2>
        <p style="margin-bottom:20px">Este filme ainda não tem um link de streaming configurado.</p>
        <div class="how">
          <h3>Como adicionar filmes ao Metflix:</h3>
          <ul>
            <li><strong>Opção 1 – Ficheiros próprios:</strong> Carregue os filmes para um servidor (ex: Google Drive, Cloudflare R2, servidor próprio) e substitua <code>stream: null</code> pelo URL direto do ficheiro .mp4 no array MOVIES no código.</li>
            <li><strong>Opção 2 – YouTube (filmes gratuitos):</strong> Alguns filmes clássicos estão no YouTube gratuitamente. Copie o link de embed (<code>https://www.youtube.com/embed/VIDEO_ID</code>) e coloque no campo <code>stream</code>.</li>
            <li><strong>Opção 3 – Plataformas legais:</strong> Use a API do Tubi, Pluto TV ou outros serviços que permitem embed gratuito e legal.</li>
            <li><strong>Atenção:</strong> Não é possível incorporar filmes de Netflix, HBO, Disney+, Amazon ou plataformas pagas — são protegidos por DRM e direitos de autor.</li>
            <li><strong>Legendas PT:</strong> Use ficheiros .srt e a tag HTML &lt;track kind="subtitles"&gt; junto com uma tag &lt;video&gt; normal.</li>
          </ul>
        </div>
      </div>`;
  }

  document.getElementById("playerWrap").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}

function closePlayer(){
  document.getElementById("playerWrap").classList.add("hidden");

function loadSession(){
  try{ return JSON.parse(localStorage.getItem("mf_session")||"null"); } catch(e){ return null; }
}
function saveSession(u){
  localStorage.setItem("mf_session", JSON.stringify({name:u.name, email:u.email}));
}
function clearSession(){ localStorage.removeItem("mf_session"); }

function hashPass(p){
  let h = 0;
  for(let i=0;i<p.length;i++){ h = Math.imul(31,h)+p.charCodeAt(i)|0; }
  return h.toString(36);
}

async function doLogin(){
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass = document.getElementById("loginPass").value;
  if(!email||!pass){ showMsg("loginMsg","Preenche todos os campos.","error"); return; }
  const btn = document.querySelector("#loginBox .btn-submit");
  btn.textContent = "A entrar..."; btn.disabled = true;
  try{
    const rows = await sbFetch(`users?email=eq.${encodeURIComponent(email)}&pass=eq.${encodeURIComponent(hashPass(pass))}&select=name,email`);
    if(!rows.length){ showMsg("loginMsg","Email ou palavra-passe incorretos.","error"); return; }
    currentUser = rows[0];
    saveSession(currentUser);
    btn.textContent = "Entrar"; btn.disabled = false;
    closeAuth();
    updateNav();
    showToast("Bem-vindo(a) de volta, "+currentUser.name+"! 🎬");
  } catch(e){
    const msg = e.message.includes("relation") ? "Tabela não encontrada. Contacta o administrador." :
                e.message.includes("Failed to fetch") ? "Sem ligação à internet." :
                "Erro: " + e.message;
    showMsg("loginMsg", msg, "error");
    btn.textContent = "Entrar"; btn.disabled = false;
    console.error(e);
  }
}

  const pass = document.getElementById("regPass").value;
  const pass2 = document.getElementById("regPass2").value;
  if(!name||!email||!pass||!pass2){ showMsg("registerMsg","Preenche todos os campos.","error"); return; }
  if(pass.length<6){ showMsg("registerMsg","A palavra-passe deve ter pelo menos 6 caracteres.","error"); return; }
  if(pass!==pass2){ showMsg("registerMsg","As palavras-passe não coincidem.","error"); return; }
  const btn = document.querySelector("#registerBox .btn-submit");
  btn.textContent = "A criar conta..."; btn.disabled = true;
  try{
    const exists = await sbFetch(`users?email=eq.${encodeURIComponent(email)}&select=email`);
    if(exists.length){ showMsg("registerMsg","Este email já está registado.","error"); return; }
    await sbFetch("users", "POST", {name, email, pass:hashPass(pass)});
    btn.textContent = "Criar Conta"; btn.disabled = false;
    showMsg("registerMsg","✅ Conta criada com sucesso! Podes fazer login agora.","success");
    setTimeout(()=>{ showAuth("login"); }, 2000);
  } catch(e){
    const msg = e.message.includes("relation") ? "Tabela não encontrada. Contacta o administrador." :
                e.message.includes("Failed to fetch") ? "Sem ligação à internet." :
                e.message.includes("duplicate") ? "Este email já está registado." :
                "Erro: " + e.message;
    showMsg("registerMsg", msg, "error");
    btn.textContent = "Criar Conta"; btn.disabled = false;
    console.error(e);
  }
}

function logout(){
  currentUser = null;
  clearSession();
  updateNav();
  showToast("Sessão terminada.");
}

function updateNav(){
  const auth = document.getElementById("navAuth");
  const user = document.getElementById("navUser");
  if(currentUser){
    auth.classList.add("hidden");
    user.classList.remove("hidden");
    document.getElementById("userAvatar").textContent = currentUser.name[0].toUpperCase();
  } else {
    auth.classList.remove("hidden");
    user.classList.add("hidden");
  }
}

// ─── SEARCH / FILTER ────────────────────────────────────────────
function toggleSearch(){
  const inp = document.getElementById("searchInput");
  inp.classList.toggle("open");
  if(inp.classList.contains("open")) inp.focus();
  else { inp.value=""; renderRows(MOVIES); }
}

function searchMovies(q){
  if(!q){ renderRows(MOVIES); return; }
  const lower = q.toLowerCase();
  renderRows(MOVIES.filter(m=>m.title.toLowerCase().includes(lower)||m.genre.some(g=>g.includes(lower))));
}

function filterGenre(g){
  renderRows(MOVIES.filter(m=>m.genre.includes(g)));
}

function showHome(){
  renderRows(MOVIES);
}

// ─── TOAST ──────────────────────────────────────────────────────
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 3200);
}

00:24:02.483 --> 00:24:04.235
e está tudo bem.

00:24:04.318 --> 00:24:07.071
Você tem uma luz muito especial.

00:24:08.156 --> 00:24:10.241
E você sabe o que Jeová disse.

00:24:10.324 --> 00:24:14.370
Ele disse: "Deixe sua luz brilhar
para o mundo."

00:24:15.538 --> 00:24:17.623
Então, deixe sua luz brilhar.

00:24:18.958 --> 00:24:20.501
Está entendendo?

00:24:22.545 --> 00:24:23.588
Sim.

00:24:24.380 --> 00:24:27.383
Não deixe ninguém
tirar isso de você.

00:24:28.551 --> 00:24:30.428
Nem mesmo você.

00:24:33.264 --> 00:24:34.515
Venha aqui.

00:24:40.396 --> 00:24:44.442
A próxima que vamos cantar
é uma das nossas preferidas.

00:24:44.525 --> 00:24:45.651
Querem ouvir?

00:25:27.068 --> 00:25:28.778
Michael, eu amo...

00:26:47.773 --> 00:26:51.152
Deixando o passado para trás.
Abraçando a liberdade.

00:26:52.320 --> 00:26:54.572
Esse disco é seu, irmão.

00:26:56.157 --> 00:26:58.200
1978 LOS ANGELES, CALIFÓRNIA

00:26:58.284 --> 00:26:59.785
É o que as pessoas querem.

00:27:01.203 --> 00:27:02.788
Escapismo puro, Quincy.

00:27:02.872 --> 00:27:04.498
- Só isso?
- É.

00:27:08.753 --> 00:27:10.046
E...

00:27:10.129 --> 00:27:13.257
como vai contar para o seu pai
sobre o disco solo?

00:27:16.260 --> 00:27:20.056
Sem a família por perto...
Ele não vai gostar disso.

00:27:23.392 --> 00:27:24.977
Não sou mais criança, Q.

00:27:27.438 --> 00:27:28.856
Vou olhar nos olhos dele...

00:27:31.233 --> 00:27:32.610
Vou dizer na cara dele.

00:27:39.158 --> 00:27:44.455
Preciso que digam ao meu pai
que a ideia do disco solo foi de vocês.

00:27:52.338 --> 00:27:53.422
Está bem.

00:27:54.715 --> 00:27:55.715
Está bem.

00:27:56.842 --> 00:27:57.842
Vou pegar uma bebida.

00:27:58.344 --> 00:27:59.428
Michael,

00:27:59.970 --> 00:28:01.972
adoramos a ideia de você gravar
um disco solo.

00:28:02.848 --> 00:28:05.434
Sinceramente, foi por isso
que a Epic contratou vocês.

00:28:05.518 --> 00:28:07.103
Com todo
respeito à sua família...

00:28:08.104 --> 00:28:09.855
essa era a nossa expectativa.

00:28:09.939 --> 00:28:11.065
Que ótimo.

00:28:11.482 --> 00:28:14.235
Só acho que vai ser melhor
se isso partir de vocês.

00:28:14.318 --> 00:28:15.736
Estamos aqui pra ajudar, Michael.

00:28:16.654 --> 00:28:18.989
Então, conte-nos sobre o disco.

00:28:19.615 --> 00:28:23.119
Tá bom. Esse disco
é muito importante pra mim.

00:28:23.202 --> 00:28:25.079
É que... eu preciso de liberdade

00:28:25.162 --> 00:28:27.748
para criar as músicas e letras
que surgem na minha cabeça,

00:28:28.791 --> 00:28:30.793
para me expressar
de forma criativa.

00:28:31.252 --> 00:28:33.671
Eu quero um som novo
e um eu novo.

00:28:34.463 --> 00:28:36.006
Quincy Jones vai produzir.

00:28:36.090 --> 00:28:38.968
Rod Temperton está trabalhando
em algumas músicas nesse momento.

00:28:40.761 --> 00:28:42.513
Isso é maravilhoso, Michael.

00:28:43.055 --> 00:28:44.181
Negócio fechado.

00:28:46.559 --> 00:28:48.686
Então, nós achamos
que um disco solo do Michael

00:28:48.769 --> 00:28:51.313
seria muito bom para a gravadora,

00:28:51.397 --> 00:28:54.859
e, o que é mais importante,
para a marca Jackson.

00:28:54.942 --> 00:28:58.362
Eles podem se ajudar
com RP e merchandising.

00:28:58.654 --> 00:29:00.281
Um alimenta o outro, entende?

00:29:01.490 --> 00:29:03.492
Sim, claro.

00:29:07.371 --> 00:29:08.371
Então,

00:29:09.373 --> 00:29:11.000
você está de acordo com isso?

00:29:12.501 --> 00:29:13.752
Claro, senhores.

00:29:14.086 --> 00:29:16.547
O que for bom para o Michael
é ótimo para mim.

00:29:19.008 --> 00:29:20.968
E se você precisar de qualquer
coisa, não hesite em...

00:29:21.051 --> 00:29:22.636
A única coisa é que...

00:29:24.763 --> 00:29:26.932
o Michael pode fazer o que ele
quiser nas horas vagas dele,

00:29:27.266 --> 00:29:29.477
contanto que continue
trabalhando com os irmãos.

00:29:32.771 --> 00:29:33.771
Como assim?

00:29:34.440 --> 00:29:36.358
Ele é meu das 9 às 17h.

00:29:36.942 --> 00:29:38.360
Depois disso, é com ele.

00:29:38.486 --> 00:29:41.906
Se quiser gravar um disco
à meia-noite, por mim, tudo bem.

00:29:42.531 --> 00:29:45.409
Desde que ele esteja no microfone
às 9h em ponto.

00:29:46.994 --> 00:29:49.580
É como as coisas funcionam aqui,
na minha casa.

00:29:50.456 --> 00:29:51.665
Entendido.

00:29:52.958 --> 00:29:56.629
Agradeço aos senhores por terem
vindo. Demonstra respeito.

00:29:56.712 --> 00:29:58.339
- Foi um prazer, Joe.
- É.

00:30:14.855 --> 00:30:17.566
Estou animado pra começar
a gravar com o Q hoje.

00:30:18.067 --> 00:30:19.318
Queria que você pudesse ir.

00:30:19.944 --> 00:30:24.323
Estou meio nervoso, mas muito animado.
Bem mais animado do que nervoso.

00:30:24.406 --> 00:30:27.993
Tenho muitas ideias na cabeça,
e elas não param de surgir.

00:30:28.786 --> 00:30:30.037
Tenho que pôr pra fora.

00:30:31.080 --> 00:30:32.164
Entende?

00:30:36.460 --> 00:30:38.128
Agora, vá dormir, Louis.

00:30:38.504 --> 00:30:41.048
Amanhã cedo eu estarei de volta.
Vou te contar tudo.

00:30:50.349 --> 00:30:51.934
Tudo pronto, joker?

00:30:52.643 --> 00:30:53.644
Vamos nessa.

00:30:55.771 --> 00:30:56.981
Quer que eu dirija?

00:30:57.314 --> 00:30:58.315
Dessa vez, não, joker.

00:30:58.399 --> 00:30:59.567
Tem certeza?

00:30:59.650 --> 00:31:02.278
Na próxima. Prefiro deixar
o Louis dirigir.

00:31:07.157 --> 00:31:10.035
No seu tempo. Relaxa.

00:31:10.703 --> 00:31:11.912
Sem pressa.

00:31:12.871 --> 00:31:16.166
E sossega esses pés.

00:31:21.213 --> 00:31:25.009
Q, pode reduzir a luz pra mim,
por favor?

00:31:25.217 --> 00:31:26.260
Só um pouco.

00:31:27.219 --> 00:31:28.219
Valeu.

00:31:33.851 --> 00:31:35.352
Você é confiante.

00:31:35.436 --> 00:31:36.895
Você é forte.

00:31:37.980 --> 00:31:39.440
Você é lindo.

00:31:40.441 --> 00:31:42.484
É o maior de todos os tempos.

00:31:51.994 --> 00:31:53.704
Michael, você está pronto?

00:33:36.890 --> 00:33:38.434
Michael! Michael!

00:34:08.130 --> 00:34:09.465
CORREIO

00:34:56.345 --> 00:34:59.973
- Impossível. Não desamine. Pegue o anel.
- Obrigada.

00:35:04.394 --> 00:35:06.814
- Sinto muito.
- Eu também.

00:35:08.232 --> 00:35:10.150
Está chegando. Vem logo.

00:35:12.444 --> 00:35:14.446
- O que está acontecendo?
- O que foi dessa vez?

00:35:14.530 --> 00:35:15.781
É surpresa.

00:35:15.864 --> 00:35:18.742
O que é? É um carro? Você
comprou uma Ferrari, Michael?

00:35:18.826 --> 00:35:20.118
Mike, eu vou voltar pra cama.

00:35:20.202 --> 00:35:23.038
Marlon, Tito,
não acordem seu pai.

00:35:25.207 --> 00:35:26.250
La Toya,

00:35:27.751 --> 00:35:28.751
você sabia disso?

00:35:28.794 --> 00:35:29.795
O que está acontecendo?

00:35:38.971 --> 00:35:40.347
O que está aprontando, Mike?

00:35:41.807 --> 00:35:42.850
Já vai ver.

00:36:11.628 --> 00:36:12.754
Vai lá.

00:36:12.838 --> 00:36:14.214
Tá tudo bem.

00:36:20.721 --> 00:36:22.306
Vai lá.

00:36:22.848 --> 00:36:24.057
Tá tudo bem.

00:36:34.735 --> 00:36:37.613
Quero que conheçam
meu novo amigo, o Bubbles.

00:36:39.615 --> 00:36:41.450
Eu o resgatei
de um lugar horrível,

00:36:42.242 --> 00:36:44.161
onde fazem testes em animais.

00:36:44.953 --> 00:36:46.204
Bem-vindo à família.

00:36:47.247 --> 00:36:50.292
Michael, você sabe que chimpanzés
são animais selvagens

00:36:50.375 --> 00:36:53.670
e que o lugar deles
não é numa casa em Encino.

00:36:53.754 --> 00:36:55.756
Mãe, eu vou cuidar bem dele.

00:36:56.340 --> 00:36:57.341
É sério, eu prometo.

00:36:58.091 --> 00:36:59.217
Ele morde?

00:36:59.301 --> 00:37:01.386
Ah, não. Não, ele é um doce.

00:37:02.429 --> 00:37:03.931
Mas, os chimpanzés

00:37:04.640 --> 00:37:08.101
são sensíveis a alguns sons
e pessoas.

00:37:08.894 --> 00:37:11.104
Ou eles se escondem, ou atacam.

00:37:21.865 --> 00:37:23.784
Tudo bem, Bubbles. Tá tudo bem.

00:37:24.117 --> 00:37:25.202
Você está protegido, agora.

00:37:28.622 --> 00:37:30.040
Quer fazer música?

00:37:38.882 --> 00:37:40.008
Sou eu.

00:37:40.717 --> 00:37:42.135
Acabei de lançar meu disco novo.

00:37:42.636 --> 00:37:45.180
Essas são minhas demos.
Não mexa nisso.

00:37:47.265 --> 00:37:48.684
Eu quero te mostrar isso.

00:37:49.518 --> 00:37:50.518
Olha aqui.

00:37:52.938 --> 00:37:53.981
Olha.

00:37:54.606 --> 00:37:55.606
Está vendo?

00:37:57.109 --> 00:37:59.111
TERRA DO NUNCA

00:37:59.194 --> 00:38:00.445
Essa é a Terra do Nunca.

00:38:00.779 --> 00:38:02.280
Eu venho aqui o tempo todo.

00:38:05.158 --> 00:38:08.286
Ela é cheia de magia, aventura...

00:38:08.912 --> 00:38:09.912
e piratas.

00:38:10.414 --> 00:38:11.623
Eu te ajudo.

00:38:13.000 --> 00:38:15.002
Olha. Os Meninos Perdidos.

00:38:20.924 --> 00:38:23.176
É a minha página favorita.
É o Peter Pan.

00:38:24.136 --> 00:38:25.345
A sombra dele.

00:38:42.404 --> 00:38:43.780
Então, Michael...

00:38:45.490 --> 00:38:48.326
Cirurgias.
Fez alguma nos últimos 5 anos?

00:38:51.455 --> 00:38:53.832
E remédios? Está tomando algum?

00:38:54.082 --> 00:38:55.082
Não, senhora.

00:38:56.084 --> 00:38:57.878
Só Benoquin para o vitiligo.

00:38:59.129 --> 00:39:00.380
Sinto muito.

00:39:01.006 --> 00:39:03.091
É bem mais comum
do que as pessoas pensam.

00:39:04.468 --> 00:39:05.677
Já se espalhou?

00:39:06.845 --> 00:39:08.180
- Um pouco.
- É?

00:39:08.263 --> 00:39:12.017
É, mas o creme ajuda
a uniformizar meu tom de pele.

00:39:12.100 --> 00:39:13.185
Estou vendo. É.

00:39:13.268 --> 00:39:15.437
Michael! Bom ver você de novo.

00:39:15.937 --> 00:39:17.522
Estamos quase prontos.

00:39:17.606 --> 00:39:18.732
Ficou com alguma dúvida?

00:39:18.815 --> 00:39:20.275
Ah, não. Estou pronto.

00:39:20.358 --> 00:39:22.819
Ok. Preciso fazer umas marcas
ao redor do nariz.

00:39:26.656 --> 00:39:29.242
Sabe,
você é um garoto muito bonito.

00:39:29.367 --> 00:39:30.368
Quer mesmo fazer isso?

00:39:31.703 --> 00:39:33.080
Eu não sou mais um garoto.

00:39:33.580 --> 00:39:35.957
E o meu nariz é grande demais.

00:39:36.458 --> 00:39:37.793
Não sei se isso é verdade.

00:39:39.127 --> 00:39:41.129
O meu rosto não é simétrico.

00:39:41.630 --> 00:39:43.256
Para as fotos e tal...

00:39:44.758 --> 00:39:46.176
eu tenho que ser perfeito.

00:39:47.552 --> 00:39:48.553
Você manda.

00:39:49.638 --> 00:39:50.806
Relaxe.

00:40:26.007 --> 00:40:27.007
Ei.

00:40:28.218 --> 00:40:29.469
E aí, tudo bem, filho?

00:40:31.847 --> 00:40:32.848
Filho?

00:40:35.058 --> 00:40:36.101
Michael.

00:40:41.022 --> 00:40:43.316
Ei, venha aqui.

00:40:54.494 --> 00:40:55.579
Mas o que...

00:40:58.790 --> 00:41:00.625
Deixa eu ver uma coisa. Ei.

00:41:08.842 --> 00:41:10.051
Ai, meu Deus.

00:41:12.637 --> 00:41:13.638
Michael.

00:41:14.890 --> 00:41:16.266
É por causa da sinusite.

00:41:55.388 --> 00:41:57.224
TUDO O QUE VOCÊ QUERIA
ESTÁ DO OUTRO LADO DO MEDO

00:41:57.307 --> 00:41:59.184
ENCONTRE SUA VOZ
PROGRESSO E PERFEIÇÃO

00:42:22.040 --> 00:42:23.708
Talvez eu deva
fazer plástica no nariz.

00:42:26.586 --> 00:42:27.629
Você acha?

00:42:27.712 --> 00:42:28.797
Sim, eu acho.

00:42:30.173 --> 00:42:31.883
Muscles disse que todo mundo faz.

00:42:32.342 --> 00:42:35.512
Todas as grandes estrelas.
Todas as nossas favoritas.

00:42:36.304 --> 00:42:37.305
Ficou ótimo.

00:42:38.807 --> 00:42:40.308
- Você acha mesmo?
- Acho.

00:42:42.185 --> 00:42:44.437
- Eu queria um novo visual.
- Ah, é?

00:42:44.521 --> 00:42:46.439
Quero me reinventar.

00:42:47.023 --> 00:42:49.859
Sabe? Agora que estou
fazendo os meus lances,

00:42:51.361 --> 00:42:53.154
eu quero que o mundo
me veja de um jeito diferente.

00:42:54.322 --> 00:42:56.783
Não como um menino
em uma banda de garotos.

00:42:57.534 --> 00:42:58.576
É.

00:42:59.244 --> 00:43:01.746
Olha isso, Michael.
Seus fãs te amam.

00:43:03.623 --> 00:43:06.501
Não são meus fãs.
São parte da minha família.

00:43:08.586 --> 00:43:13.174
É que está na hora de eu assumir
o controle do meu próprio destino.

00:43:15.093 --> 00:43:17.762
Entende? Eu quero ser
quem eu quiser ser.

00:43:19.264 --> 00:43:20.348
Mikey,

00:43:20.849 --> 00:43:21.891
Joseph quer uma reunião.

00:43:23.768 --> 00:43:25.145
Cuidado, ele está com fome.

00:43:25.228 --> 00:43:26.646
Ele está faminto?

00:43:27.814 --> 00:43:29.024
Está bem faminto.

00:43:30.275 --> 00:43:33.778
- Fome de camundongo?
- Talvez.

00:43:36.156 --> 00:43:38.033
Olha ele aí.
A sensação do momento.

00:43:38.408 --> 00:43:40.035
A sensação do momento.

00:43:41.786 --> 00:43:43.163
Pode sentar, senta aí.

00:43:48.543 --> 00:43:49.543
Então...

00:43:50.253 --> 00:43:52.297
todos estão felizes
com o sucesso do Michael.

00:43:53.048 --> 00:43:55.383
Dá gosto de ver. É comovente.

00:43:56.301 --> 00:43:57.594
Ele chegou lá.

00:43:58.303 --> 00:44:00.930
Lá no topo. Sozinho.

00:44:02.182 --> 00:44:04.559
Isso não é incrível? Caramba.

00:44:04.642 --> 00:44:09.397
Prestem atenção.
A Família Jackson é a marca.

00:44:10.231 --> 00:44:12.192
É a nossa "Coca-Cola".

00:44:12.275 --> 00:44:16.738
Então, nós precisamos
abrir a loja e começar a vender.

00:44:17.197 --> 00:44:18.615
Senão, sabem o que vai acontecer?

00:44:18.907 --> 00:44:20.950
As pessoas vão começar
a comprar Pepsi.

00:44:22.660 --> 00:44:25.413
Temos que entrar no mercado
de novo e voltar a vender.

00:44:26.414 --> 00:44:28.708
Então, eu decidi...

00:44:31.544 --> 00:44:35.215
Vou organizar uma turnê
e gravar um disco ao vivo.

00:44:37.842 --> 00:44:40.095
Como vamos sair em turnê
sem o Jermaine?

00:44:40.178 --> 00:44:42.847
Seu irmão fez uma escolha
quando saímos da Motown e ele ficou.

00:44:43.640 --> 00:44:44.641
Ele que lute.

00:44:45.141 --> 00:44:48.895
A questão é que precisamos capitalizar
em cima do disco do Michael.

00:44:48.978 --> 00:44:51.147
Então, vamos tocar
muitas músicas de "Off The Wall".

00:44:51.231 --> 00:44:52.231
Joseph, eu...

00:44:55.193 --> 00:44:56.277
Eu preciso pensar.

00:44:56.569 --> 00:44:57.695
Não, senhor.

00:44:58.196 --> 00:44:59.531
Já te disse o que pensar.

00:45:01.324 --> 00:45:02.534
Algum problema com isso, Michael?

00:45:02.617 --> 00:45:05.829
Precisamos ter uma conversa
ponderada sobre isso, Joseph.

00:45:06.037 --> 00:45:07.914
Acha que porque é um superastro

00:45:07.997 --> 00:45:09.290
que gravou um disco de sucesso,

00:45:09.374 --> 00:45:12.043
você é melhor
do que todos nesta casa? É isso?

00:45:12.127 --> 00:45:14.879
É melhor do que seus irmãos?
Do que sua mãe e eu?

00:45:16.297 --> 00:45:17.382
É isso?

00:45:18.007 --> 00:45:19.592
Você precisa pensar.

00:45:21.803 --> 00:45:24.514
- Você se acha melhor do que eu, garoto?
- Joseph, já chega.

00:45:24.597 --> 00:45:25.765
É isso, Michael?

00:45:27.642 --> 00:45:29.477
- É isso, Michael?
- Já chega!

00:45:30.228 --> 00:45:31.479
Katherine, sente-se.

00:45:38.361 --> 00:45:39.487
Vamos sair.

00:45:51.624 --> 00:45:52.625
Aonde você quer ir?

00:45:53.626 --> 00:45:54.919
Só dirige.

00:45:56.045 --> 00:45:57.046
Ok.

00:46:05.180 --> 00:46:07.849
Dá licença. Para trás.
Todos para trás.

00:46:07.932 --> 00:46:09.267
Ei, ei. Vamos lá.

00:46:14.564 --> 00:46:18.276
- Te amo, Michael!
- Cuidado aí!

00:46:21.946 --> 00:46:24.532
- Michael!
- Meu Deus, é o Michael!

00:46:56.564 --> 00:46:58.816
Eu tô de saco cheio, Bill.
De tudo.

00:46:59.400 --> 00:47:01.027
O Joseph me explora.

00:47:02.445 --> 00:47:03.780
Eu já tinha planejado tudo.

00:47:04.656 --> 00:47:06.658
O repertório, o visual.

00:47:08.368 --> 00:47:10.119
Eu queria fazer uma turnê solo.

00:47:13.206 --> 00:47:15.959
Só que... Ele vai estragar tudo.

00:47:16.042 --> 00:47:17.043
Ele...

00:47:22.340 --> 00:47:23.591
Eu preciso da minha liberdade.

00:47:25.051 --> 00:47:26.052
Bom...

00:47:26.844 --> 00:47:27.971
você pode sair de casa.

00:47:30.348 --> 00:47:31.599
Não estou pronto pra isso.

00:47:36.187 --> 00:47:37.605
Não é tão fácil assim.

00:47:38.147 --> 00:47:40.692
A vida não é fácil, filho.
Pode crer.

00:47:47.240 --> 00:47:48.658
Eu amo a minha família.

00:47:50.785 --> 00:47:51.869
De verdade.

00:47:56.708 --> 00:47:58.167
Eu só quero fazer os meus lances.

00:47:59.252 --> 00:48:00.712
O Joseph nunca vai mudar.

00:48:01.588 --> 00:48:03.923
A única preocupação dele
é a Família Jackson.

00:48:05.842 --> 00:48:07.093
E não importa o que você faça,

00:48:07.594 --> 00:48:10.763
ele vai sempre achar
que é um sucesso da família.

00:48:11.556 --> 00:48:12.807
Monte o seu time.

00:48:14.100 --> 00:48:15.435
Arranje um bom advogado.

00:48:16.019 --> 00:48:17.186
Pense nisso.

00:48:25.320 --> 00:48:29.490
OS JACKSONS AO VIVO HOJE
TURNÊ DO TRIUNFO

00:49:02.523 --> 00:49:04.776
- Vou jogar na próxima rodada.
- Vai fundo!

00:49:06.486 --> 00:49:07.820
Pronto. Joga essa.

00:49:07.904 --> 00:49:10.365
Se eu fizer isso, ele vai chorar.

00:49:40.478 --> 00:49:42.188
LISTE TUDO O QUE VOCÊ QUER
ALCANÇAR NA VIDA

00:49:42.271 --> 00:49:45.191
SEJA FIEL A QUEM VOCÊ É
SEJA LIVRE PRA CRIAR

00:49:51.072 --> 00:49:53.449
1981 LOS ANGELES, CALIFÓRNIA

00:49:58.955 --> 00:50:01.624
Agradecemos a sua presença

00:50:01.708 --> 00:50:05.128
e aplaudimos sua decisão
de buscar assessoria independente.

00:50:05.211 --> 00:50:07.547
Oferecemos a abordagem
mais abrangente e cuidadosa

00:50:07.630 --> 00:50:10.174
para todo
o seu portfólio de mídia.

00:50:10.258 --> 00:50:13.594
A Hardee-Barovick trata cada cliente
como se fosse da família, e queremos...

00:50:13.678 --> 00:50:15.304
Eu já tenho uma família.

00:50:16.973 --> 00:50:18.182
E é bem grande.

00:50:20.435 --> 00:50:22.603
A questão é a carreira solo,
certo?

00:50:23.187 --> 00:50:27.108
Então, é provável que deixe
algumas pessoas magoadas em Encino.

00:50:30.445 --> 00:50:32.280
A não ser que eu tenha
entendido mal alguma coisa.

00:50:40.413 --> 00:50:41.456
Eu te conheço?

00:50:41.789 --> 00:50:43.708
Não, acho que não.

00:50:43.791 --> 00:50:44.792
Tem certeza?

00:50:45.543 --> 00:50:47.920
Tenho, acho que eu me lembraria.

00:50:48.921 --> 00:50:50.006
Quem é você?

00:50:50.840 --> 00:50:52.049
John Branca.

00:50:53.593 --> 00:50:54.927
Você é o empresário
dos Beach Boys.

00:50:55.011 --> 00:50:58.556
Sim. E do Neil Diamond,
Bob Dylan e outros.

00:50:58.639 --> 00:50:59.640
E, agora, eu trabalho aqui.

00:51:01.142 --> 00:51:02.226
Eu gosto dos Beach Boys.

00:51:02.310 --> 00:51:04.979
Eu também.
Brian Wilson é um gênio.

00:51:05.062 --> 00:51:07.023
Fez as melhores
harmonias vocais do rock.

00:51:11.360 --> 00:51:13.404
Sabe o que eu quero, Sr. Branca?

00:51:13.654 --> 00:51:17.116
Claro.
Ser o maior astro do mundo.

00:51:21.078 --> 00:51:22.705
Pode ajudar
a fazer isso acontecer?

00:51:24.415 --> 00:51:25.458
Sim.

00:51:26.876 --> 00:51:28.169
Como?

00:51:29.420 --> 00:51:32.340
Porque eu acredito
que não existe ninguém como você.

00:51:34.383 --> 00:51:35.760
E nunca vai existir.

00:51:44.602 --> 00:51:45.770
Sr. Jackson...

00:51:47.563 --> 00:51:48.731
Sr. Jackson, eu peço desculpas...

00:51:48.815 --> 00:51:50.274
Eu quero ele.

00:51:55.154 --> 00:51:56.739
Podem nos deixar a sós
um instante?

00:51:57.949 --> 00:51:59.075
Por favor.

00:51:59.742 --> 00:52:00.742
Claro.

00:52:01.410 --> 00:52:02.745
Sim.

00:52:15.550 --> 00:52:16.968
Muito bem, Sr. Branca.

00:52:18.386 --> 00:52:19.720
Sua primeira missão é a seguinte.

00:52:22.348 --> 00:52:24.058
Quero que demita o Joseph.

00:52:26.644 --> 00:52:27.645
Seu pai?

00:52:28.396 --> 00:52:29.772
Quer que eu demita seu pai?

00:52:31.148 --> 00:52:32.608
Como gostaria
que eu fizesse isso?

00:52:34.360 --> 00:52:35.361
Rápido.

00:52:54.589 --> 00:52:56.299
EM NOME DE MICHAEL JACKSON,

00:52:56.382 --> 00:52:58.676
POR MEIO DESTE, COMUNICO SUA
DISPENSA COMO EMPRESÁRIO DELE...

00:53:03.139 --> 00:53:04.181
Sim.

00:53:04.265 --> 00:53:06.183
Acho que abotoado fica melhor.

00:53:06.267 --> 00:53:07.268
- Tem razão.
- É.

00:53:07.351 --> 00:53:09.729
La Toya, dá o fora daqui.

00:53:11.272 --> 00:53:14.734
Kate, olha isso aqui.
Está vendo isso?

00:53:14.817 --> 00:53:17.361
O garoto me demitiu
com um pedaço de papel.

00:53:18.237 --> 00:53:20.072
Não teve a coragem
de me falar ao vivo.

00:53:20.573 --> 00:53:21.699
De me encarar e fazer isso.

00:53:22.408 --> 00:53:24.368
Esse garoto vai apanhar de cinto
quando chegar.

00:53:26.120 --> 00:53:27.163
Não, não vai.

00:53:28.122 --> 00:53:29.290
Vai, sim.

00:53:29.373 --> 00:53:30.416
Não, não vai.

00:53:31.042 --> 00:53:32.543
Você vai fazer o quê? Bater nele?

00:53:33.169 --> 00:53:36.547
Dar uma surra? Ele cresceu.

00:53:36.631 --> 00:53:38.007
O que disse?

00:53:40.968 --> 00:53:42.970
Que você não pode
mais fazer isso.

00:53:44.639 --> 00:53:45.973
Não pode dar surra em ninguém.

00:53:47.808 --> 00:53:49.393
Não pode bater em ninguém.

00:53:51.228 --> 00:53:53.898
Se não gostou de ouvir,
pode ir embora.

00:53:59.403 --> 00:54:02.365
Da próxima vez que vir seu filho,
agradeça a ele.

00:54:02.949 --> 00:54:05.076
Tudo o que nós temos
é graças a ele.

00:54:05.159 --> 00:54:06.702
Nunca se esqueça disso.

00:54:06.786 --> 00:54:10.706
Parece que todos se esqueceram
de que fui eu quem nos tirou de Gary.

00:54:12.750 --> 00:54:16.837
E de que tudo o que eu fiz
foi por essa família.

00:54:18.214 --> 00:54:20.049
Então, continue pensando assim.

00:54:52.206 --> 00:54:53.958
- Não entramos nesse corredor.
- E agora? Aqui...

00:54:54.041 --> 00:54:56.419
- Esquerda. Esquerda, esquerda.
- Esquerda? Vamos lá.

00:54:59.422 --> 00:55:01.674
- Um trenzinho.
- Adorei.

00:55:04.468 --> 00:55:05.469
Oi.

00:55:06.220 --> 00:55:07.220
Aqui.

00:55:07.555 --> 00:55:09.390
É. Estou muito animado.

00:55:09.473 --> 00:55:11.100
- Olha, é você.
- É você.

00:55:11.183 --> 00:55:12.309
Estou louco pra começar a jogar.

00:55:12.393 --> 00:55:14.729
- É o Michael Jackson.
- O quê?

00:55:14.812 --> 00:55:16.355
- É o Michael Jackson.
- O quê?

00:55:17.732 --> 00:55:19.358
- Não ligue para ele.
- Oi.

00:55:19.442 --> 00:55:23.070
Você é realmente...

00:55:23.154 --> 00:55:24.655
- Eu sou o Michael.
- Uau.

00:55:24.739 --> 00:55:25.740
Mãe.

00:55:25.823 --> 00:55:28.576
Será que...
pode me dar um autógrafo?

00:55:28.909 --> 00:55:30.786
Para o meu filho, sabe?

00:55:31.370 --> 00:55:32.580
- Claro. Posso.
- Filho.

00:55:32.663 --> 00:55:34.373
Ele é muito fã.

00:55:36.000 --> 00:55:39.003
Posso dar o autógrafo aqui?
Como você se chama?

00:55:39.462 --> 00:55:42.840
- Ah, pode ser pra Pauline.
- Mãe.

00:55:43.466 --> 00:55:44.508
Pauline.

00:55:45.176 --> 00:55:47.053
Mãe, meu nome é Max,
não é Pauline.

00:55:48.554 --> 00:55:50.473
Esse é o novo jogo da Atari?

00:55:51.223 --> 00:55:52.683
- Eu adoro.
- Você já jogou?

00:55:52.767 --> 00:55:54.727
Ah, já. Eu jogo sempre.

00:55:55.519 --> 00:55:58.064
Só não esquece de jogar
pra esquerda quando atirar.

00:55:58.147 --> 00:55:59.147
É como recarrega.

00:55:59.190 --> 00:56:01.275
Legal. Obrigado.

00:56:01.358 --> 00:56:02.443
De nada.

00:56:03.277 --> 00:56:04.487
Oi.

00:56:05.071 --> 00:56:06.864
- Você quer um autógrafo?
- Sim, por favor.

00:56:07.323 --> 00:56:08.949
- Qual é o seu nome?
- Annaka.

00:56:09.033 --> 00:56:10.910
Annaka. Que nome bonito.

00:56:10.993 --> 00:56:13.079
- Como se diz, filha?
- Obrigada.

00:56:13.162 --> 00:56:14.663
Somos seus fãs, Michael.

00:56:14.747 --> 00:56:16.082
Muito obrigado.

00:56:17.958 --> 00:56:21.879
Oi. Oi, pessoal. Que fofo.

00:56:22.963 --> 00:56:25.216
- Foi de chuá, bebê.
- Passa, passa.

00:56:25.549 --> 00:56:27.259
- Abre.
- Em qual time...

00:56:31.889 --> 00:56:34.100
Ai, cara...
Aqui, pode deixar. Ah!

00:56:34.725 --> 00:56:35.683
- Oi.
- Oi, Mikey.

00:56:35.684 --> 00:56:36.601
O que foi?

00:56:36.602 --> 00:56:38.395
- E aí, pessoal?
- E aí, Bill?

00:56:40.397 --> 00:56:41.774
Vamos repetir. Muito curta.

00:56:43.359 --> 00:56:44.359
Quem é agora? Sou eu?

00:56:44.360 --> 00:56:45.360
Gente, olha!

00:56:45.820 --> 00:56:46.820
Comprei o Twister.

00:56:47.279 --> 00:56:48.364
- Twister?
- Querem jogar hoje?

00:56:48.447 --> 00:56:49.364
Twister, não.

00:56:49.365 --> 00:56:51.117
- Sério?
- O que vai fazer com isso, cara?

00:56:51.200 --> 00:56:52.952
Jogar como antigamente.

00:56:53.035 --> 00:56:56.372
Eu adoraria, Mike, mas agora tenho
minha família. Não posso ficar jogando.

00:56:56.455 --> 00:56:57.873
E a gente vai sair à noite.

00:56:57.957 --> 00:56:59.542
O Marlon tem um encontro
que promete.

00:56:59.625 --> 00:57:00.625
É.

00:57:01.043 --> 00:57:03.087
Marlon, que horas você volta?
Quer jogar depois?

00:57:03.170 --> 00:57:05.172
O Marlon vai jogar
um Twister diferente.

00:57:05.256 --> 00:57:07.925
Cala a boca, Jackie.
Eu sempre dou sorte.

00:57:10.386 --> 00:57:11.971
Vocês ficaram uns chatos.

00:57:12.054 --> 00:57:13.639
Qual é, Mike. Não faz isso.

00:57:17.059 --> 00:57:20.062
Isso não vale.
Você tirou vermelho, não verde.

00:57:25.734 --> 00:57:28.112
Tudo bem. Não tem problema.

00:57:28.696 --> 00:57:30.281
Demora mesmo pra aprender.

00:57:30.823 --> 00:57:32.658
E eu sou dançarino profissional.

00:57:34.702 --> 00:57:35.911
Quer tomar sorvete?

00:57:37.204 --> 00:57:38.914
Tá.
Mas, depois, eu vou trabalhar.

00:57:39.748 --> 00:57:41.000
Não quebre nada.

00:57:41.750 --> 00:57:42.750
Já volto.

00:58:08.277 --> 00:58:09.778
Pensei em emoldurar isto.

00:58:16.452 --> 00:58:17.536
Leia.

00:58:18.579 --> 00:58:19.997
POR MEIO DESTE,
COMUNICO SUA DISPENSA

00:58:20.080 --> 00:58:21.332
Dê uma lida.

00:58:26.921 --> 00:58:28.547
Demitir o próprio pai.

00:58:29.715 --> 00:58:31.258
Que tipo de filho faz isso?

00:58:38.891 --> 00:58:39.934
Michael.

00:58:42.144 --> 00:58:44.021
Você tem muito o que aprender
sobre família.

00:59:04.083 --> 00:59:06.168
HOSPITAL PEDIÁTRICO WEST BEVERLY
ENTRADA

00:59:08.462 --> 00:59:09.922
- Oi. Seja bem-vindo, Michael.
- Oi.

00:59:10.923 --> 00:59:12.424
Que nome bonito.

00:59:12.508 --> 00:59:13.676
Deem uma olhadinha. Obrigado.

00:59:13.759 --> 00:59:14.802
Obrigado.

00:59:16.345 --> 00:59:17.680
Isto é pra você.

00:59:17.763 --> 00:59:18.847
Mais uma, Michael.

00:59:18.931 --> 00:59:20.140
Oi.

00:59:21.725 --> 00:59:23.519
Posso fazer uma com o disco?

00:59:25.938 --> 00:59:27.022
Michael, aqui.

00:59:29.900 --> 00:59:32.987
Pode repetir isso,
cara de transistor?

00:59:33.821 --> 00:59:35.364
Você vê televisão?

00:59:35.531 --> 00:59:37.741
Sim, às vezes.

00:59:38.826 --> 00:59:40.452
Você vê televisão?

00:59:40.536 --> 00:59:41.662
Sim.

00:59:42.830 --> 00:59:46.250
Desenhos. Adoro Os Três Patetas.

00:59:47.960 --> 00:59:51.213
Charlie Chaplin.
Você sabe quem é?

00:59:52.923 --> 00:59:54.717
- Dã...
- Não é verdade.

00:59:55.592 --> 00:59:56.844
Que bobalhão!

00:59:58.053 --> 01:00:00.222
Ele é maravilhoso. Sério.

01:00:00.306 --> 01:00:03.017
Ele é ator, diretor de cinema.

01:00:04.018 --> 01:00:05.269
E compõe músicas.

01:00:07.563 --> 01:00:11.191
Eu tenho um cachorro.
É um dachshund.

01:00:13.277 --> 01:00:15.571
- Como ele se chama?
- Rudy.

01:00:16.405 --> 01:00:19.700
Ele está ficando gordo. A mamãe
diz que eu dou muita comida.

01:00:21.160 --> 01:00:22.328
Adorei o Rudy.

01:00:22.411 --> 01:00:24.121
Você tem bichos de estimação?

01:00:26.498 --> 01:00:27.624
Uma cobra.

01:00:28.584 --> 01:00:30.919
- E uma girafa.
- Não creio.

01:00:31.003 --> 01:00:32.046
E um lhama.

01:00:33.339 --> 01:00:35.090
Residentes de cirurgia disponíveis,
dirijam-se à UTI pediátrica.

01:00:35.174 --> 01:00:39.845
Três papagaios, duas aranhas
e vários cachorros.

01:00:43.682 --> 01:00:46.310
Tem que ser o disco mais vendido
de todos os tempos.

01:00:47.311 --> 01:00:49.563
E não só entre artistas negros.

01:00:49.646 --> 01:00:52.691
De qualquer raça,
de qualquer cor, entende?

01:00:52.775 --> 01:00:55.736
Depois, eu quero fazer
a maior turnê que já existiu.

01:00:55.819 --> 01:00:57.613
Só shows em estádios.

01:00:57.696 --> 01:01:00.949
Milhares de pessoas
lotando estádios.

01:01:01.033 --> 01:01:01.949
No mundo inteiro.

01:01:01.950 --> 01:01:05.329
Também quero minifilmes
com as minhas músicas.

01:01:05.454 --> 01:01:07.748
- É ambicioso.
- Eu consigo visualizar.

01:01:08.207 --> 01:01:11.668
Se você vê, você consegue fazer.
E eu vejo tão claramente.

01:01:12.961 --> 01:01:14.296
Bom, o Walter Yetnikoff ligou.

01:01:14.380 --> 01:01:16.548
A CBS quer fazer
um comunicado de imprensa.

01:01:16.632 --> 01:01:20.886
Não. Sem imprensa,
sem entrevistas, não quero nada.

01:01:21.637 --> 01:01:22.805
Ele não vai gostar disso.

01:01:24.139 --> 01:01:25.849
Dá um jeito, Branca.

01:01:26.683 --> 01:01:30.187
É que... eu quero ser misterioso.

01:01:31.105 --> 01:01:33.524
Que nem a Garbo. Entende?

01:01:34.358 --> 01:01:38.570
Se o Cometa Halley
passasse todo ano, ano após ano,

01:01:39.029 --> 01:01:40.447
você daria bola?

01:01:41.907 --> 01:01:43.158
Você vai precisar de publicidade.

01:01:43.242 --> 01:01:46.620
O que vou precisar
é de um bom disco que venda.

01:01:46.995 --> 01:01:48.789
- Nada mais importa.
- Está bem.

01:01:49.331 --> 01:01:52.376
Então, sugiro que comece
a fazer umas demos bacanas.

01:01:53.252 --> 01:01:54.545
Acha que consegue?

01:01:55.629 --> 01:01:57.381
É claro que sim.

01:02:02.344 --> 01:02:04.847
- O que está fazendo, Mike?
- Canalizando.

01:02:06.598 --> 01:02:09.309
Para o Criador me enviar
uma música agora.

01:02:10.519 --> 01:02:12.771
Se eu não estiver aqui
pra receber essas ideias,

01:02:13.897 --> 01:02:15.441
Deus pode dar pro Prince.

01:02:18.777 --> 01:02:20.279
Tire um dia de folga, cara.

01:02:20.362 --> 01:02:21.362
Tito.

01:02:31.498 --> 01:02:32.541
Olá.

01:02:58.650 --> 01:03:01.570
NÃO PERTURBE TRABALHANDO

01:03:04.031 --> 01:03:05.866
VOU FALAR DE NOVO
EU NÃO VOU PARAR

01:03:08.285 --> 01:03:09.786
ILUMINE O MUNDO

01:03:28.222 --> 01:03:32.100
Quase todos os tiroteios e mortes
por conta de drogas e territórios

01:03:32.184 --> 01:03:34.394
envolvem gangues rivais.

01:03:34.478 --> 01:03:37.022
Ryan Chavez,
direto de Los Angeles.

01:03:39.650 --> 01:03:42.528
Um melhor amigo morto
por um membro de uma gangue rival.

01:03:42.611 --> 01:03:47.616
Outro morreu baleado em Sacramento
porque vestia a cor errada.

01:03:47.699 --> 01:03:51.745
Os que vestem azul são os Crips.
Os Bloods usam vermelho.

01:03:51.870 --> 01:03:55.457
Alguns, como Smokey, sobrevivem
aos ataques, mas com sequelas.

01:03:55.541 --> 01:03:58.961
Tem gente morrendo à toa, cara.
Por um território.

01:03:59.044 --> 01:04:01.672
E a cidade permanece lotada
de soldados dessa guerra.

01:04:01.755 --> 01:04:03.840
É fácil dançar, mano.

01:04:04.800 --> 01:04:07.803
Ninguém aí faz isso.
Vocês não morreriam por ele, né?

01:04:08.637 --> 01:04:11.473
Tá falando isso agora na TV,
mas não morreria por ele na real.

01:04:11.557 --> 01:04:13.058
Mas eu morreria
pelo meu camarada.

01:04:13.141 --> 01:04:17.729
Mas, com o tempo, eu passei
a usar cada vez mais drogas,

01:04:17.813 --> 01:04:19.940
e comecei a ter
problemas nas ruas.

01:04:20.023 --> 01:04:23.902
Então, eu pensei comigo mesmo
que era isso ou morte.

01:04:23.986 --> 01:04:26.530
Ryan Chavez,
direto de Los Angeles.

01:04:54.933 --> 01:04:56.727
MOSTRA QUE VOCÊ NÃO TÁ COM MEDO

01:04:59.271 --> 01:05:00.271
DURÃO - BRUTÃO -
PRESSÃO - DE MONTÃO

01:05:05.819 --> 01:05:06.819
NINGUÉM QUER SER DERROTADO

01:05:07.446 --> 01:05:08.446
DURÃO DE MONTÃO

01:05:09.239 --> 01:05:10.407
SONHE. VEJA. ACREDITE.
DÊ O SEU MELHOR.

01:05:12.075 --> 01:05:14.870
EU TÔ COM FOGO NOS OLHOS
ENTÃO ME OBEDECE E SE MANDA

01:05:16.788 --> 01:05:18.165
A MENTIRA SE TORNA VERDADE

01:05:26.298 --> 01:05:28.508
- Alô?
- Oi, Bill, sou eu.

01:05:28.592 --> 01:05:29.926
E aí, joker, tudo bem?

01:05:30.594 --> 01:05:33.597
Tô precisando de ajuda. Acha
que pode descolar uns favores?

01:05:34.640 --> 01:05:38.435
Ok, estão todos no estúdio.
Mas eles só foram por sua causa.

01:05:39.686 --> 01:05:41.438
Não acredito
que está fazendo isso.

01:05:41.980 --> 01:05:43.774
A música une as pessoas, Bill.

01:05:44.650 --> 01:05:46.109
Esse é o objetivo.

01:05:46.818 --> 01:05:49.488
E se der tudo certo,
eu tenho uma grande ideia.

01:06:01.583 --> 01:06:03.877
Cara, você é péssimo.

01:06:04.378 --> 01:06:05.378
Que diabo é isso? Tira ele.

01:06:16.515 --> 01:06:18.684
Cara, senta aí.
Tá fazendo o que aí?

01:06:23.230 --> 01:06:24.523
É o Michael Jackson.

01:06:24.606 --> 01:06:26.400
É o Michael Jackson.
É o Michael Jackson.

01:06:26.483 --> 01:06:27.734
- É o Michael Jackson.
- O quê?

01:06:28.694 --> 01:06:30.028
É o Michael.

01:06:30.153 --> 01:06:31.571
Gostei disso aí que você fez.

01:06:32.864 --> 01:06:35.283
- O que é?
- A gente chama de "popping", cara.

01:06:38.745 --> 01:06:40.330
E isso aqui...

01:06:41.957 --> 01:06:44.334
Isso é um lixo, cara. Não. Não.

01:06:44.918 --> 01:06:46.712
A gente chama de "C-Walk", primo.

01:06:52.008 --> 01:06:53.301
Pode me dar um autógrafo?

01:06:55.345 --> 01:06:58.056
- Fala, sério, mano.
- Tanto faz.

01:06:58.140 --> 01:06:59.641
Olha, é pra minha irmã.

01:07:01.268 --> 01:07:04.104
Posso, claro. Depois,
eu dou autógrafo pra todo mundo.

01:07:05.188 --> 01:07:08.108
- É isso aí, Mike.
- Muito amor, Mike.

01:07:08.525 --> 01:07:09.776
Claro.

01:07:09.860 --> 01:07:11.945
Olha, eu sei que isso
não é fácil pra vocês.

01:07:12.154 --> 01:07:14.322
Então, quero agradecer a todos
por terem vindo.

01:07:14.406 --> 01:07:16.032
É muito importante pra mim.

01:07:16.950 --> 01:07:21.371
Acho que música e dança
são as coisas que temos em comum.

01:07:23.373 --> 01:07:25.542
É a linguagem universal.

01:07:27.294 --> 01:07:28.503
Nós podemos mudar o mundo.

01:07:29.379 --> 01:07:30.964
- Eu acredito nisso.
- Isso aí, mano.

01:07:31.047 --> 01:07:32.047
- Certeza.
- É isso aí.

01:07:32.090 --> 01:07:33.967
- Pode crer.
- Respeito.

01:07:35.010 --> 01:07:36.303
Vamos trabalhar nisso juntos.

01:08:04.623 --> 01:08:05.791
Continuem.

01:08:06.166 --> 01:08:08.084
Vamos...
vamos trabalhar essa parte.

01:08:09.044 --> 01:08:11.296
Por enquanto,
vamos esquecer os braços...

01:08:11.797 --> 01:08:13.256
Não é pra ser forçado.

01:08:13.840 --> 01:08:15.342
É orgânico, é um fluxo.

01:08:17.427 --> 01:08:18.637
Tudo junto.

01:08:23.350 --> 01:08:26.603
Viram? Em uníssono, entendem?

01:08:27.395 --> 01:08:31.441
Imaginem um cardume.
A gente se move junto.

01:08:31.525 --> 01:08:32.859
Estão entendendo?

01:08:34.194 --> 01:08:35.403
Eu quero tentar uma coisa.

01:08:36.822 --> 01:08:38.114
Tive uma ideia.

01:08:39.950 --> 01:08:41.785
Bill, me dá minha jaqueta,
por favor?

01:08:43.411 --> 01:08:46.540
Quero tentar uma coisa
quando a gente vier pra cá...

01:08:47.707 --> 01:08:49.042
com a jaqueta.

01:08:50.627 --> 01:08:52.212
- Obrigado.
- Tranquilo.

01:08:54.047 --> 01:08:56.633
Vamos de novo.
Eu vou descolar e fazer um lance,

01:08:56.842 --> 01:08:58.218
mas vocês continuam com o fluxo.

01:09:10.730 --> 01:09:12.148
É! Gostei.

01:09:16.194 --> 01:09:17.529
É.

01:09:18.947 --> 01:09:20.115
O que vocês acham?

01:09:21.825 --> 01:09:23.076
Ficou demais, mano.

01:09:23.994 --> 01:09:25.996
Ficou bom? Legal.

01:09:28.832 --> 01:09:31.877
Quero tentar com música agora. É.

01:09:34.629 --> 01:09:37.632
Na verdade, eu quero colocar
vocês no meu minifilme.

01:09:41.219 --> 01:09:43.597
Solta o som. Eu quero sentir.

01:10:11.291 --> 01:10:14.836
Sabe, a CBS quer que o disco
se chame "Michael Jackson".

01:10:17.797 --> 01:10:19.090
Egocêntrico demais.

01:10:19.174 --> 01:10:20.300
Mais alto.

01:10:21.426 --> 01:10:25.388
Cai direto no balanço e deixa
fluir pro resto do refrão, tá?

01:10:25.472 --> 01:10:28.016
Tá legal. Vou tentar.

01:10:28.099 --> 01:10:32.395
É você que está na capa do disco.
Você canta todas as músicas.

01:10:32.479 --> 01:10:33.730
Um pouco mais.

01:10:33.813 --> 01:10:35.523
Tá querendo enganar quem?

01:11:05.470 --> 01:11:08.056
- Isso, sim, é rock n’ roll!
- É um lance Van Halen.

01:11:21.236 --> 01:11:22.988
...foi tirada de mim.

01:11:23.655 --> 01:11:27.283
Você, não, minha Maria Antonieta,
pois eu lhe darei vida eterna.

01:12:22.672 --> 01:12:24.132
Podemos parar um instante?

01:12:24.591 --> 01:12:26.051
Corta, corta!

01:12:26.551 --> 01:12:28.094
Foi ótimo. Vocês estão perfeitos.

01:12:28.636 --> 01:12:30.680
Não esfriem, deem uma alongada.

01:12:34.267 --> 01:12:36.102
É pra câmera se aproximar tanto?

01:12:37.228 --> 01:12:38.313
Posso perguntar ao John.

01:12:39.606 --> 01:12:42.358
Está buscando algo em especial,
ou...

01:12:42.442 --> 01:12:44.903
Só estou preocupado
que não esteja pegando os pés.

01:12:44.986 --> 01:12:47.947
Entende? Fred Astaire sempre dizia:
"Tem que pegar o corpo todo."

01:12:48.364 --> 01:12:50.533
Porque é assim que o público
sente a dança.

01:12:50.617 --> 01:12:51.659
Tá certo.

01:12:53.328 --> 01:12:55.622
Pode pedir
ao John pra tentar isso?

01:12:55.705 --> 01:12:57.457
- Só um take.
- Claro, pode deixar.

01:12:57.540 --> 01:12:58.708
- Obrigado.
- Tá.

01:13:00.168 --> 01:13:01.169
Michael, rapidinho.

01:13:01.628 --> 01:13:02.921
Tudo bem aqui?

01:13:03.004 --> 01:13:06.424
Em vez de aproximar a câmera, ele
quer que afaste pra pegar os pés.

01:13:06.508 --> 01:13:07.508
Tá. Vamos afastar...

01:13:09.135 --> 01:13:12.764
Ok, Michael, vamos afastar e pegar
você da cabeça aos pés, ok?

01:13:12.847 --> 01:13:14.140
Perfeito. Obrigado.

01:13:14.224 --> 01:13:17.102
Ok, pessoal,
às posições iniciais, por favor.

01:13:18.645 --> 01:13:21.064
Silêncio, por favor. Prepara.

01:13:21.564 --> 01:13:23.274
Vamos lá. Som pronto.

01:13:24.275 --> 01:13:26.861
Câmera, prepara. Claquete!

01:13:30.990 --> 01:13:36.037
Ok, solta o som. E... ação!

01:15:37.283 --> 01:15:39.953
O que posso dizer, pessoal,
além de: "parabéns".

01:15:40.036 --> 01:15:43.206
O disco é incrível.
Todo mundo está comprando.

01:15:43.331 --> 01:15:46.000
Está nas paradas pop e R&B.

01:15:46.084 --> 01:15:50.296
Se esse garoto fizesse dueto com a Reba,
estaríamos nas paradas country.

01:15:51.297 --> 01:15:53.925
Obrigado, Walter.
Muito obrigado mesmo.

01:15:55.260 --> 01:15:59.681
Michael, todos na família CBS
têm muito orgulho de você.

01:16:00.348 --> 01:16:01.766
Eu tenho orgulho de você.

01:16:01.849 --> 01:16:04.936
Agora, o que posso
fazer por você, meu filho?

01:16:05.019 --> 01:16:07.105
Seu desejo é uma ordem.

01:16:08.314 --> 01:16:11.359
Bom, eu estou muito feliz
com as vendas de "Thriller".

01:16:12.318 --> 01:16:13.319
Mas...

01:16:16.781 --> 01:16:17.907
Branca.

01:16:18.700 --> 01:16:20.410
Estamos felizes com as vendas,

01:16:20.493 --> 01:16:22.912
mas ainda falta uma coisa
em termos de promoção.

01:16:24.539 --> 01:16:26.749
Precisamos colocar
os videoclipes dele na MTV.

01:16:27.583 --> 01:16:29.711
MTV? Ai, ai, ai. Impossível.

01:16:29.794 --> 01:16:31.754
Os clipes são obras-primas.

01:16:31.838 --> 01:16:34.424
Você ainda não viu "Thriller".
Vai ficar de queixo caído.

01:16:34.716 --> 01:16:37.176
E eles vão promover o disco
mais do que qualquer coisa.

01:16:37.260 --> 01:16:40.722
Se conseguirmos que passe direto
na MTV, o céu é o limite.

01:16:41.222 --> 01:16:42.557
Você sabe disso.

01:16:43.266 --> 01:16:47.145
A MTV quase nunca exibe
artistas negros. Não sei por quê.

01:16:47.228 --> 01:16:50.857
Talvez não queiram assustar crianças
brancas nas áreas mais nobres.

01:16:50.940 --> 01:16:55.028
Walter, eu fiz esse disco
para todos: Brancos e negros.

01:16:55.737 --> 01:16:58.072
Achamos que os clipes do Michael
merecem ser vistos.

01:16:59.407 --> 01:17:01.868
Michael,
deixa eu te dizer uma coisa...

01:17:01.951 --> 01:17:03.828
Eu sou um artista negro
orgulhoso, Walter.

01:17:04.996 --> 01:17:07.665
Ninguém vai me enxotar
para o fundo do ônibus.

01:17:07.749 --> 01:17:10.251
Nem a MTV, nem ninguém.

01:17:14.964 --> 01:17:17.884
Acredite em mim, John,
eu já tentei.

01:17:20.011 --> 01:17:21.262
Com carinho, Walter...

01:17:22.972 --> 01:17:24.057
tente se esforçar mais.

01:17:31.564 --> 01:17:35.818
Sally, querida, pode ligar
para o Bob Pittman da MTV, agora?

01:17:35.902 --> 01:17:40.531
E diga ao idiota pra largar tudo
e atender minha ligação imediatamente.

01:17:40.615 --> 01:17:42.492
- Claro.
- Obrigado.

01:17:55.421 --> 01:17:58.007
- Michael, está gostando de Nova York?
- Sim.

01:17:58.091 --> 01:18:01.969
Eu posso conseguir ingressos
para o Marcel Marceau na Broadway,

01:18:02.053 --> 01:18:03.262
na primeira fila.

01:18:03.346 --> 01:18:06.599
Quer saber? Melhor ainda, na segunda.
É melhor evitar a primeira.

01:18:06.682 --> 01:18:10.019
Os artistas franceses não são
muito de tomar banho, sabe?

01:18:10.103 --> 01:18:13.022
É tipo o Pepe Le Gambá,
mas sem tanto papo.

01:18:13.106 --> 01:18:16.275
Sabe, estou segurando um arroto
porque eu me enchi de Coca-Cola.

01:18:16.984 --> 01:18:17.985
Sally?

01:18:21.531 --> 01:18:24.659
Bob, obrigado por me atender.

01:18:25.410 --> 01:18:26.577
Escute...

01:18:28.871 --> 01:18:31.124
eu preciso que veicule
Billie Jean pra mim.

01:18:31.916 --> 01:18:33.751
Eu sei. Eu sei.

01:18:35.086 --> 01:18:37.630
Mas o problema é o seguinte:
eu tô cagando pra isso.

01:18:37.713 --> 01:18:40.383
Eu tô cagando mesmo.
Tô cagando baldes.

01:18:40.466 --> 01:18:43.803
Então, quero que veicule Billie
Jean direto na programação.

01:18:45.930 --> 01:18:48.683
Tá legal, Bob, vou explicar
de outro jeito.

01:18:48.766 --> 01:18:51.727
Se você não veicular Billie Jean
nos próximos 10 minutos,

01:18:51.811 --> 01:18:56.315
vou retirar todos os artistas
da CBS da sua programação, tá?

01:18:56.399 --> 01:18:59.569
Bruce Springsteen, Cheap Trick,
Charlie Daniels,

01:18:59.652 --> 01:19:03.197
Billy Joel, Cyndi Lauper,
Bob Dylan...

01:19:03.281 --> 01:19:06.075
Coloque todos eles
em um saco plástico,

01:19:06.159 --> 01:19:08.369
passe bastante vaselina

01:19:08.453 --> 01:19:10.621
e enfie no rabo.

01:19:11.414 --> 01:19:13.040
É, no cu mesmo.

01:19:13.374 --> 01:19:15.251
Não trabalhamos mais juntos.

01:19:28.890 --> 01:19:32.268
1983
MOTOWN 25 - PASADENA, CALIFÓRNIA

01:19:33.978 --> 01:19:37.940
"Thriller", de Michael Jackson,
vendeu 25 milhões de cópias até agora.

01:19:38.024 --> 01:19:39.484
Nenhum artista alcançou...

01:19:39.567 --> 01:19:41.569
Michael Jackson redefine
o termo "superstar". E o mundo...

01:19:41.652 --> 01:19:42.611
Michael! Aqui.

01:19:42.612 --> 01:19:45.198
Ele revitalizou, sozinho,
a indústria da música. Se o Elvis...

01:19:45.281 --> 01:19:49.744
Sempre que Billie Jean toca no rádio,
vemos o surgimento de um artista...

01:19:49.827 --> 01:19:52.830
Façam as contas. Ele é um dos artistas
mais populares de todos os tempos.

01:19:52.914 --> 01:19:57.126
E, hoje, isso significa que ele é,
sozinho, um império financeiro também.

01:21:48.946 --> 01:21:51.365
Michael! Michael!
Michael! Michael!

01:22:11.886 --> 01:22:13.262
É, muito bom.

01:22:36.327 --> 01:22:38.788
Quanto tempo! É. Obrigado.

01:22:41.707 --> 01:22:43.626
Sr. Gordy. Sr. Gordy, aqui!

01:22:44.710 --> 01:22:47.129
- Onde ele está?
- Olha ele aí! Está ali.

01:22:47.213 --> 01:22:50.549
Vem cá! Tá de brincadeira, cara?
Foi demais, Michael!

01:22:50.633 --> 01:22:52.968
Sua performance abalou
o mundo. Caramba!

01:22:53.052 --> 01:22:54.637
Era pra ter ficado
na ponta dos pés mais tempo.

01:22:54.720 --> 01:22:57.807
Michael, que orgulho de você!
Todo mundo só fala nisso.

01:22:59.558 --> 01:23:03.312
Vocês viram? Todos viram?
Caramba!

01:23:03.396 --> 01:23:07.358
Você arrasou! É o meu filho!
Esse é o meu filho!

01:23:07.441 --> 01:23:09.694
Uma verdadeira máquina
de fazer dinheiro.

01:23:11.487 --> 01:23:13.155
- A gente se vê depois, Mike.
- Tá.

01:23:13.531 --> 01:23:15.324
- É, tchau, Mike.
- Tá tudo bem, mãe.

01:23:18.494 --> 01:23:20.454
Não conseguiu dar
uma noite de folga pra ele, né?

01:23:22.665 --> 01:23:23.666
O quê?

01:23:26.544 --> 01:23:29.588
Então,
deixa eu ver se entendi, Don.

01:23:29.672 --> 01:23:32.508
Dez, onze ou doze,
quantos títulos você tem?

01:23:32.591 --> 01:23:37.054
Treze dos atuais campeões
mundiais foram promovidos por mim.

01:23:37.138 --> 01:23:40.141
Temos 110 lutadores na carteira.

01:23:40.224 --> 01:23:42.309
Mas ouça bem o que vou dizer, tá?

01:23:42.393 --> 01:23:44.478
O que vai estourar
agora vai ser...

01:23:45.396 --> 01:23:47.356
a categoria dos pesos leves.

01:23:47.440 --> 01:23:49.984
Vou levar esses jovens astros
até o topo.

01:23:50.067 --> 01:23:51.652
- Com certeza, vai.
- É.

01:23:52.111 --> 01:23:56.407
- A vida é boa, meu amigo.
- É mesmo. É, sim.

01:23:56.490 --> 01:23:58.743
Esses cubanos
vieram direto do Castro.

01:23:58.826 --> 01:24:02.747
- Muito bom. Aí, sim.
- Sim. Sim, sim.

01:24:02.830 --> 01:24:06.208
Agora, diga, sobre o que
você queria conversar?

01:24:10.421 --> 01:24:12.965
Já pensou em entrar
no ramo da música?

01:24:13.048 --> 01:24:16.010
- Um lance combinado.
- Não entendi.

01:24:17.261 --> 01:24:20.848
Bom, eu vou levar meus filhos
para uma turnê mundial.

01:24:20.931 --> 01:24:23.976
Começaremos pela América
do Norte. Só shows em estádios.

01:24:24.560 --> 01:24:25.686
Nos maiores.

01:24:25.770 --> 01:24:28.522
É hora de mostrar ao mundo
que os Jacksons voltaram.

01:24:28.606 --> 01:24:30.858
- É isso aí.
- Maiores do que nunca.

01:24:30.941 --> 01:24:35.070
Já viu as vendas do "Thriller"?
O povo vai subir pelas paredes.

01:24:37.990 --> 01:24:39.700
O Michael também vai?

01:24:44.121 --> 01:24:45.956
É claro que o Michael vai.

01:24:46.457 --> 01:24:47.458
É bom saber.

01:24:48.459 --> 01:24:50.336
E o que eu levo nisso?

01:24:53.255 --> 01:24:56.801
Eu estou de olho em você, Don.
Estou de olho que nem falcão.

01:24:57.676 --> 01:24:59.720
Gosto de como promove
seus lutadores.

01:24:59.804 --> 01:25:01.680
O rei do marketing.

01:25:01.764 --> 01:25:03.057
Eu acho que...

01:25:03.140 --> 01:25:06.018
eu e você, se a gente
se juntasse, nós poderíamos...

01:25:08.062 --> 01:25:10.606
- Formar uma boa parceria.
- Eu e você?

01:25:10.689 --> 01:25:11.899
Eu faço um acordo contigo.

01:25:13.234 --> 01:25:14.568
Eu gosto de acordos.

01:25:21.200 --> 01:25:24.328
Eu preciso disso
para os meus garotos.

01:25:25.329 --> 01:25:26.372
Eu preciso.

01:25:27.039 --> 01:25:31.001
Eu acho que eles merecem
o Rolls-Royce dos patrocínios.

01:25:31.085 --> 01:25:34.505
Sabe, com merchandising,
marketing, entende?

01:25:34.588 --> 01:25:37.633
Tem que ser coisa grande.
E só nós dois podemos fazer isso.

01:25:39.635 --> 01:25:43.389
Vai se chamar:
"A Turnê da Vitória".

01:25:48.477 --> 01:25:50.271
Talvez eu tenha algo pra você.

01:25:51.313 --> 01:25:53.858
Pepsi.
Eles querem voltar pro jogo.

01:25:54.024 --> 01:25:55.943
O Michael poderia
ser o rosto da marca.

01:25:56.026 --> 01:25:57.152
Fazer uns comerciais.

01:25:57.987 --> 01:25:59.029
Aí, sim.

01:26:00.114 --> 01:26:01.824
- Consigo até ver.
- É.

01:26:03.534 --> 01:26:06.036
Mas isso não é papo-furado,
né, Joe?

01:26:08.622 --> 01:26:10.457
Porque se o Michael
não estiver nessa...

01:26:21.802 --> 01:26:24.305
Adoro...
é a minha parte favorita.

01:26:25.681 --> 01:26:27.016
ELE É LOUCO!!!

01:26:30.936 --> 01:26:32.646
Já vou indo, Michael.

01:26:32.938 --> 01:26:35.691
- Não vai ainda não.
- Não, eu vou dormir. Estou cansada.

01:26:35.774 --> 01:26:37.484
Tem que ver o final.
É a melhor parte.

01:26:37.568 --> 01:26:39.695
A mamãe está cansada, bebê.

01:26:40.404 --> 01:26:43.073
Por favor, não se esqueça
de apagar as luzes.

01:26:43.157 --> 01:26:45.242
- Boa noite, mãe.
- Boa noite.

01:27:21.320 --> 01:27:22.655
O que está fazendo aqui?

01:27:23.781 --> 01:27:25.741
Um pai não pode visitar o filho?

01:27:28.077 --> 01:27:30.746
O disco mais vendido
de todos os tempos

01:27:31.372 --> 01:27:33.374
de um garoto pobre de Gary.

01:27:34.208 --> 01:27:35.208
Quem imaginaria?

01:27:36.168 --> 01:27:38.504
Eu. Eu imaginei.

01:27:44.343 --> 01:27:45.344
Vem cá.

01:27:46.804 --> 01:27:48.681
Joseph, eu sei que você quer
alguma coisa.

01:27:53.644 --> 01:27:54.770
Michael...

01:27:56.814 --> 01:27:58.983
Preciso que saia em turnê
com seus irmãos.

01:28:00.567 --> 01:28:03.070
Eu deixei você fazer
o disco sozinho.

01:28:04.238 --> 01:28:06.073
Preciso que faça isso por mim.

01:28:07.992 --> 01:28:08.993
Pela sua família.

01:28:10.577 --> 01:28:12.705
Eu não sou mais criança, Joseph.

01:28:13.747 --> 01:28:15.499
- E você não é meu empresário.
- Começou.

01:28:15.582 --> 01:28:17.751
Preciso começar a viver
a minha vida.

01:28:19.628 --> 01:28:20.921
Por minha conta.

01:28:22.131 --> 01:28:23.590
Assim como todo mundo.

01:28:23.674 --> 01:28:25.426
Você não é como todo mundo.

01:28:28.429 --> 01:28:31.306
Está dizendo
que quer ser tratado como adulto.

01:28:32.433 --> 01:28:33.767
Está bem.

01:28:33.851 --> 01:28:37.479
Se você quer ver como é o mundo

01:28:38.814 --> 01:28:40.858
sem uma família que te protege,

01:28:43.152 --> 01:28:46.739
sem uma família que te entende.

01:28:47.573 --> 01:28:50.701
Ninguém vai te entender
fora dessa casa.

01:28:51.326 --> 01:28:54.079
Você terá todo
o dinheiro do mundo,

01:28:54.163 --> 01:28:58.208
estará cercado de gente
que vai dizer "sim" pra tudo.

01:29:00.794 --> 01:29:02.212
É o que você quer?

01:29:06.675 --> 01:29:08.218
Que sentido tem isso?

01:29:16.351 --> 01:29:19.480
Eu vou ligar para o Don King

01:29:20.230 --> 01:29:21.940
e dizer que você vai na turnê.

01:29:24.735 --> 01:29:26.653
Sei que não quer
decepcionar sua família.

01:30:06.819 --> 01:30:08.570
Corta, corta. Corta, corta.

01:30:08.654 --> 01:30:10.280
Vamos cortar, pessoal.

01:30:11.698 --> 01:30:14.118
Olha só, eu preciso
do seguinte... Pensei em...

01:30:15.744 --> 01:30:18.205
Vou fechar o ângulo
quando você estiver aqui.

01:30:18.747 --> 01:30:21.291
Preciso de um close seu
lá no alto.

01:30:21.375 --> 01:30:23.585
É só acompanhar a câmera
enquanto desce.

01:30:23.669 --> 01:30:25.295
- Tá.
- Ótimo. Vamos lá.

01:30:25.379 --> 01:30:28.257
Muito bem, pessoal. Vamos lá.

01:30:29.049 --> 01:30:31.260
Que tomada é essa, é a tomada 6?

01:30:31.510 --> 01:30:34.596
Seis da sorte, vai dar sorte.
Vamos lá. Energia, pessoal!

01:30:34.680 --> 01:30:37.224
Vocês amam os Jacksons,
vocês amam os Jacksons.

01:30:37.307 --> 01:30:39.184
Vocês amam Pepsi, vamos lá!

01:30:39.810 --> 01:30:41.061
Claquete A.

01:30:42.146 --> 01:30:43.146
Claquete B.

01:30:44.231 --> 01:30:46.900
- Claquete C.
- E solta o som.

01:31:20.309 --> 01:31:21.393
Michael!

01:31:22.811 --> 01:31:24.563
- Mike, o que foi? O que houve?
- Mike, o que está acontecendo?

01:31:25.230 --> 01:31:26.815
- Chamem um médico!
- Sai, Tito. Deixa, deixa, Jackie.

01:31:26.899 --> 01:31:27.983
Bill, venha aqui!

01:31:28.066 --> 01:31:29.526
Tô aqui, tô aqui, Michael.

01:31:29.610 --> 01:31:30.568
Levanta ele. Ajuda aqui.

01:31:30.569 --> 01:31:31.485
Tô aqui, joker. Tô aqui.

01:31:31.486 --> 01:31:33.655
- Você vai ficar bem.
- Vem, Michael.

01:31:33.739 --> 01:31:34.781
Sai da frente!

01:31:38.368 --> 01:31:39.453
Sai da minha frente.

01:31:39.536 --> 01:31:41.205
Michael, estou indo!

01:31:41.288 --> 01:31:43.916
Sai! Sai da minha frente!
Abram caminho.

01:31:43.999 --> 01:31:45.542
Abram caminho. Libera o caminho!

01:31:46.960 --> 01:31:49.880
Abram caminho.
Sai! Sai, por favor!

01:31:50.422 --> 01:31:51.422
Michael!

01:31:52.674 --> 01:31:53.759
Com licença!

01:32:24.790 --> 01:32:26.124
Katy. Katy, vamos.

01:32:26.208 --> 01:32:27.417
CENTRO DE QUEIMADOS

01:32:28.460 --> 01:32:30.462
- Quero falar com você.
- Pois não.

01:32:30.545 --> 01:32:32.172
Sou o pai dele, Joseph Jackson.

01:32:32.422 --> 01:32:33.840
Essa é a mãe dele, Katherine.

01:32:33.924 --> 01:32:36.260
- Oi, muito prazer.
- Muito prazer. Obrigada.

01:32:37.010 --> 01:32:40.264
O estado do filho de vocês
é estável.

01:32:40.973 --> 01:32:43.225
E estamos tentando
baixar a frequência cardíaca,

01:32:43.308 --> 01:32:44.768
mas ele está com muita dor.

01:32:45.936 --> 01:32:47.354
Quando ele vai se recuperar?

01:32:47.771 --> 01:32:48.814
É muito cedo para saber.

01:32:49.606 --> 01:32:51.483
Vai ser um longo caminho.

01:32:51.566 --> 01:32:54.778
Ele tem queimaduras de 3º grau
e sérios danos nervosos.

01:32:56.780 --> 01:32:57.906
É muito grave.

01:32:58.699 --> 01:33:02.661
Acha que ele vai poder voltar
a se apresentar? Algum dia?

01:33:03.370 --> 01:33:04.746
Joseph.

01:33:08.292 --> 01:33:11.420
Sr. Jackson,
seu filho quase morreu.

01:33:11.503 --> 01:33:12.546
Eu sei disso.

01:33:12.629 --> 01:33:16.842
Se o fogo tivesse pegado na roupa,
ou atingido o rosto e os olhos,

01:33:16.925 --> 01:33:17.883
ele não estaria aqui.

01:33:17.884 --> 01:33:19.177
Eu conheço o meu filho.

01:33:19.970 --> 01:33:21.930
E a única coisa que vai curá-lo

01:33:22.097 --> 01:33:23.807
é voltar ao palco.

01:33:25.142 --> 01:33:26.435
É onde ele vive.

01:33:26.518 --> 01:33:28.103
- Eu entendo isso.
- Entende?

01:33:28.186 --> 01:33:30.522
- Vai demorar um pouco. Sim, entendo.
- Tá.

01:33:30.605 --> 01:33:34.693
Mas, Sr. Jackson, ele vai precisar
do seu apoio para chegar lá.

01:33:35.444 --> 01:33:36.486
Sinto muito.

01:33:41.700 --> 01:33:43.076
Michael! Michael!

01:33:43.160 --> 01:33:44.911
É improvável que volte a crescer.

01:33:45.746 --> 01:33:49.082
Precisará operar para remover
a laser o tecido cicatricial

01:33:49.166 --> 01:33:51.543
e esticar parte do couro cabeludo
sobre a queimadura.

01:33:52.669 --> 01:33:56.131
Vou inserir um implante
para proteger o couro cabeludo.

01:33:56.214 --> 01:33:57.674
Terei que usar peruca?

01:33:58.133 --> 01:33:59.551
É no cocuruto.

01:34:02.012 --> 01:34:04.514
Que tipo de peruca? Uma completa?

01:34:04.598 --> 01:34:05.724
É difícil prever.

01:34:05.891 --> 01:34:08.143
Podemos experimentar
próteses capilares entrelaçadas,

01:34:08.226 --> 01:34:11.521
mas só saberemos depois
da cirurgia na semana que vem.

01:34:19.446 --> 01:34:20.655
Você...

01:34:21.531 --> 01:34:23.867
vai ter que tomar Demerol
por um tempo.

01:34:23.950 --> 01:34:25.660
Não quero tomar remédios.

01:34:26.328 --> 01:34:28.955
Preciso ser sincero, Sr. Jackson,
vai ser necessário.

01:34:30.040 --> 01:34:32.459
Teremos que trocar
o implante periodicamente.
