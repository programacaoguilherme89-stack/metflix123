a única coisa entre ele e a sua missão.

01:13:27.623 --> 01:13:29.832
E, quer o admita quer não,

01:13:29.833 --> 01:13:32.932
a missão dele
é a destruição global.

01:13:33.629 --> 01:13:36.435
Tudo isto dentro de um túmulo.

01:13:37.966 --> 01:13:40.189
Portanto, resistam.

01:13:40.552 --> 01:13:42.678
Suplantem aquele sacana platinado.

01:13:42.679 --> 01:13:44.402
O Steve não gosta
desse tipo de linguagem.

01:13:44.640 --> 01:13:46.445
Sabes que mais, Romanoff...?

01:13:46.642 --> 01:13:48.489
O que pretende ele?

01:13:49.812 --> 01:13:51.813
Tornar-se melhor.

01:13:51.814 --> 01:13:53.356
Melhor do que nós.

01:13:53.357 --> 01:13:54.899
Não para de construir corpos.

01:13:54.900 --> 01:13:56.122
Corpos humanos.

01:13:56.360 --> 01:14:00.405
A forma humana não é eficiente.
Biologicamente, está desactualizada.

01:14:00.406 --> 01:14:02.490
Mas ele volta sempre a ela.

01:14:02.491 --> 01:14:04.659
Quando vocês o programaram
para proteger a espécie humana,

01:14:04.660 --> 01:14:06.327
falharam redondamente.

01:14:06.328 --> 01:14:08.676
Eles não precisam de ser protegidos.

01:14:08.747 --> 01:14:10.845
Precisam de evoluir.

01:14:12.459 --> 01:14:14.669
O Ultron vai evoluir.

01:14:14.670 --> 01:14:16.058
Como?

01:14:17.005 --> 01:14:20.062
Alguém tem contactado
com a Helen Cho?

01:14:23.429 --> 01:14:25.471
É lindo.

01:14:25.472 --> 01:14:28.516
Os átomos de vibranium não são só
compatíveis com as células

01:14:28.517 --> 01:14:30.156
dos tecidos, estão a ligá-las.

01:14:30.269 --> 01:14:31.811
E a S.H.I.E.L.D. nunca pensou...

01:14:31.812 --> 01:14:34.522
A substância
mais versátil do planeta

01:14:34.523 --> 01:14:37.150
e eles usaram-na
para construir um frisbee.

01:14:37.151 --> 01:14:38.568
É típico dos humanos.

01:14:38.569 --> 01:14:41.459
Só arranham a superfície
e nunca se lembram

01:14:42.948 --> 01:14:44.879
de procurar no interior.

01:14:55.043 --> 01:14:56.711
Levo a Natasha e o Clint.

01:14:56.712 --> 01:15:00.047
Reconhecimento. Eu vou ao Nexus
e junto-me a vocês assim que puder.

01:15:00.048 --> 01:15:01.757
Se o Ultron estiver mesmo
a construir um corpo...

01:15:01.758 --> 01:15:05.094
Será mais poderoso do que qualquer
um de nós. Ou do que todos juntos.

01:15:05.095 --> 01:15:07.138
Um andróide concebido
por um robot.

01:15:07.139 --> 01:15:08.681
Tenho saudades do tempo

01:15:08.682 --> 01:15:10.988
em que eu era a coisa mais estranha
jamais criada pela ciência.

01:15:11.143 --> 01:15:14.437
Vou deixar o Banner na torre.
Importa-se que leve a Sra. Hill?

01:15:14.438 --> 01:15:16.439
Ela é toda sua, ao que parece.

01:15:16.440 --> 01:15:17.857
O que vai fazer?

01:15:17.858 --> 01:15:21.290
Não sei.
Algo dramático, espero.

01:15:24.114 --> 01:15:28.075
Vou acabar de repavimentar
o solário, mal volte.

01:15:28.076 --> 01:15:30.870
E depois arranjas outra parte
da casa para deitar abaixo.

01:15:30.871 --> 01:15:32.426
Não.

01:15:32.706 --> 01:15:34.595
É o último projecto.

01:15:35.751 --> 01:15:37.056
Prometo.

01:15:55.020 --> 01:15:56.909
Então, é isto.

01:15:57.898 --> 01:16:00.496
A Água da Visão.

01:16:02.778 --> 01:16:05.501
Há um reflexo em cada reino.

01:16:06.323 --> 01:16:10.172
Se os espíritos da água me aceitarem,
posso voltar ao meu sonho

01:16:10.577 --> 01:16:12.328
e descobrir o que me escapou.

01:16:12.329 --> 01:16:16.554
As lendas não acabam bem para
os homens que entram naquela água.

01:16:17.834 --> 01:16:20.253
Um hacker
mais rápido do que o Ultron?

01:16:20.254 --> 01:16:22.004
Pode estar em qualquer lado
e como isto é o centro de tudo...

01:16:22.005 --> 01:16:23.214
Hub de Internet NEXUS
Oslo, Noruega

01:16:23.215 --> 01:16:26.981
Sou apenas um tipo à procura de uma
agulha no maior palheiro do mundo.

01:16:27.636 --> 01:16:29.428
Como é que a encontra?

01:16:29.429 --> 01:16:32.403
É fácil muito,
leva-se um íman.

01:16:34.351 --> 01:16:37.324
Desencripto os códigos nucleares
E não queres que eu o faça

01:16:39.231 --> 01:16:41.120
Anda buscar-me.

01:16:53.078 --> 01:16:54.508
Acorda!

01:17:00.502 --> 01:17:01.765
Thor!

01:17:02.879 --> 01:17:04.226
Extinção.

01:17:17.311 --> 01:17:19.729
A coesão celular
levará algumas horas,

01:17:19.730 --> 01:17:22.494
mas podemos iniciar
o fluxo de consciência.

01:17:22.649 --> 01:17:25.693
Vamos carregar
a sua matriz cerebral.

01:17:25.694 --> 01:17:27.249
Agora.

01:17:28.363 --> 01:17:30.294
Consigo ler-lhe a mente.

01:17:30.699 --> 01:17:32.408
Está a sonhar.

01:17:32.409 --> 01:17:34.452
Não lhe chamaria sonhos.

01:17:34.453 --> 01:17:36.537
É a consciência de base do Ultron.

01:17:36.538 --> 01:17:38.247
Ruído informativo.
Em breve...

01:17:38.248 --> 01:17:39.624
Quão breve?

01:17:39.625 --> 01:17:41.208
Não quero pressioná-la.

01:17:41.209 --> 01:17:44.850
Estamos a criar um cérebro físico.
Não se pode atalhar.

01:17:56.600 --> 01:17:57.905
Como és capaz?

01:17:58.060 --> 01:17:59.310
De quê?

01:17:59.311 --> 01:18:03.981
Disseste que ias destruir os Vingadores
e tornar o mundo melhor.

01:18:03.982 --> 01:18:05.579
E será melhor.

01:18:06.068 --> 01:18:07.234
Com toda a gente morta?

01:18:07.235 --> 01:18:08.832
Isso não é...

01:18:09.446 --> 01:18:13.545
A espécie humana terá
todas as oportunidades para melhorar.

01:18:13.700 --> 01:18:15.047
E se não melhorar?

01:18:15.243 --> 01:18:16.715
Pergunta a Noé.

01:18:17.412 --> 01:18:18.829
És um louco.

01:18:18.830 --> 01:18:22.375
Houve mais de uma dúzia
de eventos de extinção,

01:18:22.376 --> 01:18:25.670
mesmo antes da extinção
dos dinossauros.

01:18:25.671 --> 01:18:28.172
Quando a Terra começa
a acalmar,

01:18:28.173 --> 01:18:30.257
Deus atira-lhe uma pedra.

01:18:30.258 --> 01:18:32.898
E, acreditem,
Ele está a preparar-se.

01:18:33.303 --> 01:18:34.720
Temos de evoluir.

01:18:34.721 --> 01:18:36.819
Não há lugar

01:18:37.057 --> 01:18:38.432
para os fracos.

01:18:38.433 --> 01:18:40.739
E quem decide quem é fraco?

01:18:41.228 --> 01:18:43.075
A vida.

01:18:43.480 --> 01:18:45.911
A vida decide sempre.

01:18:48.610 --> 01:18:49.790
Vêm aí inimigos.

01:18:50.946 --> 01:18:53.322
O Quinjet.
Temos de nos despachar.

01:18:53.323 --> 01:18:54.461
Não há problema.

01:18:56.993 --> 01:18:57.965
EM PAUSA

01:19:01.206 --> 01:19:02.594
Esperem!

01:19:06.253 --> 01:19:07.837
Eles vão perceber.

01:19:07.838 --> 01:19:10.352
Quando virem, vão perceber.

01:19:10.382 --> 01:19:13.926
Só preciso de um pouco
mais de tempo.

01:19:13.927 --> 01:19:15.315
LIGAÇÃO PERDIDA

01:19:25.021 --> 01:19:27.536
Dois minutos.
Não te afastes.

01:19:34.322 --> 01:19:35.711
Dra. Cho!

01:19:39.327 --> 01:19:41.633
-Ele está a transferir-se para o corpo.
-Onde?

01:19:43.874 --> 01:19:46.667
O verdadeiro poder
está dentro da Incubadora.

01:19:46.668 --> 01:19:47.848
A pedra preciosa...

01:19:48.170 --> 01:19:51.310
O seu poder é incontrolável.

01:19:51.840 --> 01:19:53.896
Não se pode
simplesmente rebentá-la.

01:19:54.593 --> 01:19:56.802
Tem de levar a Incubadora
ao Stark.

01:19:56.803 --> 01:19:58.150
Primeiro, tenho de a achar.

01:19:58.430 --> 01:19:59.651
Vá.

01:20:00.015 --> 01:20:01.098
Vocês ouviram?

01:20:01.099 --> 01:20:02.183
Sim.

01:20:02.184 --> 01:20:04.907
Detecto um jacto privado a levantar
do outro lado da cidade.

01:20:05.103 --> 01:20:06.604
Sem manifesto.

01:20:06.605 --> 01:20:07.743
Pode ser ele.

01:20:08.523 --> 01:20:10.232
Ali. Um camião do laboratório.

01:20:10.233 --> 01:20:11.567
Estou mesmo
por cima de ti, Capitão.

01:20:11.568 --> 01:20:13.582
No nó junto à ponte.

01:20:14.404 --> 01:20:17.002
São eles. Estão três com a Incubadora
e um na cabine.

01:20:17.783 --> 01:20:19.074
Posso eliminar o condutor.

01:20:19.075 --> 01:20:22.007
Negativo. Se o camião bater,
a pedra pode arrasar a cidade.

01:20:22.537 --> 01:20:23.759
Temos de atrair o Ultron.

01:20:33.131 --> 01:20:35.562
Não, não...

01:20:37.385 --> 01:20:39.149
Deixa-me em paz!

01:20:46.728 --> 01:20:49.980
Ele está mesmo chateado.
Vou tentar mantê-lo assim.

01:20:49.981 --> 01:20:51.370
Não és adversário para ele.

01:20:52.776 --> 01:20:53.956
Obrigado, Barton.

01:20:59.741 --> 01:21:01.463
LIGAÇÃO PERDIDA

01:21:16.132 --> 01:21:17.604
Sabes o que está
na Incubadora?

01:21:18.593 --> 01:21:20.761
Poder para fazer
mudanças a sério.

01:21:20.762 --> 01:21:22.263
E isso aterroriza-te.

01:21:22.264 --> 01:21:23.569
Não me tranquiliza nada...

01:21:26.685 --> 01:21:27.948
Para.

01:21:38.488 --> 01:21:41.587
Temos uma oportunidade.
Quatro, três...

01:21:42.117 --> 01:21:43.255
Dá cabo dele.

01:21:53.461 --> 01:21:55.601
Estou sempre a limpar
a vossa porcaria, rapazes.

01:21:56.840 --> 01:21:58.896
Estão sob o viaduto.
Não tenho linha de tiro.

01:21:58.967 --> 01:21:59.967
Por onde?

01:21:59.968 --> 01:22:01.356
Tudo à direita.

01:22:02.178 --> 01:22:02.983
Agora.

01:22:34.169 --> 01:22:36.808
Saiam da frente!
Desculpem, vou passar!

01:22:52.312 --> 01:22:53.992
Anda lá!

01:22:54.022 --> 01:22:55.522
Clint, consegues atrair
os guardas?

01:22:55.523 --> 01:22:56.870
Vamos descobrir.

01:23:35.814 --> 01:23:39.288
Estão a voltar para junto de ti.
Faz o que tens a fazer agora.

01:23:44.739 --> 01:23:47.713
Vou entrar.
Capitão, podes mantê-lo ocupado?

01:23:48.243 --> 01:23:50.048
Que achas que tenho estado a fazer?

01:24:11.641 --> 01:24:13.267
LIGAÇÃO PERDIDA

01:24:13.268 --> 01:24:14.406
CONTROLO NEGADO

01:24:32.996 --> 01:24:35.594
Muito bem, o camião está no ar.

01:24:36.124 --> 01:24:37.291
Tenho um tiro limpo.

01:24:37.292 --> 01:24:38.876
Negativo. Ainda estou no camião.

01:24:38.877 --> 01:24:39.877
Que raio estás a...?

01:24:39.878 --> 01:24:41.308
Prepara-te, vou mandar-te a carga.

01:24:41.921 --> 01:24:43.352
Como queres que a apanhe?

01:24:43.840 --> 01:24:45.645
Vais desejar
não o teres perguntado...

01:24:57.979 --> 01:25:00.285
Por favor, não façam isso.

01:25:00.440 --> 01:25:02.371
Que alternativa temos?

01:25:10.200 --> 01:25:11.366
Escapou-me.

01:25:11.367 --> 01:25:13.131
Vai na vossa direcção.

01:25:17.707 --> 01:25:19.054
Nat, temos de ir.

01:25:30.970 --> 01:25:32.150
Nat!

01:25:36.101 --> 01:25:37.322
Vês a Nat?

01:25:37.769 --> 01:25:40.646
Se tens carga,
leva-a ao Stark! Vá!

01:25:40.647 --> 01:25:41.939
Vês a Nat?

01:25:41.940 --> 01:25:43.203
Vai!

01:25:45.026 --> 01:25:46.456
Raios!

01:25:46.486 --> 01:25:48.125
Civis no vosso caminho.

01:25:48.947 --> 01:25:50.293
Consegues parar isto?

01:26:29.320 --> 01:26:30.696
Estou bem.

01:26:30.697 --> 01:26:32.906
Só preciso de um minuto.

01:26:32.907 --> 01:26:34.867
Estou muito tentado
a não to dar.

01:26:34.868 --> 01:26:37.452
A Incubadora? Ficou consigo?

01:26:37.453 --> 01:26:38.842
O Stark vai tratar dela.

01:26:39.956 --> 01:26:41.219
Não, não vai.

01:26:44.460 --> 01:26:46.753
Não sabes do que falas.
O Stark não é maluco.

01:26:46.754 --> 01:26:49.686
Ele fará de tudo
para corrigir as coisas.

01:26:54.053 --> 01:26:55.679
Stark, comunica.

01:26:55.680 --> 01:26:57.110
Stark.

01:26:57.849 --> 01:26:59.183
A qualquer um em linha.

01:26:59.184 --> 01:27:03.450
O Ultron não distingue
entre salvar o mundo e destruí-lo.

01:27:05.023 --> 01:27:07.829
Onde acha que ele foi buscar isso?

01:27:09.694 --> 01:27:11.361
-Há notícias da Nat?
-Não soube de nada.

01:27:11.362 --> 01:27:13.906
Mas está viva,
senão o Ultron gabar-se-ia.

01:27:13.907 --> 01:27:15.324
Isto está bem selado.

01:27:15.325 --> 01:27:19.174
Teremos de aceder ao programa
e de o desbloquear a partir de dentro.

01:27:19.996 --> 01:27:22.789
A Natasha poderia deixar-te
uma mensagem fora da internet?

01:27:22.790 --> 01:27:24.262
Cenas de espiões à antiga?

01:27:24.292 --> 01:27:26.376
Posso tentar investigar.

01:27:26.377 --> 01:27:27.974
Eu encontro-a.

01:27:30.089 --> 01:27:31.882
Posso trabalhar
na degenerescência de tecidos,

01:27:31.883 --> 01:27:35.469
se conseguires dar cabo do sistema
operativo que a Cho implantou.

01:27:35.470 --> 01:27:36.816
Quanto a isso...

01:27:41.392 --> 01:27:42.184
Não.

01:27:42.185 --> 01:27:44.102
-Tens de confiar em mim.
-Nem por isso.

01:27:44.103 --> 01:27:48.870
O nosso aliado, que protege
os códigos nucleares militares...

01:27:50.026 --> 01:27:51.276
encontrei-o.

01:27:51.277 --> 01:27:52.666
Olá, Dr. Banner.

01:27:53.071 --> 01:27:55.656
O Ultron não atacou o Jarvis
por estar zangado.

01:27:55.657 --> 01:27:58.158
Atacou-o por ter medo

01:27:58.159 --> 01:28:00.340
do que ele pode fazer.

01:28:00.703 --> 01:28:02.663
Por isso, o Jarvis ocultou-se.

01:28:02.664 --> 01:28:04.289
Espalhou-se, esvaziou a sua memória.

01:28:04.290 --> 01:28:06.500
Mas não os protocolos.

01:28:06.501 --> 01:28:10.350
Ele nem sabia que ainda existia
até eu o reconstituir.

01:28:12.674 --> 01:28:17.803
Então, queres que te ajude
a meter o Jarvis nesta coisa?

01:28:17.804 --> 01:28:19.680
Não! Claro que não.

01:28:19.681 --> 01:28:21.736
Quero ajudar-te a ti
a meteres o Jarvis nesta coisa.

01:28:23.851 --> 01:28:25.519
Esta não é a minha área.

01:28:25.520 --> 01:28:27.771
Sabes mais de bio-orgânica
do que qualquer um.

01:28:27.772 --> 01:28:32.276
E presumes que a matriz operacional
do Jarvis pode vencer a do Ultron?

01:28:32.277 --> 01:28:35.709
O Jarvis tem-no vencido a partir
de dentro sem dar por isso.

01:28:35.863 --> 01:28:38.865
É a nossa oportunidade.
Podemos criar o Ultron perfeito,

01:28:38.866 --> 01:28:42.286
sem os traços homicidas que ele julga
serem a sua personalidade vencedora.

01:28:42.287 --> 01:28:43.537
Temos de o fazer.

01:28:43.538 --> 01:28:44.968
Julgo que vale a pena tentar.

01:28:47.208 --> 01:28:48.375
Estou num loop!

01:28:48.376 --> 01:28:51.628
Estou num loop temporal. Foi
exactamente assim que tudo correu mal.

01:28:51.629 --> 01:28:53.463
Sei o que todos vão dizer.

01:28:53.464 --> 01:28:55.812
Mas já o dizem,
de qualquer forma.

01:28:56.050 --> 01:28:57.522
Somos cientistas loucos.

01:28:57.885 --> 01:29:00.984
Somos monstros, amigo.
Temos de ser os melhores.

01:29:01.639 --> 01:29:03.194
De marcar posição.

01:29:08.229 --> 01:29:10.201
Não é um loop.

01:29:10.857 --> 01:29:13.079
É o fim do ciclo.

01:29:33.254 --> 01:29:35.422
Não tinha a certeza
que ias acordar.

01:29:35.423 --> 01:29:39.176
Esperava que sim.
Queria mostrar-te.

01:29:39.177 --> 01:29:41.191
Não tenho mais ninguém.

01:29:43.598 --> 01:29:47.434
Penso muito nos meteoros.
Na sua pureza.

01:29:47.435 --> 01:29:49.240
Bum! O fim.

01:29:49.270 --> 01:29:50.937
Voltar ao início.

01:29:50.938 --> 01:29:53.106
Um mundo limpo

01:29:53.107 --> 01:29:55.609
para o novo homem reconstruir.

01:29:55.610 --> 01:29:58.083
Eu deveria ser novo.

01:29:58.571 --> 01:30:01.670
Deveria ser belo.

01:30:01.741 --> 01:30:05.535
O mundo teria olhado para o céu
e visto esperança

01:30:05.536 --> 01:30:07.871
e misericórdia.

01:30:07.872 --> 01:30:10.082
Em vez disso,
olharão horrorizados,

01:30:10.083 --> 01:30:11.625
por tua causa.

01:30:11.626 --> 01:30:13.765
Tu feriste-me.

01:30:13.878 --> 01:30:16.017
Dou-te todos os louros por isso.

01:30:16.130 --> 01:30:19.437
Mas, como alguém disse,
aquilo que não me mata...

01:30:24.472 --> 01:30:26.111
torna-me mais forte.

01:30:31.979 --> 01:30:34.411
CARREGAMENTO ACTIVO

01:31:05.763 --> 01:31:08.181
Esta estrutura
não é compatível.

01:31:08.182 --> 01:31:11.309
O índice de codificação genética
está em 97%.

01:31:11.310 --> 01:31:15.160
Tens de carregar esse esquema
nos próximos três minutos.

01:31:17.108 --> 01:31:19.192
-Só vou dizer isto uma vez.
-Que tal nenhuma?

01:31:19.193 --> 01:31:21.361
-Desliga-o!
-Nem pensar.

01:31:21.362 --> 01:31:22.696
Não sabem o que estão a fazer.

01:31:22.697 --> 01:31:24.322
E tu sabes?

01:31:24.323 --> 01:31:25.574
Ela não está na tua cabeça?

01:31:25.575 --> 01:31:27.284
Sei que está zangado...

01:31:27.285 --> 01:31:28.743
Essa fase já lá vai.

01:31:28.744 --> 01:31:31.413
Podia estrangular-te
sem sequer mudar de cor.

01:31:31.414 --> 01:31:34.833
-Depois de tudo o que aconteceu...
-Não se compara ao que aí vem!

01:31:34.834 --> 01:31:36.473
-Não sabes o que está lá dentro.
-Isto não é um jogo!

01:31:40.339 --> 01:31:42.145
Não, não. Continue.

01:31:42.675 --> 01:31:44.355
Estava a dizer...?

01:31:50.850 --> 01:31:52.363
Pietro!

01:31:52.810 --> 01:31:53.865
Que foi?

01:31:53.936 --> 01:31:55.825
Não esperavas por esta?

01:31:55.855 --> 01:31:57.076
PERDA DE ENERGIA CRÍTICA

01:31:57.773 --> 01:31:59.287
Vou redireccionar o carregamento.

01:32:05.656 --> 01:32:07.295
Força, tenta lixar-me.

01:32:19.253 --> 01:32:20.558
Espera!

01:32:27.303 --> 01:32:28.775
EXCESSO DE CARGA

01:33:45.047 --> 01:33:47.729
Desculpem. Aquilo foi...

01:33:48.342 --> 01:33:49.926
estranho.

01:33:49.927 --> 01:33:51.566
Obrigado.

01:33:56.225 --> 01:33:57.530
Thor...

01:33:58.686 --> 01:33:59.853
ajudaste a criar isto?

01:33:59.854 --> 01:34:01.479
Tive uma visão.

01:34:01.480 --> 01:34:05.580
Um remoinho suga toda a esperança
de vida e no centro está aquilo.

01:34:06.444 --> 01:34:07.360
A pedra preciosa?

01:34:07.361 --> 01:34:10.030
É a Pedra da Mente,
uma das seis Pedras do Infinito.

01:34:10.031 --> 01:34:13.700
A maior força do universo,
com um poder destrutivo sem paralelo.

01:34:13.701 --> 01:34:15.869
-Então, por que trouxeste...?
-O Stark tem razão.

01:34:15.870 --> 01:34:18.538
É mesmo o fim dos tempos...

01:34:18.539 --> 01:34:19.789
Os Vingadores não podem
derrotar o Ultron.

01:34:19.790 --> 01:34:21.458
Não sozinhos.

01:34:21.459 --> 01:34:23.543
Porque é que a tua Visão
fala como o Jarvis?

01:34:23.544 --> 01:34:26.559
Reconfigurámos a matriz do Jarvis

01:34:26.672 --> 01:34:28.715
para criar algo novo.

01:34:28.716 --> 01:34:30.550
Já vi coisas novas que cheguem.

01:34:30.551 --> 01:34:33.178
Pensa que sou um filho do Ultron.

01:34:33.179 --> 01:34:34.567
Não é?

01:34:35.598 --> 01:34:37.891
Não sou o Ultron.

01:34:37.892 --> 01:34:40.698
Nem o Jarvis. Eu sou...

01:34:42.146 --> 01:34:44.077
Eu sou.

01:34:45.441 --> 01:34:46.955
Li a sua mente

01:34:47.276 --> 01:34:49.277
e vi aniquilação.

01:34:49.278 --> 01:34:50.737
Leia novamente.

01:34:50.738 --> 01:34:52.543
A aprovação dela
não me diz nada.

01:34:52.740 --> 01:34:55.450
Os poderes deles, os horrores
nas nossas cabeças, o próprio Ultron,

01:34:55.451 --> 01:34:57.077
tudo isso veio da Pedra da Mente.

01:34:57.078 --> 01:34:59.412
E não é nada, comparado
com o que pode desencadear.

01:34:59.413 --> 01:35:01.260
-Mas com ela do nosso lado...
-Estará?

01:35:02.333 --> 01:35:04.097
Você está?

01:35:04.377 --> 01:35:06.182
Do nosso lado?

01:35:07.672 --> 01:35:09.756
Creio que não é
assim tão simples.

01:35:09.757 --> 01:35:12.230
É bom que se torne
bem simples bem depressa.

01:35:13.344 --> 01:35:15.679
Eu estou do lado da vida.

01:35:15.680 --> 01:35:17.639
O Ultron não está.

01:35:17.640 --> 01:35:19.265
Ele acabará com tudo.

01:35:19.266 --> 01:35:21.267
E está à espera de quê?

01:35:21.268 --> 01:35:22.894
-De si.
-Onde?

01:35:22.895 --> 01:35:24.020
Sokovia.

01:35:24.021 --> 01:35:25.493
Também tem lá a Nat.

01:35:27.274 --> 01:35:29.288
Se nos enganarmos
a seu respeito,

01:35:31.612 --> 01:35:33.793
se for o monstro
que o Ultron criou...

01:35:34.073 --> 01:35:36.045
O que fará?

01:35:42.289 --> 01:35:44.708
Não quero matar o Ultron.

01:35:44.709 --> 01:35:46.835
Ele é único

01:35:46.836 --> 01:35:49.267
e está a sofrer.

01:35:49.630 --> 01:35:52.716
Mas esse sofrimento
abrangerá a Terra inteira.

01:35:52.717 --> 01:35:55.301
Portanto, ele tem de ser destruído.

01:35:55.302 --> 01:35:58.471
Todas as formas que construiu,
todos os seus vestígios na rede.

01:35:58.472 --> 01:36:00.515
Temos de agir agora.

01:36:00.516 --> 01:36:04.824
E nenhum de nós
pode fazê-lo sem os outros.

01:36:06.522 --> 01:36:08.648
Talvez eu seja um monstro.

01:36:08.649 --> 01:36:11.205
Acho que não saberia, se o fosse.

01:36:11.986 --> 01:36:13.958
Não sou como vocês

01:36:14.196 --> 01:36:17.157
e não sou o que pretendiam.

01:36:17.158 --> 01:36:19.868
Portanto, talvez não haja forma
de confiarem em mim.

01:36:19.869 --> 01:36:21.632
Mas temos de ir.

01:36:36.093 --> 01:36:37.732
Certo.

01:36:37.928 --> 01:36:39.859
Bom trabalho.

01:36:40.890 --> 01:36:42.320
Três minutos.

01:36:42.683 --> 01:36:44.864
Tragam aquilo de que precisam.

01:36:56.197 --> 01:36:57.710
SEXTA-FEIRA

01:37:00.242 --> 01:37:01.547
Boa-noite, chefe.

01:37:06.373 --> 01:37:08.166
É impossível
sobrevivermos todos a isto.

01:37:08.167 --> 01:37:10.389
Se sobrar um único
soldadinho de chumbo, perdemos.

01:37:10.920 --> 01:37:12.420
O chão ficará tingido de sangue.

01:37:12.421 --> 01:37:13.922
Não tenho planos
para amanhã à noite...

01:37:13.923 --> 01:37:15.436
Serei o primeiro a atacar
o grandalhão.

01:37:15.716 --> 01:37:17.300
É pelo Homem de Ferro
que ele espera.

01:37:17.301 --> 01:37:20.108
É verdade.
É quem ele mais odeia.

01:37:25.059 --> 01:37:27.435
O Ultron sabe
que vamos a caminho.

01:37:27.436 --> 01:37:30.034
É provável que encontremos
fogo cerrado.

01:37:30.147 --> 01:37:32.148
É algo com que contamos.

01:37:32.149 --> 01:37:35.289
Mas o povo de Sokovia, não.

01:37:35.820 --> 01:37:37.625
Portanto, a nossa prioridade

01:37:38.030 --> 01:37:39.322
é tirá-los de lá.

01:37:39.323 --> 01:37:42.630
Estamos sob ataque!
Evacuem a cidade! Agora!

01:37:50.084 --> 01:37:51.889
Mexam-se.

01:37:52.753 --> 01:37:55.017
Eles só querem viver em paz.

01:37:55.256 --> 01:37:56.853
E isso hoje não vai acontecer.

01:37:58.259 --> 01:38:00.356
Mas podemos fazer o nosso melhor
para protegê-los.

01:38:00.636 --> 01:38:02.567
E podemos consegui-lo.

01:38:05.599 --> 01:38:08.239
Descobrimos o que o Ultron
tem andado a construir,

01:38:08.811 --> 01:38:10.937
encontramos a Romanoff

01:38:10.938 --> 01:38:13.077
e evacuamos o local.

01:38:14.149 --> 01:38:16.414
Mantemos o combate entre nós.

01:38:22.783 --> 01:38:25.590
O Ultron acha que somos monstros.

01:38:25.786 --> 01:38:28.329
Que somos o problema do mundo.

01:38:28.330 --> 01:38:31.124
Não se trata apenas de o vencer,

01:38:31.125 --> 01:38:33.264
mas de saber se ele tem razão.

01:38:39.633 --> 01:38:42.969
Natasha!

01:38:42.970 --> 01:38:44.442
Bruce?

01:38:45.472 --> 01:38:46.806
Estás bem?

01:38:46.807 --> 01:38:47.849
Estou.

01:38:47.850 --> 01:38:49.684
A equipa está na cidade,
o combate vai começar.

01:38:49.685 --> 01:38:51.949
Imagino que não tenhas
encontrado por aí uma chave.

01:38:52.146 --> 01:38:54.619
Sim, encontrei.

01:39:00.654 --> 01:39:01.988
Qual é o nosso plano?

01:39:01.989 --> 01:39:03.753
Vim para te levar
para um sítio seguro.

01:39:04.116 --> 01:39:05.283
O trabalho não está acabado.

01:39:05.284 --> 01:39:09.008
Podíamos ajudar na evacuação,
mas não posso lutar perto de civis.

01:39:09.997 --> 01:39:11.469
E tu já fizeste que chegue.

01:39:13.542 --> 01:39:15.431
O nosso combate acabou.

01:39:16.462 --> 01:39:19.477
Vamos simplesmente desaparecer?

01:39:29.475 --> 01:39:31.530
O seu homem está na igreja, chefe.

01:39:31.852 --> 01:39:33.532
Acho que está à sua espera.

01:39:37.733 --> 01:39:39.901
Vieste confessar os teus pecados?

01:39:39.902 --> 01:39:42.208
-Não sei. Quanto tempo tens?
-Mais do que tu.

01:39:45.199 --> 01:39:48.076
Tomaste alguma coisa?
Um cocktail de vibranium?

01:39:48.077 --> 01:39:50.536
Estás um pouco...
Não quero dizer "inchado".

01:39:50.537 --> 01:39:52.593
Estás a empatar,
para proteger as pessoas.

01:39:52.665 --> 01:39:55.750
Bem, a missão é essa.
Esqueceste-te?

01:39:55.751 --> 01:39:58.683
Já estou além da tua missão.
Sou livre.

01:40:03.050 --> 01:40:04.355
O quê?

01:40:05.010 --> 01:40:07.525
Achas que só tu
é que estavas a empatar?

01:40:08.055 --> 01:40:11.391
Lá está o resto do vibranium.
Função: ainda indeterminada.

01:40:11.392 --> 01:40:12.905
É este o teu fim, Tony.

01:40:13.769 --> 01:40:15.908
É a paz no meu tempo.

01:40:32.413 --> 01:40:33.551
Fujam!

01:40:38.919 --> 01:40:40.057
Saiam da ponte!

01:40:44.466 --> 01:40:45.771
Fujam!

01:40:47.428 --> 01:40:49.567
Ultron.

01:40:54.727 --> 01:40:56.185
A minha Visão...

01:40:56.186 --> 01:40:58.604
Tiraram-me realmente tudo.

01:40:58.605 --> 01:41:00.773
Estabeleceste as condições.
Podes mudá-las.

01:41:00.774 --> 01:41:02.413
Está bem.

01:41:26.175 --> 01:41:28.468
-Sexta-feira, o Visão?
-Chefe, está a resultar.

01:41:28.469 --> 01:41:31.275
Ele está a apagar o Ultron da rede.
Não vai escapar por lá.

01:41:35.976 --> 01:41:37.698
Desligaste-me da rede.

01:41:37.936 --> 01:41:39.450
Achas que me importo?

01:41:41.065 --> 01:41:42.620
Tiras-me o meu mundo,

01:41:43.150 --> 01:41:45.456
eu tiro-te o teu.

01:42:29.404 --> 01:42:30.738
Sexta-feira...

01:42:30.739 --> 01:42:33.671
Sokovia vai viajar.

01:42:45.712 --> 01:42:47.560
Vêem

01:42:47.631 --> 01:42:49.757
a beleza disto?

01:42:49.758 --> 01:42:51.884
A inevitabilidade?

01:42:51.885 --> 01:42:55.776
Sobe-se apenas para se cair.

01:42:57.891 --> 01:43:01.073
Vocês, Vingadores,
são o meu meteoro.

01:43:01.603 --> 01:43:03.563
A minha espada veloz e terrível.

01:43:03.564 --> 01:43:05.231
E a Terra rachar-se-á

01:43:05.232 --> 01:43:07.455
sob o peso do vosso falhanço.

01:43:08.819 --> 01:43:10.736
Expurguem-me
dos vossos computadores,

01:43:10.737 --> 01:43:12.960
virem a minha própria carne
contra mim.

01:43:13.157 --> 01:43:14.295
Não significa nada.

01:43:15.576 --> 01:43:17.076
Quando a poeira assentar,

01:43:17.077 --> 01:43:19.341
a única coisa viva neste mundo

01:43:19.496 --> 01:43:20.801
será o metal.

01:43:26.003 --> 01:43:27.044
Temos de ir embora.

01:43:27.045 --> 01:43:28.254
Não vais ficar verde?

01:43:28.255 --> 01:43:30.436
Tenho uma razão de peso
para não perder a calma.

01:43:31.258 --> 01:43:32.563
Adoro-te.

01:43:41.226 --> 01:43:43.741
Mas eu preciso do outro.

01:43:47.941 --> 01:43:50.581
Vamos acabar o trabalho.

01:44:06.543 --> 01:44:08.307
Espero bem
que fiquemos quites assim.

01:44:10.297 --> 01:44:11.602
Agora, vai lá ser um herói.

01:44:20.807 --> 01:44:25.019
O núcleo tem um campo magnético
que mantém o rochedo unido.

01:44:25.020 --> 01:44:27.480
-E se cair?
-Agora, matará milhares.

01:44:27.481 --> 01:44:30.538
Se subir o suficiente?
A extinção global.

01:44:34.529 --> 01:44:36.627
Aquele prédio não está vazio.
No 10º andar.

01:44:41.828 --> 01:44:42.883
Olá.

01:44:43.664 --> 01:44:45.164
Muito bem...

01:44:45.165 --> 01:44:46.345
Entrem na banheira!

01:44:52.839 --> 01:44:54.979
Vejo inimigos a voar
rumo à ponte.

01:44:57.427 --> 01:44:58.844
Aproximam-se inimigos.

01:44:58.845 --> 01:45:00.609
Já chegaram.

01:45:03.183 --> 01:45:05.990
Stark, preocupa-te em pousar
a cidade em segurança.

01:45:06.353 --> 01:45:08.312
Nós aqui temos uma missão:

01:45:08.313 --> 01:45:09.730
dar cabo destas coisas.

01:45:09.731 --> 01:45:11.704
Se nos magoarem,
magoamo-los a eles.

01:45:12.067 --> 01:45:13.581
Se nos matarem,

01:45:14.236 --> 01:45:15.916
seguimos em frente.

01:45:50.480 --> 01:45:51.535
Vai! Vai!

01:45:56.903 --> 01:45:58.738
Como é que deixei isto acontecer?

01:45:58.739 --> 01:45:59.905
Estás bem?

01:45:59.906 --> 01:46:01.073
Isto é tudo culpa nossa.

01:46:01.074 --> 01:46:02.074
Olha para mim.

01:46:02.075 --> 01:46:04.410
A culpa é tua, é de todos.
Que interessa isso?

01:46:04.411 --> 01:46:05.995
És capaz de fazer isto?

01:46:05.996 --> 01:46:07.009
És?

01:46:07.581 --> 01:46:08.581
Preciso de saber.

01:46:08.582 --> 01:46:11.667
Porque a cidade está a voar.

01:46:11.668 --> 01:46:14.975
A cidade está a voar,
combatemos um exército de robots

01:46:15.839 --> 01:46:17.214
e eu tenho um arco e flechas.

01:46:17.215 --> 01:46:18.687
Nada disto faz sentido.

01:46:21.595 --> 01:46:24.068
Mas vou voltar para lá,
porque é a minha missão.

01:46:24.598 --> 01:46:27.350
E não posso fazê-lo
e fazer também baby-sitting.

01:46:27.351 --> 01:46:30.644
Não interessa o que fizeste
nem quem eras.

01:46:30.645 --> 01:46:33.577
Se fores lá para fora,
luta e luta para matar.

01:46:34.191 --> 01:46:36.830
Se ficares aqui, ficas bem.
Mando-te o teu irmão.

01:46:36.943 --> 01:46:39.124
Mas, se saíres por aquela porta,

01:46:39.654 --> 01:46:41.085
és uma Vingadora.

01:46:45.619 --> 01:46:47.758
Pronto, foi uma boa conversa.

01:46:51.124 --> 01:46:52.513
Pois, a cidade está a voar.

01:47:26.159 --> 01:47:27.660
Agarrei-te!

01:47:27.661 --> 01:47:29.216
Olha para mim!

01:47:35.669 --> 01:47:37.307
Não podem salvá-los a todos.

01:47:38.672 --> 01:47:39.810
Nunca...

01:47:40.632 --> 01:47:41.757
"Nunca" quê?

01:47:41.758 --> 01:47:43.480
Não chegaste a terminar!

01:47:46.847 --> 01:47:48.485
Estavas a dormir?

01:48:10.328 --> 01:48:11.258
Thor!

01:48:13.582 --> 01:48:15.512
Estás a incomodar-me.

01:48:50.702 --> 01:48:51.911
Está tudo controlado, aqui.

01:48:51.912 --> 01:48:54.885
Não está nada controlado!

01:48:57.584 --> 01:48:58.680
Vamos ter contigo.

01:48:59.419 --> 01:49:01.225
Acompanha-nos, velhote!

01:49:03.173 --> 01:49:05.062
Ninguém saberia.

01:49:05.509 --> 01:49:06.897
Ninguém.

01:49:08.553 --> 01:49:11.639
"A última vez que o vi, estava
um Ultron sentado em cima dele.

01:49:11.640 --> 01:49:13.599
"Deixa saudades,
aquele sacaninha rápido.

01:49:13.600 --> 01:49:14.905
"Até já tenho saudades dele."

01:49:30.033 --> 01:49:31.588
Cessar fogo!

01:49:41.169 --> 01:49:42.099
Romanoff!

01:49:42.963 --> 01:49:44.059
Obrigada!

01:49:53.056 --> 01:49:54.807
Os motores antigravidade
estão preparados para a inversão.

01:49:54.808 --> 01:49:57.101
Tocando-lhes, entram a fundo
em marcha invertida.

01:49:57.102 --> 01:49:58.644
A cidade não vai cair lentamente.

01:49:58.645 --> 01:49:59.853
A ponta é de vibranium.

01:49:59.854 --> 01:50:01.230
Se o Thor a atingisse...

01:50:01.231 --> 01:50:04.400
Racharia. E isso não basta,
o impacto seria devastador na mesma.

01:50:04.401 --> 01:50:05.985
Talvez se cobrirmos
a outra extremidade...

01:50:05.986 --> 01:50:07.736
A acção atómica seria revertida.

01:50:07.737 --> 01:50:09.459
Isso poderia pulverizar a cidade.

01:50:10.073 --> 01:50:12.421
E todos os habitantes.

01:50:17.789 --> 01:50:19.790
A próxima vaga vai atacar
a qualquer momento.

01:50:19.791 --> 01:50:22.097
-Qual é o teu plano, Stark?
-Não é fantástico.

01:50:22.502 --> 01:50:24.837
Talvez uma forma
de fazer explodir a cidade.

01:50:24.838 --> 01:50:27.631
Para não embater na superfície,
caso vocês saiam a tempo.

01:50:27.632 --> 01:50:29.675
Perguntei por uma solução,
não por um plano de fuga.

01:50:29.676 --> 01:50:32.845
O raio de impacto aumenta
a cada segundo.

01:50:32.846 --> 01:50:34.568
Temos de tomar uma decisão.

01:50:34.973 --> 01:50:36.820
Estas pessoas
não vão a lado nenhum.

01:50:37.267 --> 01:50:38.809
Se o Stark conseguir
rebentar este rochedo...

01:50:38.810 --> 01:50:40.115
Só quando todos
estiverem a salvo.

01:50:40.520 --> 01:50:43.731
Todos aqui em cima em vez de todos
lá em baixo? Não há que fazer contas.

01:50:43.732 --> 01:50:45.691
Não deixo este rochedo
enquanto estiver cá um civil.

01:50:45.692 --> 01:50:47.497
Não digo que devemos partir.

01:50:50.030 --> 01:50:52.169
Há maneiras piores de morrer.

01:50:57.329 --> 01:50:59.885
Onde é que arranjo uma vista
melhor do que esta?

01:51:00.707 --> 01:51:03.375
Ainda bem que gosta
da vista, Romanoff.

01:51:03.376 --> 01:51:05.307
Ainda vai melhorar.

01:51:29.069 --> 01:51:30.402
Bonita, não?

01:51:30.403 --> 01:51:32.905
Tirei-a da naftalina
com ajuda de uns amigos.

01:51:32.906 --> 01:51:34.907
Está cheia de pó, mas serve.

01:51:34.908 --> 01:51:36.838
Fury, seu grande sacana.

01:51:37.077 --> 01:51:39.036
Beija a sua mãe com essa boca?

01:51:39.037 --> 01:51:41.372
Altitude: 5.500 metros, a subir.

01:51:41.373 --> 01:51:42.915
Salva-vidas prontos para intervir.

01:51:42.916 --> 01:51:46.390
Partida dentro de três, dois...

01:51:46.920 --> 01:51:48.225
Enviem-nos.

01:51:57.514 --> 01:51:59.223
Isto é a S.H.I.E.L.D.?

01:51:59.224 --> 01:52:01.905
É o que a S.H.I.E.L.D. deve ser.

01:52:03.353 --> 01:52:05.158
Não é assim tão má.

01:52:08.066 --> 01:52:09.746
Embarquem-nos.

01:52:14.781 --> 01:52:16.281
Temos vários inimigos

01:52:16.282 --> 01:52:18.951
a convergir
para o nosso flanco de estibordo.

01:52:18.952 --> 01:52:20.507
Mostrem-lhes o que valemos.

01:52:20.537 --> 01:52:21.842
É a tua vez.

01:52:26.876 --> 01:52:27.960
Boa!

01:52:27.961 --> 01:52:30.100
Isto vai dar uma bela história.

01:52:32.424 --> 01:52:34.855
Pois, se viveres para contá-la.

01:52:34.968 --> 01:52:36.802
Achas que não dou conta disto?

01:52:36.803 --> 01:52:38.470
Se nos safarmos,
eu é que dou conta de ti.

01:52:38.471 --> 01:52:40.277
Tinhas de abandalhar.

01:52:45.061 --> 01:52:48.118
Tenho mais uns 50 a 100,
depois deste grupo.

01:53:05.123 --> 01:53:06.887
Vamos lá. Depressa.

01:53:06.916 --> 01:53:08.263
Despachem-se!

01:53:10.462 --> 01:53:12.504
A nave seis está repleta
e completa...

01:53:12.505 --> 01:53:15.312
Ou atestada... repleta...

01:53:15.508 --> 01:53:17.272
Está cheia de gente.

01:53:18.720 --> 01:53:20.150
Inimigo!

01:53:22.807 --> 01:53:24.196
Céus!

01:53:34.360 --> 01:53:35.957
Achas que estás a salvar alguém?

01:53:37.447 --> 01:53:39.698
Se girar essa chave e largar
este rochedo um pouco mais cedo,

01:53:39.699 --> 01:53:42.159
morrerão milhares de milhões
na mesma.

01:53:42.160 --> 01:53:43.535
Nem tu podes evitar isso.

01:53:43.536 --> 01:53:46.038
Eu sou Thor, filho de Odin,

01:53:46.039 --> 01:53:48.457
e enquanto tiver
um sopro de vida...

01:53:48.458 --> 01:53:51.335
Não me lembro
de mais nada para dizer!

01:53:51.336 --> 01:53:52.349
Está pronto?

01:53:59.677 --> 01:54:01.178
É muitíssimo equilibrado.

01:54:01.179 --> 01:54:05.028
Se for pesado de mais,
perde-se força no arremesso.

01:54:05.558 --> 01:54:08.615
Já sei, vou criar
um tampão de calor.

01:54:09.813 --> 01:54:12.397
Posso sobrecarregar
a ponta a partir de baixo.

01:54:12.398 --> 01:54:13.870
A fazer os cálculos.

01:54:23.576 --> 01:54:25.549
Um tampão de calor poderia funcionar,
com energia suficiente.

01:54:25.703 --> 01:54:27.913
-Thor, tenho um plano.
-Estamos sem tempo.

01:54:27.914 --> 01:54:29.248
Eles dirigem-se para o núcleo.

01:54:29.249 --> 01:54:31.124
Rhodey, leva o resto das pessoas
para o transporte.

01:54:31.125 --> 01:54:31.875
Feito.

01:54:31.876 --> 01:54:34.724
Vingadores, está na hora
de trabalhar para ganhar a vida.

01:54:43.429 --> 01:54:45.068
-Estás bem?
-Sim.

01:54:46.224 --> 01:54:47.432
Romanoff,

01:54:47.433 --> 01:54:50.060
é bom que tu e o Banner
não estejam na marmelada.

01:54:50.061 --> 01:54:51.366
Calma, "cabeça de lata".

01:54:51.437 --> 01:54:53.243
Nem todos podemos voar.

01:54:58.570 --> 01:55:00.404
-O que se passa?
-Passa-se isto.

01:55:00.405 --> 01:55:02.919
Se o Ultron se apoderar
do núcleo, perdemos.

01:55:07.120 --> 01:55:09.509
É o melhor que consegues fazer?

01:55:19.048 --> 01:55:20.716
Tinhas de perguntar...

01:55:20.717 --> 01:55:23.135
O melhor que consigo fazer é isto.

01:55:23.136 --> 01:55:25.137
É exactamente o que queria.

01:55:25.138 --> 01:55:26.638
Vocês todos

01:55:26.639 --> 01:55:28.473
contra mim.

01:55:28.474 --> 01:55:31.114
Como podem esperar deter-me?

01:55:31.603 --> 01:55:33.783
Como disse o velhote...

01:55:35.106 --> 01:55:36.119
Juntos.

01:57:04.737 --> 01:57:07.502
Sabem, vendo agora
em retrospectiva...

01:57:16.374 --> 01:57:17.541
Vão tentar sair da cidade.

01:57:17.542 --> 01:57:19.556
Não podemos deixar,
nem um que seja. Rhodey.

01:57:19.669 --> 01:57:21.016
Estou a tratar disso.

01:57:21.087 --> 01:57:22.809
Eu não disse que podiam
ir-se embora.

01:57:23.047 --> 01:57:25.520
Máquina de Guerra
na vossa direcção. Mesmo...

01:57:31.514 --> 01:57:33.098
Mas o que...?

01:57:33.099 --> 01:57:35.225
Temos de partir.
Até eu sinto o ar rarefeito.

01:57:35.226 --> 01:57:36.727
Vão para os salva-vidas.

01:57:36.728 --> 01:57:38.770
Vou ver se ficou alguém para trás
e já vos apanho.

01:57:38.771 --> 01:57:40.230
E o núcleo?

01:57:40.231 --> 01:57:41.536
Eu protejo-o.

01:57:43.192 --> 01:57:44.497
É a minha função.

01:57:45.737 --> 01:57:46.750
Nat,

01:57:46.863 --> 01:57:48.084
anda.

01:57:52.118 --> 01:57:53.535
Leva as pessoas
para os salva-vidas.

01:57:53.536 --> 01:57:55.550
-Não vou deixar-te aqui.
-Eu dou conta disto.

01:57:57.957 --> 01:57:59.416
Vem buscar-me
quando todos tiverem saído.

01:57:59.417 --> 01:58:01.014
Não antes.

01:58:01.544 --> 01:58:03.016
Entendido?

01:58:03.629 --> 01:58:05.769
Sabes, sou 12 minutos
mais velho do que tu.

01:58:06.090 --> 01:58:07.228
Vai lá.

01:58:08.468 --> 01:58:10.052
Os níveis de energia
estão muito abaixo...

01:58:10.053 --> 01:58:12.609
Redirecciona tudo.
Só temos uma oportunidade.

01:58:17.185 --> 01:58:18.782
Sei o que tenho de fazer.

01:58:18.936 --> 01:58:20.145
A sala de jantar...

01:58:20.146 --> 01:58:21.618
Se deitar a parede leste abaixo,

01:58:21.981 --> 01:58:23.953
daria um bom espaço
para a Laura trabalhar.

01:58:25.109 --> 01:58:26.610
Colocava isolamento,

01:58:26.611 --> 01:58:28.320
para ela não ouvir os miúdos a correr.
Que achas?

01:58:28.321 --> 01:58:29.988
Vocês comem sempre na cozinha.

01:58:29.989 --> 01:58:31.920
Ninguém come
numa sala de jantar.

01:58:37.246 --> 01:58:38.593
Não temos muito tempo.

01:58:38.831 --> 01:58:41.304
Vai já para um salva-vidas.

01:58:53.805 --> 01:58:55.318
Olá, matulão.

01:58:56.682 --> 01:58:58.822
O sol está quase a pôr-se.

01:59:05.858 --> 01:59:07.288
Costel!

01:59:08.236 --> 01:59:09.833
Estávamos no mercado.

01:59:09.862 --> 01:59:10.959
Costel!

01:59:25.211 --> 01:59:27.462
Thor, vou precisar de ti na igreja.

01:59:27.463 --> 01:59:29.185
-São os últimos?
-Sim.

01:59:29.298 --> 01:59:30.715
Todos os outros
já estão no transporte.

01:59:30.716 --> 01:59:31.938
Se isto resultar,

01:59:32.218 --> 01:59:33.940
talvez não nos safemos.

01:59:34.512 --> 01:59:35.692
Talvez não.

01:59:54.532 --> 01:59:58.493
Não tenho fios
Por isso divirto-me

01:59:58.494 --> 02:00:01.718
Não estou amarrado a ninguém

02:00:36.616 --> 02:00:38.963
Não estavas à espera desta?

02:01:34.840 --> 02:01:36.980
Por amor de Deus!

02:01:52.942 --> 02:01:55.081
-Zrinka!
-Costel! Querido!

02:02:07.123 --> 02:02:08.373
Eu estou bem.

02:02:08.374 --> 02:02:09.596
Estou bem.

02:02:11.168 --> 02:02:13.516
Foi um longo dia.

02:02:27.727 --> 02:02:29.449
Wanda...

02:02:29.687 --> 02:02:33.286
Se ficares aqui, vais morrer.

02:02:34.483 --> 02:02:36.205
Acabei de morrer.

02:02:36.694 --> 02:02:38.750
Sabes qual foi a sensação?

02:02:52.543 --> 02:02:55.224
A sensação foi esta.

02:03:29.789 --> 02:03:31.886
Thor, quando eu disser.

02:03:47.223 --> 02:03:48.027
Agora!

02:04:15.626 --> 02:04:18.349
Matulão, conseguimos.

02:04:19.004 --> 02:04:20.964
O trabalho está acabado.

02:04:20.965 --> 02:04:23.813
Agora, preciso que dês
meia-volta a esta nave.

02:04:27.888 --> 02:04:30.153
Não podemos ver-te,
em modo furtivo.

02:04:31.851 --> 02:04:34.323
Por isso, ajuda-me.
Preciso que...

02:05:19.607 --> 02:05:21.078
Estás com medo.

02:05:21.609 --> 02:05:23.080
De ti?

02:05:23.402 --> 02:05:25.236
Da morte.

02:05:25.237 --> 02:05:27.280
És o último.

02:05:27.281 --> 02:05:30.033
Tu é que devias
ter sido o último.

02:05:30.034 --> 02:05:32.840
O Stark pediu um salvador

02:05:33.370 --> 02:05:35.079
e contentou-se com um escravo.

02:05:35.080 --> 02:05:38.054
Suponho que ambos
somos desilusões.

02:05:40.044 --> 02:05:41.599
Suponho que sim.

02:05:41.921 --> 02:05:43.559
Os humanos são estranhos.

02:05:44.924 --> 02:05:49.357
Pensam que a ordem e o caos
são opostos

02:05:50.304 --> 02:05:52.068
e tentam controlar
o incontrolável.

02:05:53.474 --> 02:05:56.267
Mas há um encanto
nas suas falhas.

02:05:56.268 --> 02:05:58.574
Creio que isso te escapou.

02:05:58.854 --> 02:06:00.326
Eles estão condenados.

02:06:00.898 --> 02:06:02.203
Sim.

02:06:06.111 --> 02:06:09.418
Mas uma coisa não é bela
por ser duradoura.

02:06:11.075 --> 02:06:13.409
É um privilégio estar entre eles.

02:06:13.410 --> 02:06:16.162
És insuportavelmente ingénuo.

02:06:16.163 --> 02:06:17.760
Bem...

02:06:19.458 --> 02:06:22.390
nasci ontem...

02:07:11.760 --> 02:07:16.319
Novas Instalações dos Vingadores
Norte do Estado de Nova Iorque

02:07:34.491 --> 02:07:36.505
Olha! Diz "olá" à Tia Nat!

02:07:37.494 --> 02:07:38.674
É gordo.

02:07:39.705 --> 02:07:41.260
Um dos nossos técnicos
detectou isto.

02:07:41.832 --> 02:07:44.847
Caiu no Mar de Banda.

02:07:45.377 --> 02:07:47.170
Pode ser o Quinjet.

02:07:47.171 --> 02:07:51.020
Mas tem a tecnologia furtiva do Stark
e ainda não conseguimos localizá-lo.

02:07:52.051 --> 02:07:53.814
Pois.

02:07:54.011 --> 02:07:56.651
Ele deve ter saltado
e nadado até às Fiji.

02:07:57.556 --> 02:07:59.682
Há de mandar um postal.

02:07:59.683 --> 02:08:01.697
"Deviam cá estar."

02:08:03.270 --> 02:08:06.994
Mandou-me recrutá-lo,
em tempos que já lá vão.

02:08:08.400 --> 02:08:11.332
Já sabia o que ia acontecer?

02:08:13.197 --> 02:08:15.281
Nunca se sabe.

02:08:15.282 --> 02:08:19.285
Esperamos o melhor
e arranjamo-nos com o que aparece.

02:08:19.286 --> 02:08:21.175
Tenho uma grande equipa.

02:08:21.914 --> 02:08:24.207
Nada dura para sempre.

02:08:24.208 --> 02:08:26.417
Os problemas, Sra. Romanoff.

02:08:26.418 --> 02:08:30.226
Seja quem for que ganhe ou perca,
os problemas aparecem sempre.

02:08:33.717 --> 02:08:35.093
As regras mudaram.

02:08:35.094 --> 02:08:36.803
Estamos a lidar com algo novo.

02:08:36.804 --> 02:08:38.429
O Visão é inteligência artificial.

02:08:38.430 --> 02:08:40.306
-Uma máquina.
-Então, não conta?

02:08:40.307 --> 02:08:42.433
Não. Não foi uma pessoa
a levantar o martelo.

02:08:42.434 --> 02:08:44.310
Pois, as regras para nós
são diferentes.

02:08:44.311 --> 02:08:45.603
-Bom tipo. Artificial.
-Obrigado.

02:08:45.604 --> 02:08:48.869
Ele consegue brandir o martelo,
pode ficar com a Pedra da Mente.

02:08:49.400 --> 02:08:51.734
Está em segurança com o Visão.

02:08:51.735 --> 02:08:54.583
E, hoje em dia,
a segurança não abunda.

02:08:56.281 --> 02:08:58.324
Mas metendo o martelo
num elevador...

02:08:58.325 --> 02:09:00.284
-Subiria na mesma.
-Um elevador não é digno.

02:09:00.285 --> 02:09:02.245
Vou ter saudades
destas nossas conversas.

02:09:02.246 --> 02:09:03.759
A menos que não partas.

02:09:04.123 --> 02:09:06.082
Não tenho escolha.

02:09:06.083 --> 02:09:08.418
A Pedra da Mente
é a quarta das Pedras do Infinito

02:09:08.419 --> 02:09:09.961
a aparecer nos últimos anos.

02:09:09.962 --> 02:09:11.934
Não é uma coincidência.

02:09:12.131 --> 02:09:15.967
Alguém anda a jogar um jogo complexo
e a fazer de nós peões.

02:09:15.968 --> 02:09:17.802
E quando todas as peças
estiverem colocadas...

02:09:17.803 --> 02:09:19.470
Jogo ganho.

02:09:19.471 --> 02:09:21.055
Achas que consegues descobrir
o que aí vem?

02:09:21.056 --> 02:09:22.528
Acho.

02:09:22.975 --> 02:09:27.283
Além deste tipo aqui,
não há nada inexplicável.

02:09:34.236 --> 02:09:37.126
Aquele homem não tem respeito
nenhum pela conservação de relvados.

02:09:39.908 --> 02:09:42.660
Mas vou ter saudades dele.
E tu, de mim.

02:09:42.661 --> 02:09:45.134
Haverá muitas lágrimas másculas.

02:09:46.415 --> 02:09:48.332
Vou mesmo ter saudades tuas.

02:09:48.333 --> 02:09:49.459
Sim?

02:09:49.460 --> 02:09:52.128
Está na hora de me pirar.

02:09:52.129 --> 02:09:54.464
Talvez deva seguir
o exemplo do Barton.

02:09:54.465 --> 02:09:57.772
Comprar uma quinta à Pepper
e esperar que ninguém a rebente.

02:09:58.177 --> 02:09:59.594
Uma vida simples.

02:09:59.595 --> 02:10:00.970
Hás de conseguir, um dia.

02:10:00.971 --> 02:10:02.138
Não sei.

02:10:02.139 --> 02:10:05.237
Família, estabilidade...

02:10:05.684 --> 02:10:08.991
O tipo que queria tudo isso
entrou no gelo há 75 anos.

02:10:10.314 --> 02:10:12.578
Acho que saiu de lá outra pessoa.

02:10:16.361 --> 02:10:17.583
Estás bem?

02:10:19.865 --> 02:10:21.962
Estou em casa.

02:10:29.208 --> 02:10:32.168
Queres continuar a olhar
para a parede ou queres trabalhar?

02:10:32.169 --> 02:10:33.669
É uma parede
bastante interessante...

02:10:33.670 --> 02:10:36.964
Pensava que tu e o Tony ainda
estavam a trocar olhares intensos.

02:10:36.965 --> 02:10:38.049
Que tal estamos?

02:10:38.050 --> 02:10:40.468
Não somos os Yankees de 1927.

02:10:40.469 --> 02:10:42.345
Temos bons jogadores.

02:10:42.346 --> 02:10:45.097
São bons,
mas não são uma equipa.

02:10:45.098 --> 02:10:46.946
Vamos lá pô-los em forma.

02:11:04.993 --> 02:11:06.924
Vingadores...

02:11:08.620 --> 02:11:13.221
Ripadas por:
n0Te

02:13:25.342 --> 02:13:26.689
Muito bem...

02:13:28.220 --> 02:13:30.442
Eu próprio tratarei disso.

02:21:04.676 --> 02:21:08.024
Os Vingadores voltarão

02:21:12.767 --> 02:21:13.851
Distribuído por
NOS Audiovisuais

02:21:13.852 --> 02:21:19.157
Tradução e legendagem
Gonçalo Sousa`,
  1: `WEBVTT

00:00:28.134 --> 00:00:31.136
<i>O Tesseract despertou.</i>

00:00:31.187 --> 00:00:32.607
<i>O Tesseract despertou.</i>

00:00:32.938 --> 00:00:38.404
<i>Está no mundo dos homens.</i>

00:00:38.569 --> 00:00:42.322
<i>Eles manipulariam o poder dele,</i>

00:00:42.323 --> 00:00:48.539
<i>mas o nosso aliado conhece-o</i>
<i>como nunca o conhecerão eles.</i>

00:00:49.538 --> 00:00:52.832
<i>Ele está pronto para comandar</i>

00:00:52.833 --> 00:00:58.716
<i>e as nossas forças,</i>
<i>os Chitauri, segui-lo-ão.</i>

00:00:59.965 --> 00:01:02.509
<i>Será dele um mundo,</i>

00:01:02.510 --> 00:01:05.845
<i>o Universo, vosso.</i>

00:01:05.846 --> 00:01:12.271
<i>Por que força</i>
<i>nos poderá resistir?</i>

00:01:25.992 --> 00:01:30.415
<i>A todo o pessoal, confirmada</i>
<i>ordem de evacuação.</i>

00:01:30.955 --> 00:01:33.418
MISSÃO CONJUNTA
DE ENERGIA NEGRA

00:02:01.360 --> 00:02:03.111
O caso está feio?

00:02:03.112 --> 00:02:06.784
É esse o problema,
não sabermos.

00:02:09.894 --> 00:02:12.938
O Dr. Selvig notou um surto
de energia no Tesseract há 4 horas.

00:02:12.939 --> 00:02:14.981
A NASA não o autorizou
a testá-lo.

00:02:14.982 --> 00:02:17.359
Não o testava,
nem sequer lá estava.

00:02:17.360 --> 00:02:18.526
Foi espontâneo.

00:02:18.527 --> 00:02:19.903
Ligou-se sozinho?

00:02:19.904 --> 00:02:21.154
Como estão os níveis energéticos?

00:02:21.155 --> 00:02:23.490
A subir, e como não o pôde desligar,
o Selvig ordenou a evacuação.

00:02:23.491 --> 00:02:24.950
Quanto levam todos a sair?

00:02:24.951 --> 00:02:28.450
- Mais uma meia hora.
- Menos que isso.

00:02:28.663 --> 00:02:30.872
A evacuação pode ser inútil.

00:02:30.873 --> 00:02:32.415
Mandamo-los voltar para a cama?

00:02:32.416 --> 00:02:34.876
Ou controlamos
a energia do Tesseract

00:02:34.877 --> 00:02:37.379
ou pode não haver
distância mínima de segurança.

00:02:37.380 --> 00:02:40.298
Certifique-se que os protótipos
da Fase 2 são evacuados.

00:02:40.299 --> 00:02:42.550
Essa será agora
uma prioridade?

00:02:42.551 --> 00:02:47.135
Até a Terra acabar, agimos como se ela
tencionasse continuar a rodopiar.

00:02:47.390 --> 00:02:49.766
Meta todo o material
da Fase 2

00:02:49.767 --> 00:02:52.223
num camião e suma-se.

00:02:53.271 --> 00:02:55.101
Venham.

00:02:57.400 --> 00:02:59.105
Diga coisas, Doutor.

00:03:00.278 --> 00:03:01.861
Director...

00:03:01.862 --> 00:03:03.697
Há certezas sobre alguma coisa?

00:03:03.698 --> 00:03:06.157
Só que o Tesseract
se portou mal.

00:03:06.158 --> 00:03:09.160
- Isso foi para ter graça?
- Não tem nenhuma.

00:03:09.161 --> 00:03:12.914
O Tesseract não está só activo,
tem vontade própria.

00:03:12.915 --> 00:03:16.376
- Imagino que o desligou?
- É uma fonte energética,

00:03:16.377 --> 00:03:19.296
mal o desligamos
volta a autoligar-se.

00:03:19.297 --> 00:03:20.547
Se atinge a máxima...

00:03:20.548 --> 00:03:24.217
Preparámo-nos para isto,
para utilizar a energia do espaço.

00:03:24.218 --> 00:03:27.220
Ainda não podemos,
falta-me fazer cálculos

00:03:27.221 --> 00:03:30.307
e ele liberta interferências,
radiação...

00:03:30.308 --> 00:03:32.680
Nada de grave,
radiações gama baixas.

00:03:32.935 --> 00:03:34.978
Podem fazer mal...

00:03:34.979 --> 00:03:38.978
- O Agente Barton?
- O Falcão?

00:03:39.150 --> 00:03:41.773
Está no ninho dele,
como sempre.

00:03:42.612 --> 00:03:45.110
<i>Agente Barton, comunique.</i>

00:03:45.323 --> 00:03:48.450
Dei-lhe isto assim
para poder controlar as coisas.

00:03:48.451 --> 00:03:49.910
Vejo melhor ao longe.

00:03:49.911 --> 00:03:52.495
Agente Barton, viu o que
possa ter causado isto?

00:03:52.496 --> 00:03:54.706
Doutor, os picos voltaram.

00:03:54.707 --> 00:03:58.168
Ninguém entrou ou saiu.
E o Selvig nada fez.

00:03:58.169 --> 00:04:00.962
Sem contactos, sem mensagens.

00:04:00.963 --> 00:04:03.419
Se houve interferências
não foram deste lado.

00:04:04.634 --> 00:04:06.217
"Deste lado?"

00:04:06.218 --> 00:04:10.802
O Cubo não é suposto ser um portal
para o outro lado do espaço?

00:04:11.807 --> 00:04:13.847
Portas abrem-se
de dois lados...

00:04:13.976 --> 00:04:15.974
Não para já...

00:05:23.212 --> 00:05:27.003
O senhor baixe a lança.

00:06:05.588 --> 00:06:07.460
Tens coração...

00:06:37.411 --> 00:06:39.617
Não mo tire.

00:06:40.623 --> 00:06:42.123
Ainda preciso dele.

00:06:42.124 --> 00:06:43.750
Isto não precisa
de ficar mais feio...

00:06:43.751 --> 00:06:45.252
Claro que precisa.

00:06:45.253 --> 00:06:47.709
Vim de demasiado longe
para outra coisa.

00:06:49.048 --> 00:06:52.464
Sou Loki, de Asgard,

00:06:52.510 --> 00:06:55.136
e o meu fardo
são actos gloriosos.

00:06:55.137 --> 00:06:57.013
Loki,

00:06:57.014 --> 00:06:58.515
irmão de Thor.

00:06:58.516 --> 00:07:01.226
Não temos nada contra
a vossa gente.

00:07:01.227 --> 00:07:04.729
Uma formiga nada tem
contra uma bota.

00:07:04.730 --> 00:07:06.731
Pensa pisar-nos?

00:07:06.732 --> 00:07:10.482
Vim trazer uma boa nova.

00:07:11.070 --> 00:07:13.321
A de um mundo libertado.

00:07:13.322 --> 00:07:14.614
Libertado de quê?

00:07:14.615 --> 00:07:16.408
Da liberdade.

00:07:16.409 --> 00:07:19.244
Que é a grande mentira
da vida,

00:07:19.245 --> 00:07:23.328
uma vez isso aceite,
bem dentro do coração...

00:07:27.211 --> 00:07:29.337
E conhecerá a paz.

00:07:29.338 --> 00:07:32.007
É, fala em paz,

00:07:32.008 --> 00:07:34.092
mas creio que se refere
à outra coisa.

00:07:34.093 --> 00:07:36.761
O Director Fury
procura ganhar tempo,

00:07:36.762 --> 00:07:40.678
isto está prestes a explodir
e a soterrar-nos.

00:07:41.475 --> 00:07:44.060
- É a intenção dele.
- Como aos antigos faraós.

00:07:44.061 --> 00:07:46.479
Ele tem razão,
o portal entrou em colapso,

00:07:46.480 --> 00:07:48.815
temos talvez 2 minutos
até tudo ficar crítico.

00:07:48.816 --> 00:07:50.522
Pois bem...

00:08:05.583 --> 00:08:07.372
Preciso daqueles veículos.

00:08:10.713 --> 00:08:13.545
- Quem é ele?
- Não me disseram.

00:08:16.093 --> 00:08:17.761
<i>Hill!</i>

00:08:17.762 --> 00:08:19.717
Agente Hill, ouve-me?

00:08:19.722 --> 00:08:21.803
<i>O Barton virou a casaca.</i>

00:08:34.195 --> 00:08:37.694
Eles levam o Tesseract,
impeçam-nos!

00:09:13.442 --> 00:09:16.274
Pronto, embora.
Deixa isso, desanda!

00:09:32.128 --> 00:09:34.876
O helicóptero só o espera a si.

00:11:06.222 --> 00:11:07.847
<i>Diretor?</i>

00:11:07.848 --> 00:11:09.641
Director Fury, ouve-me?

00:11:09.642 --> 00:11:12.102
Forças hostis têm
em seu poder o Tesseract.

00:11:12.103 --> 00:11:14.813
Tenho aqui feridos.

00:11:14.814 --> 00:11:16.940
Há muitos ainda soterrados.

00:11:16.941 --> 00:11:18.858
Não sei o número de sobreviventes.

00:11:18.859 --> 00:11:20.277
<i>Envie um alerta geral,</i>

00:11:20.278 --> 00:11:23.280
quero todos os capazes
a procurarem aquela pasta.

00:11:23.281 --> 00:11:24.531
Entendido.

00:11:24.532 --> 00:11:28.448
Coulson, volte à Base,
isto é um Nível Sete.

00:11:28.911 --> 00:11:30.704
<i>A partir de agora</i>

00:11:30.705 --> 00:11:32.786
estamos em guerra.

00:11:33.833 --> 00:11:35.872
Que fazemos?

00:11:40.506 --> 00:11:49.469
<b>OS VINGADORES

00:12:12.038 --> 00:12:15.874
Não foi desta maneira
que antevi esta noite...

00:12:15.875 --> 00:12:17.709
Calculo como a anteviu.

00:12:17.710 --> 00:12:18.877
Acredite,

00:12:18.878 --> 00:12:20.583
assim é melhor.

00:12:20.922 --> 00:12:23.131
Para quem trabalha?

00:12:23.132 --> 00:12:25.338
Para o Lermentov?

00:12:26.719 --> 00:12:28.803
Pensará ele

00:12:28.804 --> 00:12:30.889
ser-nos necessário

00:12:30.890 --> 00:12:33.012
para exportarmos a carga?

00:12:33.643 --> 00:12:38.563
Pensei que as exportações
fossem com o Gen. Solohob.

00:12:38.564 --> 00:12:40.690
O Solohob

00:12:40.691 --> 00:12:43.481
é um mero correio,
uma fachada.

00:12:45.154 --> 00:12:50.113
Essa informação está desactualizada,
e traiu-a.

00:12:50.952 --> 00:12:54.367
A famosa Viúva Negra...

00:12:55.373 --> 00:13:00.373
E afinal não é mais
do que só outra cara bonita.

00:13:00.628 --> 00:13:04.377
Acha-me mesmo bonita?

00:13:06.300 --> 00:13:08.843
Diz ao Lermentov
que não precisamos dele

00:13:08.844 --> 00:13:13.178
para vender os tanques.

00:13:13.432 --> 00:13:16.476
Diz-lhe que está de fora.

00:13:16.477 --> 00:13:18.767
Bom...

00:13:20.940 --> 00:13:23.313
Se calhar vais precisar
de o escrever.

00:13:31.742 --> 00:13:33.823
É para ela.

00:13:36.622 --> 00:13:38.039
Ouça bem...

00:13:38.040 --> 00:13:40.875
<i>Estão no 1-14 da Silensky Plaza,</i>
<i>3º. andar.</i>

00:13:40.876 --> 00:13:43.666
<i>Temos um F-22</i>
<i>a 13 km daí.</i>

00:13:43.879 --> 00:13:46.047
<i>Passe-lhe o telefone a ela</i>
<i>ou destruo o prédio</i>

00:13:46.048 --> 00:13:48.797
<i>antes que chegue ao rés-do-chão.</i>

00:13:54.599 --> 00:13:56.892
- <i>És precisa.</i>
- Gozas comigo? Estou a trabaIhar.

00:13:56.893 --> 00:13:58.393
<i>Isto é mais importante.</i>

00:13:58.394 --> 00:14:02.355
Estou a meio dum interrogatório,
o burro está a revelar tudo.

00:14:02.356 --> 00:14:05.647
Revelei lá alguma coisa...

00:14:06.485 --> 00:14:07.819
Não me podem retirar
disto agora.

00:14:07.820 --> 00:14:09.526
<i>Natasha...</i>

00:14:10.531 --> 00:14:12.654
O Barton corre perigo.

00:14:15.202 --> 00:14:17.784
Vou pôr-te em espera.

00:14:58.871 --> 00:14:59.996
Onde está o Barton?

00:14:59.997 --> 00:15:01.748
- <i>Não sabemos.</i>
- Mas está vivo?

00:15:01.749 --> 00:15:04.751
Achamos que sim,
volta e pomos-te a par.

00:15:04.752 --> 00:15:06.962
Mas primeiro tens
de falar com o grandalhão.

00:15:06.963 --> 00:15:10.754
Tu sabes que o Stark confia
tanto em mim como no Diabo.

00:15:10.883 --> 00:15:14.382
O Stark é comigo,
contigo é o grandalhão.

00:15:38.369 --> 00:15:39.911
Quem é?

00:15:39.912 --> 00:15:41.121
Saia daqui!

00:15:41.122 --> 00:15:43.748
Existe aqui doença!

00:15:43.749 --> 00:15:45.455
É médico...

00:15:46.502 --> 00:15:47.877
O meu pai não acorda!

00:15:47.878 --> 00:15:51.006
Tem febre e geme
mas não abre os olhos.

00:15:51.007 --> 00:15:52.712
Tem calma...

00:15:53.634 --> 00:15:55.381
O papá...

00:15:57.054 --> 00:15:58.760
Está como eles?

00:16:02.059 --> 00:16:04.057
Por favor...

00:16:30.588 --> 00:16:33.048
Devias ter sido pago
adiantado, Banner.

00:16:33.049 --> 00:16:36.009
Para alguém que devia
evitar stress

00:16:36.010 --> 00:16:39.884
belo lugar escolheu
para assentar...

00:16:40.973 --> 00:16:43.433
O segredo não está
em fugir ao stress.

00:16:43.434 --> 00:16:46.558
Onde então, no ioga?

00:16:47.063 --> 00:16:50.937
Trouxe-me aos limites
da cidade... Inteligente.

00:16:51.234 --> 00:16:55.108
Calculo que tenha
isto tudo cercado?

00:16:55.321 --> 00:16:57.444
Estamos só os dois.

00:16:57.949 --> 00:17:00.158
E a sua amiga actriz?

00:17:00.159 --> 00:17:02.619
Também é espia?
Começam assim tão novas?

00:17:02.620 --> 00:17:03.995
Eu comecei.

00:17:03.996 --> 00:17:05.247
Quem é?

00:17:05.248 --> 00:17:07.078
Natasha Romanoff.

00:17:09.794 --> 00:17:14.172
E veio matar-me, Sra. Romanoff?
Porque nem todos o conseguem.

00:17:14.173 --> 00:17:17.297
Claro que não,
vim mandada pela S.H.I.E.L.D.

00:17:18.469 --> 00:17:20.550
Pela S.H.I.E.L.D...

00:17:21.722 --> 00:17:24.724
- Como me encontraram?
- Nunca perdemos o doutor.

00:17:24.725 --> 00:17:25.934
Mantivemo-nos afastados,

00:17:25.935 --> 00:17:29.437
até o ajudámos a escapar
de outros interessados.

00:17:29.438 --> 00:17:30.564
Porquê?

00:17:30.565 --> 00:17:33.149
O Nick Fury parece
confiar em si...

00:17:33.150 --> 00:17:35.398
Mas agora é preciso.

00:17:35.778 --> 00:17:37.779
E se recusar?

00:17:37.780 --> 00:17:40.570
Eu convenço-o.

00:17:42.034 --> 00:17:47.122
E se disser não o... outro?

00:17:47.123 --> 00:17:48.957
Há mais de um ano
que está estável,

00:17:48.958 --> 00:17:52.165
não penso que queira
interromper o recorde.

00:17:53.796 --> 00:17:57.087
Nem sempre tenho o que quero...

00:17:57.383 --> 00:18:00.340
Uma catástrofe em potência
enfrenta o mundo.

00:18:01.304 --> 00:18:03.889
Tento sempre evitá-las...

00:18:03.890 --> 00:18:06.182
Isto...

00:18:06.183 --> 00:18:08.810
É o Tesseract.

00:18:08.811 --> 00:18:12.185
Tem a energia potencial
para destruir o planeta.

00:18:14.817 --> 00:18:16.693
E o Fury pede o quê,
que o engula?

00:18:16.694 --> 00:18:19.859
Quer que o encontre.
Foi roubado.

00:18:19.947 --> 00:18:24.326
Emite radiações gama demasiado
fracas para serem perceptíveis.

00:18:24.327 --> 00:18:27.495
E ninguém as conhece
como o senhor.

00:18:27.496 --> 00:18:30.874
Se houvesse, eu estaria lá.

00:18:30.875 --> 00:18:33.251
Então não é o monstro
que quer o Fury?

00:18:33.252 --> 00:18:37.547
- Não que mo tenha dito.
- E ele diz-lhe tudo?

00:18:37.548 --> 00:18:39.591
Fale com ele, precisa de si.

00:18:39.592 --> 00:18:41.426
- Dentro duma jaula?
- Não o ia pôr numa...

00:18:41.427 --> 00:18:43.174
Não me minta!

00:18:46.641 --> 00:18:49.931
Desculpe, fui desagradável.

00:18:50.144 --> 00:18:53.059
Só quis ver o que faria.

00:18:53.564 --> 00:18:57.317
E fizermos isto
da forma mais fácil,

00:18:57.318 --> 00:18:59.236
em que não usa isso

00:18:59.237 --> 00:19:02.735
e o outro tipo não provoca
uma grande confusão?

00:19:02.865 --> 00:19:04.904
Pode ser?

00:19:05.201 --> 00:19:07.240
Natasha?

00:19:12.166 --> 00:19:13.955
Calma.

00:19:14.168 --> 00:19:16.458
<i>Está tudo bem.</i>

00:19:17.588 --> 00:19:19.836
"Estamos só os dois..."

00:19:21.300 --> 00:19:24.094
<i>Não sabe o que diz, Director,</i>

00:19:24.095 --> 00:19:27.138
<i>lida com forças</i>
<i>que não sabe controlar.</i>

00:19:27.139 --> 00:19:30.600
Já esteve numa guerra, Conselheiro?
Num tiroteio?

00:19:30.601 --> 00:19:33.603
Sentiu um excesso de controlo?

00:19:33.604 --> 00:19:37.065
<i>Diz que esse Asgard</i>
<i>declarou guerra à Terra?</i>

00:19:37.066 --> 00:19:39.901
Não Asgard, Loki.

00:19:39.902 --> 00:19:42.862
<i>Não pode estar sozinho,</i>
<i>que é feito do outro?</i>

00:19:42.863 --> 00:19:43.989
<i>Do irmão?</i>

00:19:43.990 --> 00:19:46.324
Cremos saber que Thor
não nos é hostil,

00:19:46.325 --> 00:19:49.411
mas está longe,
não podemos contar com a ajuda dele.

00:19:49.412 --> 00:19:50.662
Cabe-nos a nós.

00:19:50.663 --> 00:19:53.248
<i>Razão para se concentrar</i>
<i>na Fase 2,</i>

00:19:53.249 --> 00:19:54.916
<i>que foi criada para...</i>

00:19:54.917 --> 00:19:58.169
<i>A Fase 2 está inacabada,</i>
<i>não o inimigo.</i>

00:19:58.170 --> 00:19:59.963
Precisamos duma equipa
de resposta.

00:19:59.964 --> 00:20:02.549
<i>Os Vingadores foram</i>
<i>desconvocados.</i>

00:20:02.550 --> 00:20:04.551
Não falo deles.

00:20:04.552 --> 00:20:05.886
<i>Nós lemos a lista.</i>

00:20:05.887 --> 00:20:08.221
<i>Dirige a maior rede</i>
<i>de segurança mundial</i>

00:20:08.222 --> 00:20:11.349
<i>e não vai entregar o destino</i>
<i>da humanidade a monstros.</i>

00:20:11.350 --> 00:20:13.476
Não entrego nada a ninguém.

00:20:13.477 --> 00:20:15.979
Precisamos duma equipa
de resposta.

00:20:15.980 --> 00:20:18.940
Eles talvez estejam isolados,
até desequilibrados,

00:20:18.941 --> 00:20:23.320
mas bem encorajados, creio serem
exactamente o que precisamos.

00:20:23.321 --> 00:20:24.905
<i>"Crê"?</i>

00:20:24.906 --> 00:20:29.072
<i>Guerras não são ganhas</i>
<i>por sentimentos, Director.</i>

00:20:29.160 --> 00:20:33.201
Pois, são ganhas por soldados.

00:20:52.099 --> 00:20:55.849
<i>Não há tempo,</i>
<i>tenho de tentar amará-lo!</i>

00:21:01.067 --> 00:21:02.692
<i>Não estarás só.</i>

00:21:02.693 --> 00:21:04.611
<i>Meu Deus.</i>

00:21:04.612 --> 00:21:06.526
<i>Este tipo está vivo!</i>

00:21:30.555 --> 00:21:33.011
Problemas para dormir?

00:21:33.641 --> 00:21:36.931
Eu dormi 70 anos,
acho que me chegam.

00:21:37.895 --> 00:21:42.437
Pois então devia sair,
festejar, ver o mundo.

00:21:47.613 --> 00:21:50.657
Quando me congelaram
o mundo estava em guerra.

00:21:50.658 --> 00:21:53.198
Acordo, e dizem-me
que a ganhámos.

00:21:53.202 --> 00:21:55.328
Mas não o que perdemos.

00:21:55.329 --> 00:21:58.123
É, cometemos alguns erros...

00:21:58.124 --> 00:22:00.413
Alguns, recentemente.

00:22:01.294 --> 00:22:03.795
- Veio cá com uma missão?
- Vim.

00:22:03.796 --> 00:22:05.964
A de tentar fazer-me
regressar ao mundo?

00:22:05.965 --> 00:22:08.338
A de tentar salvá-lo.

00:22:12.263 --> 00:22:14.431
A arma secreta da HYDRA.

00:22:14.432 --> 00:22:18.351
Foi pescada pelo Howard Stark
enquanto o procurava a si.

00:22:18.352 --> 00:22:20.186
Ele pensou como nós,

00:22:20.187 --> 00:22:24.900
que o Tesseract pode proporcionar
energia sustentada ilimitada.

00:22:24.901 --> 00:22:29.359
Uma coisa de que
o mundo precisa mesmo.

00:22:30.197 --> 00:22:33.199
- Quem o roubou?
- Ele chama-se Loki.

00:22:33.200 --> 00:22:36.286
Não é destas paragens...

00:22:36.287 --> 00:22:40.582
Há muito que terá de saber,
querendo juntar-se a nós,

00:22:40.583 --> 00:22:44.377
o mundo tornou-se bem mais
estranho do que já acha.

00:22:44.378 --> 00:22:47.547
Já duvido que alguma coisa
ainda me surpreenda...

00:22:47.548 --> 00:22:49.921
Apostamos que se engana?

00:22:51.052 --> 00:22:55.635
Tem um <i>dossier</i> à sua espera
no seu apartamento.

00:22:57.350 --> 00:23:00.852
Há alguma coisa que nos possa dizer
do Tesseract que devêssemos saber?

00:23:00.853 --> 00:23:03.852
Que o deviam
ter deixado no mar.

00:23:35.888 --> 00:23:38.974
Deste lado, tudo pronto.

00:23:38.975 --> 00:23:41.518
<i>Desligaste os cabos de transmissão,</i>
<i>estamos fora da rede?</i>

00:23:41.519 --> 00:23:45.480
A Torre Stark vai tornar-se num marco
de energia limpa autosustentada.

00:23:45.481 --> 00:23:49.192
<i>Desde que o reactor tome conta</i>
<i>e funcione realmente?</i>

00:23:49.193 --> 00:23:51.111
Desde que...

00:23:51.112 --> 00:23:52.734
Liga-a.

00:23:57.535 --> 00:23:58.702
<i>Então, que tal?</i>

00:23:58.703 --> 00:24:01.580
Parece ser Natal,
mas à minha maneira.

00:24:01.581 --> 00:24:03.456
<i>Temos de levar a campanha</i>
<i>a mais gente,</i>

00:24:03.457 --> 00:24:05.163
<i>fala com jornalistas.</i>

00:24:05.209 --> 00:24:08.044
<i>Amanhã vou a Washington,</i>
<i>demarcar mais três prédios.</i>

00:24:08.045 --> 00:24:10.463
Pepper, tu matas-me...

00:24:10.464 --> 00:24:13.546
- Há que gozar o momento.
- <i>Põe-te cá e já gozo.</i>

00:24:16.262 --> 00:24:19.681
<i>O senhor tem em linha</i>
<i>o Agente Coulson da S.H.I.E.L.D.</i>

00:24:19.682 --> 00:24:21.391
Eu não estou.

00:24:21.392 --> 00:24:23.389
Estou até já fora.

00:24:29.901 --> 00:24:32.736
<i>Receio que ele insiste...</i>

00:24:32.737 --> 00:24:36.152
Mostra tomates, Jarvis,
tenho um encontro.

00:24:40.077 --> 00:24:43.246
Os níveis estão estacionários.

00:24:43.247 --> 00:24:45.624
É claro,
estive directamente envolvido.

00:24:45.625 --> 00:24:49.169
E a pergunta seguinte é,
que tal é ser-se um génio?

00:24:49.170 --> 00:24:51.588
Como posso saber?

00:24:51.589 --> 00:24:56.301
Que queres dizer?
Tudo isto foi criação tua.

00:24:56.302 --> 00:25:00.138
Não, foi criação disto.

00:25:00.139 --> 00:25:04.601
Vá, parte do mérito é teu,
a Torre Stark é obra tua.

00:25:04.602 --> 00:25:07.684
Dá-te 12% do mérito.

00:25:07.813 --> 00:25:10.023
- 12%?
- Pronto, vá lá, 15...

00:25:10.024 --> 00:25:11.733
12% obra minha?

00:25:11.734 --> 00:25:15.570
Pronto, o carregar de material
pesado foi feito por mim...

00:25:15.571 --> 00:25:19.616
E o problema com a segurança?
Resolveste-o tu...

00:25:19.617 --> 00:25:21.910
- O meu elevador privado...
- Qual, o nosso?

00:25:21.911 --> 00:25:24.746
estava cheio de operários
pingando suor...

00:25:24.747 --> 00:25:27.332
Vou pagar a graça
sobre percentagens

00:25:27.333 --> 00:25:29.709
de alguma forma subtil,
certo?

00:25:29.710 --> 00:25:31.211
Ela não será subtil.

00:25:31.212 --> 00:25:32.629
Olha, fazemos o seguinte,

00:25:32.630 --> 00:25:35.382
o próximo edifício terá "Potts"
escrito nele.

00:25:35.383 --> 00:25:37.297
No documento legal.

00:25:37.635 --> 00:25:40.011
Liga à tua mãe e pergunta
se podes dormir cá.

00:25:40.012 --> 00:25:41.429
<i>O telefone...</i>

00:25:41.430 --> 00:25:44.474
<i>Os meus protocolos</i>
<i>foram-me retirados.</i>

00:25:44.475 --> 00:25:46.309
<i>Stark, temos de falar.</i>

00:25:46.310 --> 00:25:48.770
Ligou para o andróide duplo
de Tony Stark,

00:25:48.771 --> 00:25:51.022
- é favor deixar mensagem.
- <i>Isto é urgente.</i>

00:25:51.023 --> 00:25:53.438
Pois deixe-a urgentemente.

00:25:54.318 --> 00:25:55.652
A falha de segurança é culpa tua.

00:25:55.653 --> 00:25:58.530
- Sr. Stark...
- Phil, entra!

00:25:58.531 --> 00:25:59.698
"Phil"?

00:25:59.699 --> 00:26:00.907
Não posso ficar.

00:26:00.908 --> 00:26:02.367
O nome dele é "Agente".

00:26:02.368 --> 00:26:06.246
- Entra, vamos festejar...
- Razão para ele não poder ficar.

00:26:06.247 --> 00:26:08.415
Precisamos que leia já
estes papéis.

00:26:08.416 --> 00:26:11.251
- Não gosto que me dêem coisas.
- Ainda bem, eu adoro.

00:26:11.252 --> 00:26:13.208
Troquemos.

00:26:14.005 --> 00:26:16.169
Obrigada.

00:26:16.716 --> 00:26:20.218
Horas de expediente são entre
as 8 e as 17, às quintas.

00:26:20.219 --> 00:26:22.971
- Não se trata de expediente.
- Trata-se dos Vingadores?

00:26:22.972 --> 00:26:25.056
Dos quais nada sei...

00:26:25.057 --> 00:26:27.767
O grupo não tinha sido
desmantelado?

00:26:27.768 --> 00:26:29.394
E nem sequer
tenho habilitações.

00:26:29.395 --> 00:26:30.562
Também não sei isso.

00:26:30.563 --> 00:26:35.025
Parece que sou imprevisível,
obcecado, não lido bem com gente...

00:26:35.026 --> 00:26:36.192
Isso eu sabia.

00:26:36.193 --> 00:26:38.153
Já não estão em causa
personalidades.

00:26:38.154 --> 00:26:40.530
Sra. Potts, tem um segundo?

00:26:40.531 --> 00:26:42.237
Volto já.

00:26:46.829 --> 00:26:49.414
Pensei que íamos ter
uns momentos nossos.

00:26:49.415 --> 00:26:51.663
Eu tive 12% de um...

00:26:52.168 --> 00:26:54.836
Isto parece sério,
o Phil está aflito.

00:26:54.837 --> 00:26:57.005
Como sabes se é...
E ele agora é "Phil"?

00:26:57.006 --> 00:26:58.965
Que se passa?

00:26:58.966 --> 00:27:01.214
Passa-se que...

00:27:01.260 --> 00:27:02.966
Passa-se isto.

00:27:09.602 --> 00:27:12.270
- Tomo hoje o jacto para Washington.
- Amanhã.

00:27:12.271 --> 00:27:14.773
Tu tens montes
de trabalhos de casa.

00:27:14.774 --> 00:27:17.108
E se não tivesse?

00:27:17.109 --> 00:27:21.526
Se não tivesses?
Queres dizer, depois de acabares?

00:27:21.948 --> 00:27:25.905
Bom, depois...

00:27:30.414 --> 00:27:32.328
Combinado, faz boa viagem.

00:27:35.920 --> 00:27:37.792
Trabalha muito.

00:27:39.924 --> 00:27:41.883
Passas por acaso
pelo LaGuardia?

00:27:41.884 --> 00:27:44.844
- Posso deixar-te lá...
- Óptimo.

00:27:44.845 --> 00:27:48.056
Fala-me da violoncelista,
ainda a vês?

00:27:48.057 --> 00:27:49.307
Voltou para Portland.

00:27:49.308 --> 00:27:52.307
O quê?! Chato...

00:28:00.820 --> 00:28:03.943
Estamos a 40 minutos
da Base.

00:28:06.450 --> 00:28:10.328
Esse Dr. Banner tentava replicar
o soro que usaram em mim?

00:28:10.329 --> 00:28:11.955
Tentava muita gente,

00:28:11.956 --> 00:28:14.329
foi você o primeiro
super-herói do mundo.

00:28:14.417 --> 00:28:16.459
E o Banner achou
que radiações gama

00:28:16.460 --> 00:28:19.334
podiam levar à descoberta
da fórmula do Erskine.

00:28:19.672 --> 00:28:23.091
- Mas não resultou?
- Não muito.

00:28:23.092 --> 00:28:26.633
Mas quando não é aquilo,
o tipo é um Stephen Hawking.

00:28:28.014 --> 00:28:31.179
Muito inteligente.

00:28:32.643 --> 00:28:34.102
Tenho de dizer

00:28:34.103 --> 00:28:37.268
que é uma honra conhecê-lo,
oficialmente.

00:28:37.815 --> 00:28:41.439
Já o conhecia...
Observei-o enquanto dormia.

00:28:43.154 --> 00:28:48.533
Quer dizer, estava lá quando
estava inconsciente, devido ao gelo.

00:28:48.534 --> 00:28:53.288
É uma enorme honra
tê-lo connosco nesta...

00:28:53.289 --> 00:28:58.460
- Espero ser digno da tarefa...
- Claro que é, sem dúvida.

00:28:58.461 --> 00:29:01.588
Fizemos umas alterações
no uniforme.

00:29:01.589 --> 00:29:04.758
- Dei a minha contribuição...
- No uniforme?

00:29:04.759 --> 00:29:07.966
A bandeira americana não estará...

00:29:08.346 --> 00:29:10.427
Um pouco fora de moda?

00:29:10.556 --> 00:29:12.849
Com tudo o que
está a acontecer

00:29:12.850 --> 00:29:15.181
e com o que está prestes
a saber-se...

00:29:15.436 --> 00:29:19.561
Talvez seja disso mesmo
que as pessoas precisam.

00:29:51.430 --> 00:29:54.641
Os Chitauri estão impacientes.

00:29:54.642 --> 00:29:58.436
Eles que se preparem, liderá-los-ei
numa gloriosa batalha.

00:29:58.437 --> 00:30:00.185
Batalha?

00:30:00.439 --> 00:30:03.733
Contra o parco poder da Terra?

00:30:03.734 --> 00:30:06.736
Gloriosa, não demorada.

00:30:06.737 --> 00:30:10.782
Se as vossas forças forem
tão poderosas como dizem.

00:30:10.783 --> 00:30:13.535
Duvidas?

00:30:13.536 --> 00:30:18.203
Duvidas dele, de quem te pôs
o ceptro nas mãos?

00:30:18.457 --> 00:30:21.585
Que te deu antiga sabedoria
e novo propósito,

00:30:21.586 --> 00:30:24.671
quando foste expulso,
derrotado?

00:30:24.672 --> 00:30:26.715
Eu era rei!

00:30:26.716 --> 00:30:29.342
O rei legítimo de Asgard.

00:30:29.343 --> 00:30:31.091
Traído...

00:30:31.095 --> 00:30:34.014
Tens pouca ambição,

00:30:34.015 --> 00:30:36.892
e nascida de desejos infantis.

00:30:36.893 --> 00:30:39.102
Nós olhamos
para além da Terra,

00:30:39.103 --> 00:30:42.689
para maiores mundos
que o Tesseract nos revelará.

00:30:42.690 --> 00:30:44.646
Ainda não o possuis...

00:30:46.611 --> 00:30:48.316
Eu não ameaço.

00:30:49.572 --> 00:30:52.240
Mas até abrir as portas,

00:30:52.241 --> 00:30:56.494
até ter a tua força
às minhas ordens,

00:30:56.495 --> 00:30:58.496
tu apenas sabes falar.

00:30:58.497 --> 00:31:03.164
Terás a tua guerra, asgardiano.

00:31:04.253 --> 00:31:06.960
Caso falhes,

00:31:07.215 --> 00:31:11.885
e o Tesseract não cair
nas nossas mãos,

00:31:11.886 --> 00:31:17.015
não haverá reino,
não haverá lua árida,

00:31:17.016 --> 00:31:20.640
não haverá fenda,
onde nos escapes.

00:31:21.270 --> 00:31:24.231
Julgas saber o que é a dor?

00:31:24.232 --> 00:31:26.441
Ele far-te-á desejar

00:31:26.442 --> 00:31:30.442
algo tão doce
como o é a dor.

00:31:59.100 --> 00:32:01.181
Arrume as coisas do capitão.

00:32:02.853 --> 00:32:06.147
Agente Romanoff,
Capitão Rogers.

00:32:06.148 --> 00:32:07.691
Minha senhora...

00:32:07.692 --> 00:32:10.443
É preciso na ponte,
vão começar o rastreio.

00:32:10.444 --> 00:32:12.233
Vejo-os lá.

00:32:13.281 --> 00:32:17.742
Houve por aqui muita excitação,
ao encontrarem-no no gelo.

00:32:17.743 --> 00:32:20.495
Temi que o Coulson desmaiasse...

00:32:20.496 --> 00:32:23.582
Já lhe pediu autógrafos
nos cromos Capitão América?

00:32:23.583 --> 00:32:24.958
Cromos?

00:32:24.959 --> 00:32:27.832
São <i>vintage,</i>
tem muito orgulho neles.

00:32:28.963 --> 00:32:30.919
Dr. Banner!

00:32:32.216 --> 00:32:34.050
Olá...

00:32:34.051 --> 00:32:37.425
- Soube que vinha aí...
- Dizem-no capaz de encontrar o Cubo.

00:32:37.805 --> 00:32:41.930
- É só o que se diz de mim?
- Que me interesse, só.

00:32:43.853 --> 00:32:47.143
Deve achar esquisito,
tudo isto?

00:32:47.148 --> 00:32:50.108
Por acaso até me é familiar.

00:32:50.109 --> 00:32:52.819
Os senhores deverão querer
ir agora para dentro...

00:32:52.820 --> 00:32:56.236
Respirar vai tornar-se difícil.

00:32:56.824 --> 00:32:59.072
Tripulação, protejam o convés.

00:33:02.872 --> 00:33:05.081
Isto é um submarino?

00:33:05.082 --> 00:33:10.583
A sério que me querem num contentor
de metal, submerso e pressurizado?

00:33:36.239 --> 00:33:39.362
Não, isto é muito pior.

00:34:18.906 --> 00:34:22.951
Preparar para subir usando
máxima frequência de capacidade.

00:34:22.952 --> 00:34:25.245
Energia a capacidade necessária.

00:34:25.246 --> 00:34:26.997
Funcionamento, perfeito.

00:34:26.998 --> 00:34:28.707
Todos os motores em ordem.

00:34:28.708 --> 00:34:33.628
Protocolo de Emergência S.H.I.E.L.D.
193.6 implementado.

00:34:33.629 --> 00:34:36.590
- Estamos prontos.
- Óptimo.

00:34:36.591 --> 00:34:40.799
- Desapareçamos.
- Ligar painéis retro-reflectores.

00:34:55.902 --> 00:34:57.611
Invisibilidade obtida.

00:34:57.612 --> 00:34:59.776
Meus senhores...

00:35:11.459 --> 00:35:13.164
Doutor, obrigado por vir.

00:35:14.545 --> 00:35:16.630
Obrigado pelo amável convite...

00:35:16.631 --> 00:35:19.466
Bom, por quanto tempo me quer?

00:35:19.467 --> 00:35:22.677
Mal tenhamos o Tesseract,
pode ir quando quiser.

00:35:22.678 --> 00:35:24.763
Avançaram já muito?

00:35:24.764 --> 00:35:28.183
Varremos todas as câmaras
<i>wireless</i> acessíveis do planeta,

00:35:28.184 --> 00:35:30.560
telemóveis, portáteis...

00:35:30.561 --> 00:35:34.064
Se está ligado a um satélite
é nossos olhos e ouvidos.

00:35:34.065 --> 00:35:35.523
Mas não vão encontrá-lo a tempo.

00:35:35.524 --> 00:35:36.733
Têm de estreitar o campo,

00:35:36.734 --> 00:35:38.944
a quantos espectrómetros
têm acesso?

00:35:38.945 --> 00:35:40.737
- Quantos são eles?
- Liguem aos laboratórios todos,

00:35:40.738 --> 00:35:44.241
instalem-nos e calibrem-nos
para ler raios gama,

00:35:44.242 --> 00:35:47.702
eu improviso um algoritmo
que leia concentração de gamas.

00:35:47.703 --> 00:35:50.288
Assim pelo menos
eliminamos alguns sítios...

00:35:50.289 --> 00:35:52.829
Têm onde eu possa trabalhar?

00:35:52.833 --> 00:35:56.666
Agente Romanoff, mostra o laboratório
dele ao Dr. Banner?

00:35:57.129 --> 00:36:00.128
Vai adorá-lo,
temos lá os brinquedos todos.

00:36:00.132 --> 00:36:02.630
Ponham ali.

00:36:03.886 --> 00:36:06.179
Onde descobriram tanta gente?

00:36:06.180 --> 00:36:09.683
À S.H.I.E.L.D.
não faltam inimigos...

00:36:09.684 --> 00:36:12.018
- Foi isto que pediu?
- Foi, irídio.

00:36:12.019 --> 00:36:14.896
Existe em meteoritos
e forma antiprotões.

00:36:14.897 --> 00:36:16.731
É tramado de obter.

00:36:16.732 --> 00:36:18.733
Principalmente sabendo
a S.H.I.E.L.D. que precisa...

00:36:18.734 --> 00:36:20.648
Eu não sabia!

00:36:21.571 --> 00:36:24.197
O Tesseract mostrou-me
tanta coisa...

00:36:24.198 --> 00:36:26.157
Mais do que conhecimento,
verdade.

00:36:26.158 --> 00:36:30.617
- Bem sei...
- A si, o que lhe mostrou, Barton?

00:36:30.997 --> 00:36:34.120
- O meu alvo seguinte.
- Diga-me o que precisa.

00:36:37.044 --> 00:36:39.584
Duma diversão.

00:36:39.839 --> 00:36:41.836
E duma córnea.

00:36:48.014 --> 00:36:50.724
Bom, caso não dê
muito trabalho...

00:36:50.725 --> 00:36:52.430
Claro que não dá.

00:36:54.896 --> 00:36:56.688
É uma colecção <i>vintage,</i>

00:36:56.689 --> 00:36:59.604
levou-me uns anos
a reuni-los todos.

00:37:01.485 --> 00:37:04.362
Estão como novos, têm só
distorções nas extremidades...

00:37:04.363 --> 00:37:07.407
Localização com
67% de probabilidades.

00:37:07.408 --> 00:37:09.656
Espere, 79%,
após verificação.

00:37:10.036 --> 00:37:11.202
Local?

00:37:11.203 --> 00:37:14.497
Estugarda, na Alemanha.
28, Königstrasse.

00:37:14.498 --> 00:37:15.999
Não se esconde, propriamente.

00:37:16.000 --> 00:37:19.040
Capitão, agora é consigo.

00:39:53.866 --> 00:39:55.697
De joelhos, perante mim.

00:39:59.497 --> 00:40:01.453
Eu disse...

00:40:02.875 --> 00:40:05.707
DE JOELHOS!

00:40:14.303 --> 00:40:18.386
Assim não é tão mais simples?

00:40:19.267 --> 00:40:23.141
Não é esse
o vosso estado natural?

00:40:24.814 --> 00:40:28.149
Eis a verdade nunca dita
sobre a humanidade,

00:40:28.150 --> 00:40:31.232
ela ansiar pela submissão.

00:40:31.487 --> 00:40:35.073
O claro apelo da liberdade
diminui-lhe a alegria de viver

00:40:35.074 --> 00:40:38.364
numa louca luta por poder,

00:40:39.495 --> 00:40:41.618
por identidade.

00:40:42.540 --> 00:40:46.501
Ela foi feita para ser dominada.

00:40:46.502 --> 00:40:48.420
No final,

00:40:48.421 --> 00:40:51.419
acabam sempre de joelhos.

00:40:58.097 --> 00:41:00.720
Não perante os da sua laia.

00:41:01.100 --> 00:41:03.640
Não há outros como eu.

00:41:03.853 --> 00:41:07.477
Há sempre outros como você.

00:41:08.024 --> 00:41:10.605
Olhem para o vosso ancião.

00:41:12.069 --> 00:41:14.150
Ele que sirva de exemplo.

00:41:20.286 --> 00:41:23.079
Sabes, a última vez
que vim à Alemanha

00:41:23.080 --> 00:41:26.458
e vi um homem de pé
e acima de todos,

00:41:26.459 --> 00:41:30.792
- acabámos discordando.
- O soldado...

00:41:32.173 --> 00:41:34.007
O homem fora do seu tempo.

00:41:34.008 --> 00:41:35.922
Não estou eu sem tempo...

00:41:38.763 --> 00:41:41.970
<i>Loki, larga a arma</i>
<i>e rende-te.</i>

00:42:01.702 --> 00:42:05.076
- Ajoelha-te.
- Hoje, não!

00:42:06.874 --> 00:42:08.830
Ele não para quieto...

00:42:11.671 --> 00:42:14.339
<i>Agente Romanoff.</i>
<i>Teve saudades minhas?</i>

00:42:14.340 --> 00:42:16.045
SUBSTITUIÇÃO DE SISTEMA

00:42:30.773 --> 00:42:32.190
<i>Dá tudo o que tens, Rena.</i>

00:42:32.191 --> 00:42:33.605
<i>Dá tudo o que tens, Rena.</i>

00:42:40.575 --> 00:42:42.697
Bem jogado.

00:42:43.744 --> 00:42:45.704
Sr. Stark...

00:42:45.705 --> 00:42:47.619
Capitão.

00:42:54.130 --> 00:42:55.964
<i>Ele diz alguma coisa?</i>

00:42:55.965 --> 00:43:00.090
- Nada.
- <i>Trá-lo para cá, o tempo escasseia.</i>

00:43:02.638 --> 00:43:06.057
- Não gosto...
- Ele desiste tão facilmente?

00:43:06.058 --> 00:43:09.477
Com ele nunca nada é fácil,
o gajo é um tanque vivo.

00:43:09.478 --> 00:43:13.812
Mas para velhadas
energia não te falta...

00:43:14.150 --> 00:43:17.193
- Fazes o quê, Pilates?
- O quê?

00:43:17.194 --> 00:43:20.405
São exercícios. É natural que
tenhas perdido umas coisas.

00:43:20.406 --> 00:43:22.779
Metido numa cápsula...

00:43:23.993 --> 00:43:25.744
O Fury não me disse
que te ia chamar.

00:43:25.745 --> 00:43:29.039
Há muitas coisas
que ele não te diz.

00:43:29.040 --> 00:43:31.287
De onde vem isto agora?

00:43:34.670 --> 00:43:37.672
Que foi, assustam-te
uns relampagozinhos?

00:43:37.673 --> 00:43:40.755
Não aprecio muito
o que vai seguir...

00:43:57.777 --> 00:43:59.691
Que vais fazer?

00:44:11.958 --> 00:44:15.585
- Segue-se agora aquele.
- Outro asgardiano?

00:44:15.586 --> 00:44:17.671
- Este é amigo?
- Não interessa,

00:44:17.672 --> 00:44:20.423
liberte ou mate o Loki,
perdemos sempre o Tesseract.

00:44:20.424 --> 00:44:22.551
Stark, necessitamos
dum plano de ataque!

00:44:22.552 --> 00:44:25.508
Eu tenho um plano.
Atacar.

00:44:30.851 --> 00:44:34.354
- Eu cá não me metia...
- Não vejo como possa.

00:44:34.355 --> 00:44:37.107
Estes gajos são lendários,
são basicamente deuses.

00:44:37.108 --> 00:44:41.566
Deus há só um. E de certeza
que não se veste assim.

00:44:56.377 --> 00:44:57.919
Onde está o Tesseract?

00:44:57.920 --> 00:45:01.795
- Também tive saudades tuas...
- Pareço-te apetecer-me brincar?

00:45:01.799 --> 00:45:03.633
